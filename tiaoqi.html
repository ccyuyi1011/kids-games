    const h = Math.round(d * unitsH(n));
    const dpr = Math.min(3, Math.max(1, window.devicePixelRatio || 1));
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    cv.style.width = w + 'px';
    cv.style.height = h + 'px';
    const x = cv.getContext('2d');
    x.scale(dpr, dpr);
    const v = makeView(n, w, h, dpr);
    drawBoardBase(x, v);
    const g = AI.geometry(n);
    const av = Store.data.avatar;
    for (const i of g.target[1]) {
      const [px, py] = cellXY(v, i);
      emojiText(x, av, px, py, v.d * 0.42, 0.3);
    }
    for (const i of g.home[1]) {
      const [px, py] = cellXY(v, i);
      drawPiece(x, v, 1, av, px, py, 1, 1);
    }
    box.appendChild(cv);
    box.appendChild(mk('div', 'arrow', '⬆️'));
    wrap.appendChild(box);
  }

  function openTutorial() {
    buildTutorialArt();
    document.querySelectorAll('[data-demo="avatar"]').forEach((el) => Emo.text(el, Store.data.avatar));
    renderTutorialStar();
    S.tutStep = 0;
    renderTutorial();
    showOverlay('tutOv');
  }

  function renderTutorial() {
    document.querySelectorAll('#tutOv .tut-step').forEach((s) => s.classList.toggle('show', Number(s.dataset.step) === S.tutStep));
    document.querySelectorAll('#tutDots i').forEach((d, i) => d.classList.toggle('on', i === S.tutStep));
    $('tutNext').textContent = S.tutStep < 2 ? '👉 下一步' : '🎮 开始玩！';
  }

  /* ============== 结果卡片 ============== */
  function showResult() {
    const r = S.result;
    if (!r || !S.gameOver) return;
    const L = LEVELS[S.level];
    const card = $('resultCard');
    card.className = 'sheet result ' + r.kind;
    let emo = '🤝';
    let title = '平局！';
    let sub = '你们都很棒';
    if (r.kind === 'win') {
      emo = S.avatar;
      title = '🎉 你赢啦！';
      sub = `${L.emoji} ${L.name}说：你真棒！`;
    } else if (r.kind === 'lose') {
      emo = L.emoji;
      title = '差一点点！';
      sub = `${L.emoji} ${L.name}先到家了`;
    } else if (r.kind === 'family') {
      emo = avatarOf(S.winner);
      title = `${avatarOf(S.winner)} 赢啦！`;
      sub = '一起玩真开心！';
    }
    Emo.text($('rEmo'), emo);
    Emo.text($('rTitle'), title);
    Emo.text($('rSub'), sub);
    const j = $('rJumps');
    j.hidden = S.mode !== 'ai' || r.jumps === 0;
    Emo.text(j, `🦘 这局你连跳了 ${r.jumps} 次！`);
    const star = $('rStar');
    star.hidden = !r.star;
    if (r.star) {
      star.style.animation = 'none';
      void star.offsetWidth;
      star.style.animation = '';
    }
    $('rTip').hidden = !r.tip;
    const sug = $('rSuggest');
    if (r.suggest) {
      const T = LEVELS[r.suggest];
      Emo.text(sug, r.suggest < S.level ? `换 ${T.emoji} ${T.name} 试试` : `挑战 ${T.emoji} ${T.name}！`);
      sug.dataset.level = r.suggest;
      sug.hidden = false;
    } else {
      sug.hidden = true;
    }
    showOverlay('resultOv');
    if (r.kind === 'win' || r.kind === 'family') {
      Sound.play('win');
      confetti();
    } else if (r.kind === 'lose') {
      Sound.play('lose');
    }
  }

  function confetti() {
    if (INSTANT) return;
    const box = $('confetti');
    box.textContent = '';
    const colors = ['#ff8fb8', '#6bbfff', '#ffd24a', '#7ed9a6', '#c9a7ff', '#ffa45c'];
    const W = window.innerWidth;
    for (let i = 0; i < 70; i++) {
      const p = mk('i');
      if (i % 7 === 0) {
        p.textContent = ['⭐', '🌸', '💖'][i % 3];
        p.style.fontSize = 18 + Math.random() * 14 + 'px';
        p.style.fontFamily = EMOJI_FONT;
      } else {
        p.style.width = 8 + Math.random() * 8 + 'px';
        p.style.height = 10 + Math.random() * 10 + 'px';
        p.style.background = colors[i % colors.length];
      }
      p.style.left = Math.random() * W + 'px';
      p.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
      p.style.setProperty('--rot', (Math.random() * 900 - 450) + 'deg');
      p.style.animationDuration = 2.2 + Math.random() * 1.8 + 's';
      p.style.animationDelay = Math.random() * 0.6 + 's';
      box.appendChild(p);
    }
    setTimeout(() => { box.textContent = ''; }, 4800);
  }

  /* ============== 设置 ============== */
  function renderSettings() {
    document.querySelectorAll('#setOv .seg').forEach((seg) => {
      const v = !!Store.data[seg.dataset.opt];
      seg.querySelectorAll('button').forEach((b) => {
        const isOn = b.dataset.v === '1';
        b.classList.toggle('on', isOn === v);
        b.classList.toggle('off-choice', !isOn);
      });
    });
  }

  function openSettings() {
    $('clearStep1').hidden = false;
    $('clearStep2').hidden = true;
    renderSettings();
    showOverlay('setOv');
  }

  /* ============== 输入：鼠标 + 手指 ============== */
  // 位置 -> 最近的洞。选中棋子后，手指稍微偏一点也优先吸到亮亮的圆点上
  function eventCell(e) {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !V.d) return -1;
    const px = ((e.clientX - rect.left) * V.w) / rect.width;
    const py = ((e.clientY - rect.top) * V.h) / rect.height;
    const g = geo();
    const touch = e.pointerType && e.pointerType !== 'mouse';
    let best = -1;
    let bestD = (V.d * 0.55) * (V.d * 0.55);
    let dest = -1;
    let destD = (V.d * (touch ? 0.8 : 0.6)) ** 2;
    for (let i = 0; i < g.N; i++) {
      const [cx, cy] = cellXY(V, i);
      const dd = (cx - px) * (cx - px) + (cy - py) * (cy - py);
      if (dd < bestD) { bestD = dd; best = i; }
      if (dd < destD && isDest(i)) { destD = dd; dest = i; }
    }
    if (dest >= 0 && (best < 0 || S.board[best] !== S.current)) return dest;
    return best;
  }

  const isDest = (i) => S.sel >= 0 && S.dests.some((d) => d.to === i);

  function updateHover(e) {
    const i = eventCell(e);
    if (i !== S.hover) S.hover = i;
    const clickable = canAct() && i >= 0 && (S.board[i] === S.current || isDest(i));
    canvas.classList.toggle('can', clickable);
  }

  // 按下：点到自己的棋子马上选中；点到圆点先预览路线，松手才走（手指可以拖着换位置）
  let press = null;

  function bindBoardInput() {
    canvas.addEventListener('pointerdown', (e) => {
      if (!e.isPrimary || e.button > 0) return;
      e.preventDefault();
      const i = eventCell(e);
      press = null;
      if (canAct() && i >= 0 && S.board[i] === S.current) {
        press = { id: e.pointerId, from: i, wasSel: S.sel === i };
        if (S.sel !== i) humanClick(i);
      } else if (canAct() && isDest(i)) {
        press = { id: e.pointerId, from: -1, wasSel: false };
        S.hover = i;
      } else {
        humanClick(i);
      }
      if (press) {
        try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
      }
      if (e.pointerType === 'mouse') updateHover(e);
    });
    canvas.addEventListener('pointermove', (e) => {
      if (press && e.pointerId === press.id) {
        S.hover = eventCell(e); // 拖动时：手指下面的圆点显示路线和影子
        return;
      }
      if (e.pointerType === 'mouse') updateHover(e);
    });
    canvas.addEventListener('pointerup', (e) => {
      if (!press || e.pointerId !== press.id) return;
      const pr = press;
      press = null;
      const i = eventCell(e);
      if (canAct() && isDest(i)) humanClick(i);                   // 松手在圆点上：走过去
      else if (pr.wasSel && i === pr.from) humanClick(i);           // 再点一次选中的棋子：取消
      if (e.pointerType === 'mouse') updateHover(e);
      else S.hover = -1;
    });
    canvas.addEventListener('pointercancel', () => {
      press = null;
      S.hover = -1;
    });
    canvas.addEventListener('pointerleave', (e) => {
      if (press || e.pointerType !== 'mouse') return;
      S.hover = -1;
      canvas.classList.remove('can');
    });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    // 按 Esc 取消选中
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && S.screen === 'game' && S.sel >= 0 && canAct()) {
        S.sel = -1;
        S.dests = [];
        S.hint = null;
        renderGame();
      }
    });
  }

  /* ============== 按钮绑定 ============== */
  function bindButtons() {
    const on = (id, fn) => $(id).addEventListener('click', fn);
    on('btnHelp', openTutorial);
    on('btnSettings', openSettings);
    on('btnGameSettings', openSettings);
    on('btnSound', () => setOption('sound', !Store.data.sound));
    on('btnHint', showHint);
    on('btnUndo', undo);
    on('btnRestart', restart);
    on('btnHome', goHome);
    on('tutNext', () => {
      if (S.tutStep < 2) {
        S.tutStep++;
        renderTutorial();
      } else {
        hideOverlay('tutOv');
        Store.data.tutorialSeen = true;
        Store.save();
      }
    });
    on('rAgain', () => { hideOverlay('resultOv'); restart(); });
    on('rHome', goHome);
    on('rUndo', undo);
    on('rSuggest', () => {
      const lv = Number($('rSuggest').dataset.level);
      hideOverlay('resultOv');
      if (lv >= 1 && lv <= 5) startGame('ai', lv, S.n);
    });
    document.querySelectorAll('#setOv .seg button').forEach((b) => {
      b.addEventListener('click', () => setOption(b.parentElement.dataset.opt, b.dataset.v === '1'));
    });
    on('btnClearStars', () => {
      $('clearStep1').hidden = true;
      $('clearStep2').hidden = false;
    });
    on('btnClearNo', () => {
      $('clearStep1').hidden = false;
      $('clearStep2').hidden = true;
    });
    on('btnClearYes', () => {
      Store.data.stars = 0;
      for (let l = 1; l <= 5; l++) {
        Store.data.wins[l] = 0;
        Store.data.streak[l] = { w: 0, l: 0 };
      }
      Store.save();
      $('clearStep1').hidden = false;
      $('clearStep2').hidden = true;
      renderMenu();
    });
    on('setClose', () => hideOverlay('setOv'));
  }

  /* ============== 初始化 ============== */
  // 换成图片 / 图片加载好之后，把用到动物的地方重画一遍
  function redrawEmoji() {
    spriteCache.clear();
    tutBuilt = false;
    document.querySelectorAll('.title .emo').forEach((el) => { if (el.dataset.raw) Emo.text(el, el.dataset.raw); });
    if (S.screen === 'game') renderGame();
    renderMenu();
    if ($('tutOv').classList.contains('show')) openTutorial();
  }

  function init() {
    canvas = $('board');
    ctx = canvas.getContext('2d');
    document.querySelectorAll('.title .emo').forEach((el) => { el.dataset.raw = el.dataset.raw || el.textContent; Emo.text(el, el.dataset.raw); });
    Emo.preload(redrawEmoji);
    if (INSTANT) document.documentElement.classList.add('test-mode');
    buildMenu();
    renderMenu();
    renderSettings();
    bindBoardInput();
    bindButtons();

    // 首次手势解锁声音（iOS 需要）
    ['pointerdown', 'touchend', 'click', 'keydown'].forEach((ev) => {
      document.addEventListener(ev, Sound.unlock, { capture: true, passive: true });
    });
    // 防止双指缩放、双击缩放、游戏中页面被拖动
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('dblclick', (e) => e.preventDefault());
    document.addEventListener('touchmove', (e) => {
      if (S.screen === 'game' && !(e.target.closest && e.target.closest('.sheet'))) e.preventDefault();
    }, { passive: false });

    let pend = 0;
    const relayout = () => {
      cancelAnimationFrame(pend);
      pend = requestAnimationFrame(() => { layout(); renderGame(); });
    };
    window.addEventListener('resize', relayout);
    window.addEventListener('orientationchange', () => { relayout(); setTimeout(relayout, 300); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', relayout);
    if (window.ResizeObserver) new ResizeObserver(relayout).observe($('app'));
    document.addEventListener('visibilitychange', () => { if (!document.hidden) relayout(); });

    showScreen('menu');
    if (!TEST && !Store.data.tutorialSeen) openTutorial();

    // 离线缓存（只在 https / 本机时可用；添加到主屏幕后没网也能玩）
    if (!TEST && 'serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) {
      navigator.serviceWorker.register('sw.js').catch(() => { /* 忽略 */ });
    }

    // 测试钩子：仅 ?test=1
    if (TEST) {
      window.__tiaoqi = {
        AI,
        getState,
        startGame: (mode, level, size) => { startGame(mode, level, size); return getState(); },
        click: (i) => humanClick(i),
        hint: () => { showHint(); return getState(); },
        undo: () => { undo(); return getState(); },
        loadPosition: (board, current) => { loadPosition(board, current); return getState(); },
        setOption: (name, value) => { setOption(name, value); return getState(); },
        // 某个洞在页面上的位置（CSS 像素）
        cellClient: (i) => {
          const rect = canvas.getBoundingClientRect();
          const [x, y] = cellXY(V, i);
          return { x: rect.left + (x * rect.width) / V.w, y: rect.top + (y * rect.height) / V.h };
        },
      };
    }
  }

  init();
})();
</script>
