<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="记忆翻牌">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#e9e6ff">
<link rel="manifest" href="fanpai.webmanifest">
<link rel="apple-touch-icon" href="icons/fanpai-180.png">
<link rel="icon" type="image/png" href="icons/fanpai-192.png">
<title>记忆翻牌</title>
<style>
  /* ============== 基础与配色 ============== */
  :root {
    --ink: #5b4331;
    --ink-soft: #9a7f69;
    --pink: #ff8fb8;
    --pink-bg: #ffd6e5;
    --blue: #6bbfff;
    --blue-bg: #d4ecff;
    --gold: #ffc93c;
    --red: #ff4658;
    --sheet: #fffdf8;
    --font: ui-rounded, "SF Pro Rounded", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: var(--font);
    color: var(--ink);
    background: linear-gradient(160deg, #e9f8dd 0%, #fff5e1 50%, #e2f2ff 100%);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    overscroll-behavior: none;
    touch-action: manipulation;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 8% 12%, rgba(190, 240, 170, 0.55) 0, rgba(190, 240, 170, 0) 28%),
      radial-gradient(circle at 92% 18%, rgba(255, 230, 150, 0.5) 0, rgba(255, 230, 150, 0) 26%),
      radial-gradient(circle at 85% 90%, rgba(170, 215, 255, 0.55) 0, rgba(170, 215, 255, 0) 30%),
      radial-gradient(circle at 12% 88%, rgba(255, 200, 220, 0.45) 0, rgba(255, 200, 220, 0) 26%);
  }

  button {
    font-family: inherit;
    color: inherit;
    border: none;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  .emo { font-family: var(--emoji); }

  #app { position: fixed; inset: 0; }

  .screen { position: absolute; inset: 0; display: none; }
  .screen.show { display: flex; }

  /* ============== 通用按钮 ============== */
  .btn {
    --shade: #e9d2b3;
    min-height: 56px;
    padding: 0 20px;
    font-size: 20px;
    font-weight: 800;
    color: var(--ink);
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 5px 0 var(--shade), 0 9px 18px rgba(150, 100, 60, 0.12);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
    transition: transform 0.08s, box-shadow 0.08s, opacity 0.2s, filter 0.15s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--shade), 0 3px 8px rgba(150, 100, 60, 0.12); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn:disabled:active { transform: none; box-shadow: 0 5px 0 var(--shade); }
  .btn.pink   { background: linear-gradient(#ffb3cf, #ff8fb8); color: #fff; --shade: #e36a97; text-shadow: 0 1px 1px rgba(170, 50, 90, 0.35); }
  .btn.blue   { background: linear-gradient(#bfe3ff, #8ccfff); color: #2d5a80; --shade: #5fa9e0; }
  .btn.green  { background: linear-gradient(#c9f2d6, #9fe3b6); color: #2f6b45; --shade: #6fc18d; }
  .btn.yellow { background: linear-gradient(#fff0a8, #ffd966); color: #7a5300; --shade: #e7b63c; }
  .btn.purple { background: linear-gradient(#e6d6ff, #c9b0ff); color: #4f3a85; --shade: #a58ae0; }
  .btn.big { min-height: 64px; font-size: 24px; border-radius: 24px; padding: 0 28px; }

  /* ============== 菜单页 ============== */
  #menu {
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding:
      calc(14px + env(safe-area-inset-top))
      calc(20px + env(safe-area-inset-right))
      calc(20px + env(safe-area-inset-bottom))
      calc(20px + env(safe-area-inset-left));
  }
  .menu-inner {
    width: 100%;
    max-width: 1120px;
    margin: auto 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .menu-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .title {
    font-size: clamp(32px, 5.2vw, 50px);
    font-weight: 900;
    letter-spacing: 3px;
    color: #5d4a2f;
    text-shadow: 0 3px 0 #fff, 0 6px 14px rgba(120, 200, 110, 0.35);
    white-space: nowrap;
  }
  .title .emo { display: inline-block; animation: roar 2.4s ease-in-out infinite; }
  .star-total {
    flex-shrink: 0;
    background: #fff;
    border-radius: 999px;
    padding: 8px 20px;
    font-size: 26px;
    font-weight: 900;
    color: #b07a00;
    box-shadow: 0 5px 0 #f1d58c, 0 8px 16px rgba(180, 130, 40, 0.15);
    white-space: nowrap;
  }
  .star-total.bump { animation: bump 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .subtitle { text-align: center; font-size: clamp(22px, 3vw, 28px); font-weight: 900; color: #6d5a3d; }
  @media (min-aspect-ratio: 4/3) and (min-width: 960px) {
    .cards { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; }
  }

  .opt-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 22px; }
  .opt-group {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 10px;
    background: rgba(255, 255, 255, 0.72);
    border-radius: 26px;
    padding: 10px 16px;
    box-shadow: 0 4px 14px rgba(150, 100, 60, 0.08);
  }
  .opt-label { font-size: 20px; font-weight: 900; margin-right: 4px; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .chip {
    min-height: 56px;
    min-width: 56px;
    padding: 0 14px;
    border-radius: 18px;
    background: #fff;
    border: 3px solid #f1e4d3;
    font-size: 20px;
    font-weight: 800;
    color: var(--ink);
    white-space: nowrap;
    transition: transform 0.15s, border-color 0.15s, background 0.15s;
  }
  .chip.emo-chip { font-family: var(--emoji); font-size: 34px; width: 62px; height: 62px; padding: 0; line-height: 1; }
  .chip.on {
    border-color: var(--pink);
    background: #fff0f6;
    box-shadow: 0 0 0 4px rgba(255, 143, 184, 0.28);
    transform: scale(1.07);
  }
  .menu-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; padding-bottom: 6px; }

  @keyframes sway {
    0%, 100% { transform: rotate(-4deg); }
    50% { transform: rotate(4deg) translateY(-2px); }
  }
  @keyframes roar {
    0%, 70%, 100% { transform: scale(1) rotate(0); }
    78% { transform: scale(1.18) rotate(-8deg); }
    86% { transform: scale(1.12) rotate(6deg); }
  }
  @keyframes bump {
    0% { transform: scale(1); }
    40% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }
  #game.show {
    display: grid;
    justify-content: center;
    align-content: center;
    row-gap: 10px;
    column-gap: 26px;
  }
  @keyframes hop {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  .controls .btn { flex: 1 1 0; padding: 0 6px; min-width: 0; }
  #game.land .controls .btn { min-height: 60px; font-size: 22px; }
  .banner.pink {
    background: linear-gradient(135deg, #ffe0ec 0%, #ffb8d2 100%);
    color: #a8325f;
    border: 4px solid #fff;
    box-shadow: 0 0 0 3px #ff9cc2, 0 8px 18px rgba(255, 120, 170, 0.3);
    animation: popBanner 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  @keyframes shakeIn {
    0% { transform: scale(0.6); opacity: 0; }
    30% { transform: scale(1.06) rotate(-2.5deg); opacity: 1; }
    45% { transform: scale(1) rotate(2.5deg) translateX(6px); }
    60% { transform: rotate(-2deg) translateX(-6px); }
    75% { transform: rotate(1.2deg) translateX(3px); }
    90% { transform: rotate(-0.6deg) translateX(-2px); }
    100% { transform: none; }
  }
  @keyframes glowRed {
    0%, 100% { box-shadow: 0 0 0 4px #ff5c6c, 0 10px 26px rgba(255, 70, 90, 0.45); }
    50% { box-shadow: 0 0 0 7px #ff8a96, 0 10px 34px rgba(255, 70, 90, 0.65); }
  }
  @keyframes glowGold {
    0%, 100% { box-shadow: 0 0 0 4px #ffc62e, 0 0 22px rgba(255, 200, 40, 0.55); }
    50% { box-shadow: 0 0 0 7px #ffe07a, 0 0 36px rgba(255, 200, 40, 0.85); }
  }
  @keyframes popBanner {
    0% { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes wobble {
    0% { transform: scale(0.8); }
    30% { transform: scale(1.05) rotate(-2deg); }
    55% { transform: rotate(2deg); }
    80% { transform: rotate(-1deg); }
    100% { transform: none; }
  }

  /* ============== 弹层通用 ============== */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    padding:
      calc(16px + env(safe-area-inset-top))
      calc(16px + env(safe-area-inset-right))
      calc(16px + env(safe-area-inset-bottom))
      calc(16px + env(safe-area-inset-left));
    background: rgba(90, 80, 50, 0.38);
  }
  .overlay.show { display: flex; animation: fadeIn 0.2s ease-out; }
  .sheet {
    position: relative;
    width: min(640px, 100%);
    max-height: 100%;
    overflow-y: auto;
    background: var(--sheet);
    border-radius: 34px;
    padding: 26px 24px 24px;
    text-align: center;
    border: 4px solid #fff;
    box-shadow: 0 18px 44px rgba(90, 60, 40, 0.3);
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn { from { transform: scale(0.75); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .sheet h2 { font-size: 30px; font-weight: 900; margin-bottom: 14px; }
  .sheet-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 18px; }

  /* ============== 教程 ============== */
  .tut-step { display: none; }
  .tut-step.show { display: block; animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .tut-art {
    min-height: 280px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .tut-text { font-size: 28px; font-weight: 900; line-height: 1.3; }
  .tut-small { font-size: 21px; font-weight: 800; color: #8a6f52; margin-top: 4px; }
  .tut-dots { display: flex; justify-content: center; gap: 10px; margin-top: 16px; }
  .tut-dots i { width: 14px; height: 14px; border-radius: 50%; background: #e3e8cf; transition: all 0.25s; }
  .tut-dots i.on { width: 34px; border-radius: 8px; background: #8fd07a; }

  /* ============== 结果卡片 ============== */
  .result .r-emo { font-family: var(--emoji); font-size: 84px; line-height: 1.1; animation: hop 1.2s ease-in-out infinite; }
  .result .r-title { font-size: 44px; font-weight: 900; margin-top: 4px; }
  .result.win .r-title { color: #ff5f99; text-shadow: 0 3px 0 #ffe0ec; }
  .result .r-sub { font-size: 24px; font-weight: 800; color: #8a6a55; margin-top: 6px; }
  .result .r-eat { font-size: 22px; font-weight: 900; color: #3f8a55; margin-top: 8px; }
  .result .r-star {
    display: inline-block;
    margin-top: 12px;
    font-size: 40px;
    font-weight: 900;
    color: #d99800;
    text-shadow: 0 3px 0 #fff3c4;
    animation: starUp 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .result .r-tip {
    margin: 16px auto 0;
    max-width: 460px;
    padding: 12px 16px;
    border-radius: 20px;
    background: #fff1f1;
    border: 3px dashed #ff9aa5;
    color: #d8404f;
    font-size: 22px;
    font-weight: 900;
  }
  .result .r-suggest { margin-top: 18px; width: 100%; max-width: 440px; }
  .result .r-suggest.btn { animation: nudge 1.4s ease-in-out infinite; }
  @keyframes starUp {
    0% { transform: translateY(30px) scale(0.3); opacity: 0; }
    60% { transform: translateY(-8px) scale(1.25); opacity: 1; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  @keyframes nudge {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
  #confetti i {
    position: absolute;
    top: -40px;
    display: block;
    border-radius: 3px;
    font-style: normal;
    animation: fall linear forwards;
  }
  @keyframes fall {
    0% { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 1; }
    100% { transform: translate3d(var(--dx), 110vh, 0) rotate(var(--rot)); opacity: 0.9; }
  }

  /* ============== 设置 ============== */
  .set-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding: 14px 16px;
    margin-top: 12px;
    border-radius: 22px;
    background: #fff;
    border: 3px solid #f6e8d6;
    text-align: left;
  }
  .set-name { font-size: 22px; font-weight: 900; }
  .set-name small { display: block; font-size: 17px; font-weight: 800; color: #d8404f; }
  .seg { display: flex; gap: 8px; }
  .seg button {
    min-height: 56px;
    min-width: 92px;
    padding: 0 14px;
    border-radius: 18px;
    font-size: 20px;
    font-weight: 900;
    background: #f5efe7;
    color: #a48b77;
    border: 3px solid transparent;
  }
  .seg button.on { background: #e5f8ea; color: #2f7a4b; border-color: #7fd49b; }
  .seg button.on.off-choice { background: #fff0f0; color: #c0404f; border-color: #ff9aa5; }
  .parent-zone { margin-top: 18px; padding: 14px; border-radius: 22px; background: #f3f0ff; border: 3px dashed #cbbcf5; }
  .parent-zone h3 { font-size: 20px; font-weight: 900; color: #5d4a96; margin-bottom: 10px; }
  .confirm-box { font-size: 22px; font-weight: 900; color: #c0404f; }
  .confirm-box .sheet-btns { margin-top: 10px; }

  @media (hover: hover) and (pointer: fine) {
    .btn:hover:not(:disabled) { filter: brightness(1.04); }
    .card:hover { transform: translateY(-3px); }
    .chip:hover { border-color: #f5c9d9; }
  }

  [hidden] { display: none !important; }
  .test-mode *, .test-mode *::before, .test-mode *::after { animation: none !important; transition: none !important; }
  /* ============== 小动物回家 ============== */
  body { background: linear-gradient(160deg, #e9f8dd 0%, #fff5e1 50%, #e2f2ff 100%); }
  .title .emo { animation: hop 1.2s ease-in-out infinite; display: inline-block; }
  .lvl .l-stars .off { opacity: 0.22; filter: grayscale(1); }
  .lvl.next { background: #fff7cf; --shade: #e8c75a; animation: nudge 1.4s ease-in-out infinite; }

  /* 游戏页 */
  #play {
    padding:
      calc(10px + env(safe-area-inset-top))
      calc(14px + env(safe-area-inset-right))
      calc(10px + env(safe-area-inset-bottom))
      calc(14px + env(safe-area-inset-left));
    gap: 18px;
    justify-content: center;
    align-items: center;
  }
  #play.show { display: flex; }
  #play.port { flex-direction: column; }
  #play.land .panel { width: var(--panel, 470px); max-height: 100%; }
  #play.port .panel { width: min(100%, 760px); }
  .lv-head .btn { min-height: 46px; font-size: 18px; padding: 0 14px; margin-left: auto; }
  .msg.blue { background: linear-gradient(135deg, #e3f3ff, #bfe3ff); color: #2d5a80; border: 3px solid #fff; box-shadow: 0 0 0 3px #8ccfff; animation: popBanner 0.4s both; }
  @keyframes bump {
    0%, 100% { transform: translate(0, 0); }
    40% { transform: translate(calc(var(--bx) * 0.35), calc(var(--by) * 0.35)); }
    55% { transform: translate(calc(var(--bx) * 0.2), calc(var(--by) * 0.2)) rotate(-12deg); }
    70% { transform: translate(0, 0) rotate(8deg); }
  }
  @keyframes stepHop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(calc(var(--cs) * -0.12)); } }
  .dot.done::after { background: rgba(255, 180, 0, 0.8); }
  .add.on { border-color: #ffb800; color: #ffb800; background: #fff8dc; animation: nudge 1.2s ease-in-out infinite; }
  .ctrls .btn { min-height: 58px; font-size: 20px; padding: 0 6px; }
  .demo-map .p { background: #fff3c4; }

  /* 结果 */
  .result .r-stars { font-family: var(--emoji); font-size: 58px; margin-top: 8px; letter-spacing: 4px; }
  .result .r-stars span { display: inline-block; animation: starUp 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  .result .r-stars span.off { opacity: 0.2; filter: grayscale(1); animation: none; }
  .result .r-lines { margin-top: 10px; font-size: 21px; font-weight: 900; color: #7a6450; line-height: 1.6; }
  .result .r-tip2 { margin-top: 10px; font-size: 19px; font-weight: 900; color: #b25e00; }

  /* ============== 记忆翻牌 ============== */
  body { background: linear-gradient(160deg, #e9e6ff 0%, #fff5e1 50%, #ffe8f1 100%); }
  .title .emo { display: inline-block; animation: hop 1.3s ease-in-out infinite; }

  .modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
  .mode {
    --bg: #fff; --shade: #e9d2b3;
    background: var(--bg);
    border-radius: 26px;
    border: 3px solid #fff;
    box-shadow: 0 6px 0 var(--shade), 0 12px 22px rgba(150, 100, 60, 0.13);
    padding: 14px 8px 12px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    transition: transform 0.12s, box-shadow 0.08s;
  }
  .mode:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--shade); }
  .mode .m-emo { font-family: var(--emoji); font-size: 46px; line-height: 1.1; }
  .mode .m-name { font-size: 23px; font-weight: 900; }
  .mode .m-sub { font-size: 17px; font-weight: 800; color: #8f725c; }
  .mode .m-best { margin-top: 3px; font-size: 16px; font-weight: 900; color: #a26f00; background: rgba(255,255,255,0.85); border-radius: 999px; padding: 2px 12px; white-space: nowrap; }

  #play { padding: calc(10px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom)); flex-direction: column; align-items: center; gap: 12px; }
  #play.show { display: flex; }
  .play-inner { width: 100%; max-width: 1000px; margin: auto 0; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .bar { width: 100%; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .bar .chip2 { font-size: 20px; font-weight: 900; background: rgba(255,255,255,0.8); border-radius: 999px; padding: 6px 16px; white-space: nowrap; }
  .bar .chip2 b { color: #e0632a; }
  .bar .btn { min-height: 46px; font-size: 18px; padding: 0 14px; }
  .turn { font-size: 22px; font-weight: 900; text-align: center; min-height: 30px; }

  .board { --cw: 100px; display: grid; gap: 10px; justify-content: center; }
  .card { position: relative; aspect-ratio: 3 / 4; perspective: 700px; background: none; padding: 0; }
  .card .inner { position: absolute; inset: 0; transition: transform 0.35s; transform-style: preserve-3d; }
  .card.up .inner, .card.done .inner { transform: rotateY(180deg); }
  .card .side {
    position: absolute; inset: 0;
    border-radius: 16px;
    display: grid; place-items: center;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    font-family: var(--emoji);
    box-shadow: 0 5px 0 rgba(120, 90, 60, 0.25);
  }
  .card .front { background: linear-gradient(140deg, #b9a7ff, #8f7ae6); color: #fff; font-size: calc(var(--cw) * 0.34); }
  .card .back { background: #fffaf0; border: 4px solid #ffd9a8; transform: rotateY(180deg); font-size: calc(var(--cw) * 0.64); }
  .card .back img { width: 84%; height: 84%; object-fit: contain; }
  .card.done { animation: matched 0.5s ease-out; }
  .card.done .back { border-color: #7fd49b; background: #f0fff4; }
  .card.miss .back { border-color: #ff9aa5; background: #fff0f0; }

<script>
(() => {
  'use strict';
  const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  /* ============== 动物头像：系统 emoji，画不出来就用备用图片 ============== */
  // 有的设备（部分 iPad、微信内置浏览器等）画不出彩色 emoji，就换成 icons/emoji 里的 Noto Emoji 图片
  const Emo = (() => {
    const FILES = {
      '🐣': '1f423', '🐰': '1f430', '🐱': '1f431', '🐻': '1f43b', '🦊': '1f98a', '🐯': '1f42f',
      '🐼': '1f43c', '🐶': '1f436', '🐸': '1f438', '🐷': '1f437', '🦄': '1f984', '🐧': '1f427',
      '🐨': '1f428', '🦘': '1f998', '🐭': '1f42d', '🐺': '1f43a', '🐆': '1f406', '🦁': '1f981',
      '🐘': '1f418', '🧑': '1f9d1', '🏠': '1f3e0', '⭐': '2b50', '🐵': '1f435', '🐹': '1f439',
      '🍪': '1f36a', '🍎': '1f34e', '🥕': '1f955', '🍌': '1f34c', '🍬': '1f36c', '🍓': '1f353',
      '🍇': '1f347', '🧺': '1f9fa', '✅': '2705',
    };
    const SPLIT = new RegExp('(' + Object.keys(FILES).join('|') + ')', 'u');
    const src = (e) => 'icons/emoji/' + FILES[e] + '.png';
    const imgs = new Map();
    const forced = /[?&]emoji=img(?:&|$)/.test(location.search) || /MicroMessenger/i.test(navigator.userAgent);
    const off = /[?&]emoji=text(?:&|$)/.test(location.search);
    let detected = null;   // 这台设备能不能画 emoji（第一次用到时才测）
    let loading = false;
    let ready = null;
    let gen = 0;

    function canvasEmojiOk() {
      try {
        const c = document.createElement('canvas');
        c.width = c.height = 32;
        const x = c.getContext('2d');
        x.textAlign = 'center';
        x.textBaseline = 'middle';
        // 画两个颜色鲜明的 emoji：都画不出彩色，就说明这台设备画不了
        const check = (ch, test) => {
          x.clearRect(0, 0, 32, 32);
          x.font = '24px ' + EMOJI_FONT;
          x.fillText(ch, 16, 17);
          const d = x.getImageData(0, 0, 32, 32).data;
          let n = 0;
          for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 100 && test(d[i], d[i + 1], d[i + 2])) n++;
          return n >= 10;
        };
        return check('🦊', (r, g, b) => r - b > 60) || check('🐸', (r, g, b) => g - r > 30);
      } catch (e) {
        return true; // 读不了像素就当作正常
      }
    }

    function useImg() {
      if (off) return false;
      if (forced) return true;
      if (window.__picAnimals) return true;
      if (detected === null) detected = canvasEmojiOk();
      return !detected;
    }

    function preload(cb) {
      if (cb) ready = cb;
      if (!useImg() || loading) return;
      loading = true;
      let left = Object.keys(FILES).length;
      for (const e of Object.keys(FILES)) {
        const im = new Image();
        im.onload = im.onerror = () => { if (--left === 0 && ready) ready(); };
        im.src = src(e);
        imgs.set(e, im);
      }
    }

    // 在 canvas 上画：成功返回 true
    function draw(x, e, cx, cy, size) {
      if (!useImg()) return false;
      preload();
      const im = imgs.get(e);
      if (!im || !im.complete || !im.naturalWidth) return false;
      x.drawImage(im, cx - size / 2, cy - size / 2, size, size);
      return true;
    }

    // 设置 DOM 文字，动物 emoji 换成图片
    function text(el, str) {
      str = String(str);
      const on = useImg();
      const key = (on ? 'i' + gen : 't') + str;
      if (el.dataset.emo === key) return;
      el.dataset.emo = key;
      el.dataset.emoRaw = str;
      if (!on) { el.textContent = str; return; }
      preload();
      el.textContent = '';
      for (const part of str.split(SPLIT)) {
        if (!part) continue;
        if (FILES[part]) {
          const im = document.createElement('img');
          im.className = 'emo-img';
          im.src = src(part);
          im.alt = part;
          im.draggable = false;
          el.appendChild(im);
        } else {
          el.appendChild(document.createTextNode(part));
        }
      }
    }

    // 设置里切换之后重画
    function refresh() {
      gen++;
      loading = false;
      preload();
      // 把已经画过的地方按新模式重画一遍
      document.querySelectorAll('[data-emo-raw]').forEach((el) => text(el, el.dataset.emoRaw));
    }

    return { useImg, preload, draw, text, refresh, has: (e) => useImg() && !!FILES[e] };
  })();

  window.Emo = Emo;
})();
</script>

<script>
(() => {
  'use strict';
  const TEST = /[?&]test=1(?:&|$)/.test(location.search);
  const INSTANT = TEST && !/[?&]anim=1(?:&|$)/.test(location.search);
  const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  const $ = (id) => document.getElementById(id);
  const ANIMALS = ['🐼', '🐶', '🐱', '🐰', '🦊', '🐻', '🐯', '🦁', '🐸', '🐷', '🐵', '🐹', '🐨', '🦄', '🐧', '🐭'];
  // 难度：pairs 对数，cols 列数
  const MODES = [
    { id: 'a', emoji: '🌱', name: '小小', pairs: 3, cols: 3, sub: '3 对 · 6 张' },
    { id: 'b', emoji: '🌿', name: '中等', pairs: 6, cols: 4, sub: '6 对 · 12 张' },
    { id: 'c', emoji: '🌳', name: '大大', pairs: 8, cols: 4, sub: '8 对 · 16 张' },
    { id: 'd', emoji: '🏔️', name: '超级', pairs: 12, cols: 6, sub: '12 对 · 24 张' },
  ];

  const Store = (() => {
    const KEY = 'kidsFanpai.v1';
    const data = { best: {}, stars: {}, sound: true, picAnimals: false, players: 1, tutorialSeen: false };
    try {
      const o = JSON.parse(window.localStorage.getItem(KEY) || 'null');
      if (o && typeof o === 'object') {
        for (const m of MODES) {
          if (o.best && Number.isInteger(o.best[m.id]) && o.best[m.id] > 0) data.best[m.id] = o.best[m.id];
          if (o.stars && Number.isInteger(o.stars[m.id]) && o.stars[m.id] >= 0 && o.stars[m.id] <= 3) data.stars[m.id] = o.stars[m.id];
        }
        for (const k of ['sound', 'picAnimals', 'tutorialSeen']) if (typeof o[k] === 'boolean') data[k] = o[k];
        if (o.players === 1 || o.players === 2) data.players = o.players;
      }
    } catch (e) { /* 忽略 */ }
    const save = () => { try { window.localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* 忽略 */ } };
    return { data, save };
  })();

  const Sound = (() => {
    let ctx = null, master = null;
    function unlock() {
      try {
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          ctx = new AC();
          master = ctx.createGain();
          master.gain.value = 0.55;
          master.connect(ctx.destination);
        }
        if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
      } catch (e) { ctx = null; }
    }
    function tone(freq, at, dur, type, vol, slideTo) {
      const t0 = ctx.currentTime + at;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.03, dur / 3));
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g);
      g.connect(master);
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    }
    function play(name) {
      if (!Store.data.sound || !ctx || INSTANT) return;
      try {
        if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
        switch (name) {
          case 'flip': tone(620, 0, 0.08, 'triangle', 0.16, 880); break;
          case 'match': [784, 988, 1319].forEach((f, i) => tone(f, i * 0.08, 0.16, 'triangle', 0.16)); break;
          case 'miss': tone(400, 0, 0.14, 'sine', 0.13, 260); break;
          case 'boop': tone(420, 0, 0.14, 'triangle', 0.12, 330); break;
          case 'win':
            [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.11, i === 3 ? 0.5 : 0.18, 'triangle', 0.2));
            tone(1319, 0.5, 0.45, 'sine', 0.1);
            break;
        }
      } catch (e) { /* 忽略 */ }
    }
    return { unlock, play };
  })();

  const S = { screen: 'menu', mode: null, cards: [], up: [], done: 0, moves: 0, lock: false, turn: 1, score: [0, 0, 0], t0: 0, tutStep: 0 };

  const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  const modeOf = (id) => MODES.find((m) => m.id === id);
  const twoPlayer = () => Store.data.players === 2;

  // 星星：翻牌次数（每次 = 翻开一对）越接近对数越好
  function starsFor(mode, moves) {
    if (moves <= Math.round(mode.pairs * 1.8)) return 3;
    if (moves <= Math.round(mode.pairs * 3)) return 2;
    return 1;
  }

  /* ============== 菜单 ============== */
  function renderMenu() {
    $('starNum').textContent = Object.values(Store.data.stars).reduce((a, b) => a + b, 0);
    $('btnSound').textContent = Store.data.sound ? '🔊 有声音' : '🔇 没声音';
    const box = $('modes');
    box.textContent = '';
    const shades = ['#efd679', '#f1b6cd', '#d9bb98', '#a58ae0'];
    MODES.forEach((m, i) => {
      const b = mk('button', 'mode');
      b.dataset.id = m.id;
      b.style.setProperty('--bg', ['#fff9d8', '#ffe9f1', '#f6ece0', '#eee6ff'][i]);
      b.style.setProperty('--shade', shades[i]);
      const e = mk('div', 'm-emo');
      Emo.text(e, m.emoji);
      b.appendChild(e);
      b.appendChild(mk('div', 'm-name', m.name));
      b.appendChild(mk('div', 'm-sub', m.sub));
      const best = Store.data.best[m.id];
      const st = Store.data.stars[m.id] || 0;
      b.appendChild(mk('div', 'm-best', best ? `最少 ${best} 次 ${'⭐'.repeat(st)}` : '还没玩过'));
      b.addEventListener('click', () => start(m.id));
      box.appendChild(b);
    });
    const chips = $('playerChips');
    if (!chips.children.length) {
      [[1, '🙋 一个人'], [2, '👨‍👩‍👧 两个人比赛']].forEach(([n, label]) => {
        const c = mk('button', 'chip', label);
        c.dataset.n = n;
        c.addEventListener('click', () => { Store.data.players = n; Store.save(); renderMenu(); });
        chips.appendChild(c);
      });
    }
    chips.querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', Number(c.dataset.n) === Store.data.players));
  }

  const showScreen = (name) => {
    S.screen = name;
    $('menu').classList.toggle('show', name === 'menu');
    $('play').classList.toggle('show', name === 'play');
    if (name === 'menu') renderMenu();
  };

  /* ============== 对局 ============== */
  function start(id) {
    const m = modeOf(id);
    if (!m) return;
    S.mode = m;
    const pool = ANIMALS.slice(0, m.pairs);
    const deck = pool.concat(pool);
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    S.cards = deck.map((e) => ({ e, up: false, done: false }));
    S.up = [];
    S.done = 0;
    S.moves = 0;
    S.lock = false;
    S.turn = 1;
    S.score = [0, 0, 0];
    S.t0 = Date.now();
    hideOverlay('resultOv');
    showScreen('play');
    buildBoard();
    sizeBoard();
    renderBar();
  }

  function buildBoard() {
    const b = $('board');
    b.textContent = '';
    b.style.gridTemplateColumns = `repeat(${S.mode.cols}, minmax(0, 1fr))`;
    S.cards.forEach((c, i) => {
      const el = mk('button', 'card');
      el.dataset.i = i;
      const inner = mk('div', 'inner');
      const front = mk('div', 'side front');
      Emo.text(front, '🐾');
      const back = mk('div', 'side back');
      Emo.text(back, c.e);
      inner.appendChild(front);
      inner.appendChild(back);
      el.appendChild(inner);
      el.addEventListener('click', () => flip(i));
      b.appendChild(el);
    });
  }

  // 让牌尽量大：宽度和高度都要放得下
  function sizeBoard() {
    const b = $('board');
    if (!S.mode || !b.children.length) return;
    const cols = S.mode.cols;
    const rows = Math.ceil(S.cards.length / cols);
    const gap = 10;
    const play = $('play');
    const inner = play.querySelector('.play-inner');
    const availW = Math.min(1000, inner.clientWidth);
    const other = $('bar').offsetHeight + $('turn').offsetHeight + 46;
    const availH = Math.max(220, play.clientHeight - other);
    const byW = (availW - gap * (cols - 1)) / cols;
    const byH = ((availH - gap * (rows - 1)) / rows) * 3 / 4;
    const cw = Math.max(58, Math.min(190, byW, byH));
    b.style.width = Math.round(cw * cols + gap * (cols - 1)) + 'px';
    b.style.setProperty('--cw', Math.round(cw) + 'px');
    b.style.maxWidth = '100%';
  }
  window.addEventListener('resize', sizeBoard);

  function cardEl(i) { return $('board').children[i]; }

  function flip(i) {
    const c = S.cards[i];
    if (!c || S.lock || c.up || c.done) { if (c && (c.up || c.done)) Sound.play('boop'); return 'ignored'; }
    c.up = true;
    S.up.push(i);
    cardEl(i).classList.add('up');
    Sound.play('flip');
    if (S.up.length < 2) return 'up';
    S.moves++;
    const [a, b] = S.up;
    const match = S.cards[a].e === S.cards[b].e;
    if (match) {
      S.cards[a].done = S.cards[b].done = true;
      S.done++;
      S.score[S.turn]++;
      S.up = [];
      cardEl(a).classList.add('done');
      cardEl(b).classList.add('done');
      Sound.play('match');
      renderBar();
      if (S.done === S.mode.pairs) finish();
      return 'match';
    }
    S.lock = true;
    cardEl(a).classList.add('miss');
    cardEl(b).classList.add('miss');
    Sound.play('miss');
    renderBar();
    const hide = () => {
      S.cards[a].up = S.cards[b].up = false;
      S.up = [];
      S.lock = false;
      [a, b].forEach((k) => cardEl(k).classList.remove('up', 'miss'));
      if (twoPlayer()) { S.turn = 3 - S.turn; renderBar(); }
    };
    if (INSTANT) hide(); else setTimeout(hide, 900);
    return 'miss';
  }

  function renderBar() {
    const m = S.mode;
    Emo.text($('chipLv'), `${m.emoji} ${m.name}`);
    $('chipPairs').innerHTML = `配对 <b>${S.done}</b>/${m.pairs}`;
    $('chipMoves').innerHTML = `翻了 <b>${S.moves}</b> 次`;
    const t = $('turn');
    if (twoPlayer()) Emo.text(t, `轮到 ${S.turn === 1 ? '🙋 你' : '👧 对手'}　🙋 ${S.score[1]} : ${S.score[2]} 👧`);
    else t.textContent = '';
  }

  function finish() {
    const m = S.mode;
    const secs = Math.round((Date.now() - S.t0) / 1000);
    const two = twoPlayer();
    const stars = starsFor(m, S.moves);
    const best = Store.data.best[m.id];
    const isBest = !two && (!best || S.moves < best);
    if (isBest) Store.data.best[m.id] = S.moves;
    // 两个人比赛是比谁配对多，不算星星
    if (!two) Store.data.stars[m.id] = Math.max(Store.data.stars[m.id] || 0, stars);
    Store.save();
    Sound.play('win');
    const st = $('rStars');
    st.textContent = '';
    st.hidden = two;
    if (!two) {
      for (let k = 1; k <= 3; k++) {
        const s = mk('span', k <= stars ? '' : 'off', '⭐');
        s.style.animationDelay = (k * 0.18) + 's';
        st.appendChild(s);
      }
    }
    const lines = $('rLines');
    lines.textContent = '';
    if (two) {
      const win = S.score[1] === S.score[2] ? 0 : S.score[1] > S.score[2] ? 1 : 2;
      Emo.text($('rTitle'), win === 0 ? '🤝 打平啦！' : win === 1 ? '🎉 你赢啦！' : '🎉 对手赢啦！');
      Emo.text($('rEmo'), win === 2 ? '👧' : '🙋');
      lines.appendChild(mk('div', '', `🙋 ${S.score[1]} 对 ： 👧 ${S.score[2]} 对`));
    } else {
      Emo.text($('rTitle'), '🎉 全部配对啦！');
      Emo.text($('rEmo'), S.cards[0].e);
      lines.appendChild(mk('div', '', `🎴 翻了 ${S.moves} 次（最少 ${m.pairs} 次）`));
      lines.appendChild(mk('div', '', `⏱ 用时 ${secs} 秒`));
      if (isBest) lines.appendChild(mk('div', '', '🏆 新纪录！'));
    }
    const next = MODES[MODES.findIndex((x) => x.id === m.id) + 1];
    $('rHarder').hidden = !next;
    if (next) $('rHarder').dataset.id = next.id;
    if (INSTANT) showOverlay('resultOv');
    else setTimeout(() => { showOverlay('resultOv'); confetti(); }, 600);
  }

  function confetti() {
    const box = $('confetti');
    box.textContent = '';
    const colors = ['#ff8fb8', '#6bbfff', '#ffd24a', '#7ed9a6', '#c9a7ff', '#ffa45c'];
    const W = window.innerWidth;
    for (let i = 0; i < 60; i++) {
      const p = mk('i');
      if (i % 6 === 0) {
        p.textContent = ['⭐', '🎴', '💖'][i % 3];
        p.style.fontSize = 18 + Math.random() * 14 + 'px';
        p.style.fontFamily = EMOJI_FONT;
      } else {
        p.style.width = 8 + Math.random() * 8 + 'px';
        p.style.height = 10 + Math.random() * 10 + 'px';
        p.style.background = colors[i % colors.length];
      }
      p.style.left = Math.random() * W + 'px';
      p.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
      p.style.setProperty('--rot', (Math.random() * 900 - 450) + 'deg');
      p.style.animationDuration = 2.2 + Math.random() * 1.8 + 's';
      p.style.animationDelay = Math.random() * 0.5 + 's';
      box.appendChild(p);
    }
    setTimeout(() => { box.textContent = ''; }, 4500);
  }

  const showOverlay = (id) => $(id).classList.add('show');
  const hideOverlay = (id) => $(id).classList.remove('show');

  let tutBuilt = false;
  function openTutorial() {
    if (!tutBuilt) {
      tutBuilt = true;
      const row = (parts) => { const r = mk('div', 'demo-row'); parts.forEach((t) => { const e = mk('span', t.length > 3 ? 'lbl' : ''); Emo.text(e, t); r.appendChild(e); }); return r; };
      $('tutArt0').appendChild(row(['🐾', '👆', ' 点一下 ', '🐼']));
      $('tutArt1').appendChild(row(['🐼', '🐼', ' 一样！留下 ', '✅']));
      $('tutArt2').appendChild(row(['🐼', '🐶', '🐱', '🦊', ' 全部配对 ', '⭐']));
    }
    S.tutStep = 0;
    renderTutorial();
    showOverlay('tutOv');
  }
  function renderTutorial() {
    document.querySelectorAll('#tutOv .tut-step').forEach((s) => s.classList.toggle('show', Number(s.dataset.step) === S.tutStep));
    document.querySelectorAll('#tutDots i').forEach((d, i) => d.classList.toggle('on', i === S.tutStep));
    $('tutNext').textContent = S.tutStep < 2 ? '👉 下一步' : '🎮 开始玩！';
  }

  function renderSettings() {
    document.querySelectorAll('#setOv .seg').forEach((seg) => {
      const v = !!Store.data[seg.dataset.opt];
      seg.querySelectorAll('button').forEach((b) => {
        const isOn = b.dataset.v === '1';
        b.classList.toggle('on', isOn === v);
        b.classList.toggle('off-choice', !isOn);
      });
    });
  }

  function setOption(name, value) {
    const v = !!value && value !== '0';
    Store.data[name] = v;
    if (name === 'sound' && v) Sound.unlock();
    if (name === 'picAnimals') { window.__picAnimals = v; Emo.refresh(); if (S.screen === 'play') renderBar(); }
    Store.save();
    renderSettings();
    if (S.screen === 'menu') renderMenu();
  }

  function bind() {
    const on = (id, fn) => $(id).addEventListener('click', fn);
    on('btnHelp', openTutorial);
    on('btnSettings', () => { renderSettings(); $('clearStep1').hidden = false; $('clearStep2').hidden = true; showOverlay('setOv'); });
    on('btnSound', () => setOption('sound', !Store.data.sound));
    on('btnBack', () => showScreen('menu'));
    on('btnAgain', () => start(S.mode.id));
    on('tutNext', () => { if (S.tutStep < 2) { S.tutStep++; renderTutorial(); } else { hideOverlay('tutOv'); Store.data.tutorialSeen = true; Store.save(); } });
    on('rAgain', () => { hideOverlay('resultOv'); start(S.mode.id); });
    on('rHarder', () => { hideOverlay('resultOv'); start($('rHarder').dataset.id); });
    on('rBack', () => { hideOverlay('resultOv'); showScreen('menu'); });
    document.querySelectorAll('#setOv .seg button').forEach((b) => b.addEventListener('click', () => setOption(b.parentElement.dataset.opt, b.dataset.v === '1')));
    on('btnClearStars', () => { $('clearStep1').hidden = true; $('clearStep2').hidden = false; });
    on('btnClearNo', () => { $('clearStep1').hidden = false; $('clearStep2').hidden = true; });
    on('btnClearYes', () => { Store.data.best = {}; Store.data.stars = {}; Store.save(); $('clearStep1').hidden = false; $('clearStep2').hidden = true; renderMenu(); });
    on('setClose', () => hideOverlay('setOv'));
    ['pointerdown', 'touchend', 'click', 'keydown'].forEach((ev) => document.addEventListener(ev, Sound.unlock, { capture: true, passive: true }));
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('dblclick', (e) => e.preventDefault());
  }

  const getState = () => ({
    screen: S.screen,
    mode: S.mode ? S.mode.id : null,
    faces: S.cards.map((c) => c.e),
    up: S.up.slice(),
    doneCount: S.done,
    moves: S.moves,
    lock: S.lock,
    turn: S.turn,
    score: S.score.slice(),
    best: Object.assign({}, Store.data.best),
    stars: Object.assign({}, Store.data.stars),
    overlay: ['tutOv', 'resultOv', 'setOv'].filter((id) => $(id).classList.contains('show')),
    emojiImages: Emo.useImg(),
  });

  function init() {
    if (INSTANT) document.documentElement.classList.add('test-mode');
    window.__picAnimals = Store.data.picAnimals;
    bind();
    renderSettings();
    document.querySelectorAll('.title .emo').forEach((el) => { el.dataset.raw = el.dataset.raw || el.textContent; Emo.text(el, el.dataset.raw); });
    Emo.preload(() => { if (S.screen === 'play') { buildBoardFaces(); renderBar(); } renderMenu(); });
    showScreen('menu');
    if (!TEST && !Store.data.tutorialSeen) openTutorial();
    if (!TEST && 'serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) {
      navigator.serviceWorker.register('sw.js').catch(() => { /* 忽略 */ });
    }
    if (TEST) {
      window.__fanpai = {
        MODES,
        getState,
        start: (id) => { start(id); return getState(); },
        flip: (i) => flip(i),
        setPlayers: (n) => { Store.data.players = n; Store.save(); renderMenu(); },
        setOption: (k, v) => { setOption(k, v); return getState(); },
        solve: () => {
          const seen = new Map();
          S.cards.forEach((c, i) => { if (!seen.has(c.e)) seen.set(c.e, []); seen.get(c.e).push(i); });
          for (const [, [a, b]] of seen) { flip(a); flip(b); }
          return getState();
        },
      };
    }
  }

  // 图片模式切换后，把牌面重画一遍
  function buildBoardFaces() {
    const board = $('board');
    S.cards.forEach((c, i) => {
      const el = board.children[i];
      if (!el) return;
      Emo.text(el.querySelector('.front'), '🐾');
      Emo.text(el.querySelector('.back'), c.e);
    });
  }

  init();
})();
</script>
</body>
</html>
