<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小动物回家">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#e6f7dc">
<link rel="manifest" href="huijia.webmanifest">
<link rel="apple-touch-icon" href="icons/huijia-180.png">
<link rel="icon" type="image/png" href="icons/huijia-192.png">
<title>小动物回家</title>
<style>
  /* ============== 基础与配色 ============== */
  :root {
    --ink: #5b4331;
    --ink-soft: #9a7f69;
    --pink: #ff8fb8;
    --pink-bg: #ffd6e5;
    --blue: #6bbfff;
    --blue-bg: #d4ecff;
    --gold: #ffc93c;
    --red: #ff4658;
    --sheet: #fffdf8;
    --font: ui-rounded, "SF Pro Rounded", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: var(--font);
    color: var(--ink);
    background: linear-gradient(160deg, #e9f8dd 0%, #fff5e1 50%, #e2f2ff 100%);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    overscroll-behavior: none;
    touch-action: manipulation;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 8% 12%, rgba(190, 240, 170, 0.55) 0, rgba(190, 240, 170, 0) 28%),
      radial-gradient(circle at 92% 18%, rgba(255, 230, 150, 0.5) 0, rgba(255, 230, 150, 0) 26%),
      radial-gradient(circle at 85% 90%, rgba(170, 215, 255, 0.55) 0, rgba(170, 215, 255, 0) 30%),
      radial-gradient(circle at 12% 88%, rgba(255, 200, 220, 0.45) 0, rgba(255, 200, 220, 0) 26%);
  }

  button {
    font-family: inherit;
    color: inherit;
    border: none;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  .emo { font-family: var(--emoji); }

  #app { position: fixed; inset: 0; }

  .screen { position: absolute; inset: 0; display: none; }
  .screen.show { display: flex; }

  /* ============== 通用按钮 ============== */
  .btn {
    --shade: #e9d2b3;
    min-height: 56px;
    padding: 0 20px;
    font-size: 20px;
    font-weight: 800;
    color: var(--ink);
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 5px 0 var(--shade), 0 9px 18px rgba(150, 100, 60, 0.12);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
    transition: transform 0.08s, box-shadow 0.08s, opacity 0.2s, filter 0.15s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--shade), 0 3px 8px rgba(150, 100, 60, 0.12); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn:disabled:active { transform: none; box-shadow: 0 5px 0 var(--shade); }
  .btn.pink   { background: linear-gradient(#ffb3cf, #ff8fb8); color: #fff; --shade: #e36a97; text-shadow: 0 1px 1px rgba(170, 50, 90, 0.35); }
  .btn.blue   { background: linear-gradient(#bfe3ff, #8ccfff); color: #2d5a80; --shade: #5fa9e0; }
  .btn.green  { background: linear-gradient(#c9f2d6, #9fe3b6); color: #2f6b45; --shade: #6fc18d; }
  .btn.yellow { background: linear-gradient(#fff0a8, #ffd966); color: #7a5300; --shade: #e7b63c; }
  .btn.purple { background: linear-gradient(#e6d6ff, #c9b0ff); color: #4f3a85; --shade: #a58ae0; }
  .btn.big { min-height: 64px; font-size: 24px; border-radius: 24px; padding: 0 28px; }

  /* ============== 菜单页 ============== */
  #menu {
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding:
      calc(14px + env(safe-area-inset-top))
      calc(20px + env(safe-area-inset-right))
      calc(20px + env(safe-area-inset-bottom))
      calc(20px + env(safe-area-inset-left));
  }
  .menu-inner {
    width: 100%;
    max-width: 1120px;
    margin: auto 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .menu-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .title {
    font-size: clamp(32px, 5.2vw, 50px);
    font-weight: 900;
    letter-spacing: 3px;
    color: #5d4a2f;
    text-shadow: 0 3px 0 #fff, 0 6px 14px rgba(120, 200, 110, 0.35);
    white-space: nowrap;
  }
  .title .emo { display: inline-block; animation: roar 2.4s ease-in-out infinite; }
  .star-total {
    flex-shrink: 0;
    background: #fff;
    border-radius: 999px;
    padding: 8px 20px;
    font-size: 26px;
    font-weight: 900;
    color: #b07a00;
    box-shadow: 0 5px 0 #f1d58c, 0 8px 16px rgba(180, 130, 40, 0.15);
    white-space: nowrap;
  }
  .star-total.bump { animation: bump 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .subtitle { text-align: center; font-size: clamp(22px, 3vw, 28px); font-weight: 900; color: #6d5a3d; }

  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  @media (min-aspect-ratio: 4/3) and (min-width: 960px) {
    .cards { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; }
  }
  .card {
    --bg: #fff;
    --shade: #e9d2b3;
    position: relative;
    background: var(--bg);
    border-radius: 28px;
    padding: 14px 8px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    border: 3px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 6px 0 var(--shade), 0 12px 22px rgba(150, 100, 60, 0.13);
    transition: transform 0.12s, box-shadow 0.08s;
    min-width: 0;
  }
  .card:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--shade), 0 4px 10px rgba(150, 100, 60, 0.12); }
  .card .c-emo { font-family: var(--emoji); font-size: clamp(50px, 6.4vw, 70px); line-height: 1.15; animation: sway 3s ease-in-out infinite; }
  .card:nth-child(2) .c-emo { animation-delay: -0.6s; }
  .card:nth-child(3) .c-emo { animation-delay: -1.2s; }
  .card:nth-child(4) .c-emo { animation-delay: -1.8s; }
  .card:nth-child(5) .c-emo { animation-delay: -2.4s; }
  .card .c-name { font-size: 24px; font-weight: 900; }
  .card .c-tag { font-size: 18px; font-weight: 700; color: #8f725c; white-space: nowrap; }
  .card .c-paws { font-family: var(--emoji); font-size: 15px; letter-spacing: -1px; white-space: nowrap; }
  .card .c-paws .off { opacity: 0.2; filter: grayscale(1); }
  .card .c-wins {
    margin-top: 2px;
    font-size: 18px;
    font-weight: 900;
    color: #a26f00;
    background: rgba(255, 255, 255, 0.85);
    border-radius: 999px;
    padding: 2px 12px;
    white-space: nowrap;
  }
  .card.family .c-tag { white-space: normal; text-align: center; }

  .opt-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 22px; }
  .opt-group {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 10px;
    background: rgba(255, 255, 255, 0.72);
    border-radius: 26px;
    padding: 10px 16px;
    box-shadow: 0 4px 14px rgba(150, 100, 60, 0.08);
  }
  .opt-label { font-size: 20px; font-weight: 900; margin-right: 4px; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .chip {
    min-height: 56px;
    min-width: 56px;
    padding: 0 14px;
    border-radius: 18px;
    background: #fff;
    border: 3px solid #f1e4d3;
    font-size: 20px;
    font-weight: 800;
    color: var(--ink);
    white-space: nowrap;
    transition: transform 0.15s, border-color 0.15s, background 0.15s;
  }
  .chip.emo-chip { font-family: var(--emoji); font-size: 34px; width: 62px; height: 62px; padding: 0; line-height: 1; }
  .chip.on {
    border-color: var(--pink);
    background: #fff0f6;
    box-shadow: 0 0 0 4px rgba(255, 143, 184, 0.28);
    transform: scale(1.07);
  }
  .menu-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; padding-bottom: 6px; }

  @keyframes sway {
    0%, 100% { transform: rotate(-4deg); }
    50% { transform: rotate(4deg) translateY(-2px); }
  }
  @keyframes roar {
    0%, 70%, 100% { transform: scale(1) rotate(0); }
    78% { transform: scale(1.18) rotate(-8deg); }
    86% { transform: scale(1.12) rotate(6deg); }
  }
  @keyframes bump {
    0% { transform: scale(1); }
    40% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }

  /* ============== 游戏页布局 ============== */
  #game {
    padding:
      calc(10px + env(safe-area-inset-top))
      calc(14px + env(safe-area-inset-right))
      calc(10px + env(safe-area-inset-bottom))
      calc(14px + env(safe-area-inset-left));
    --bw: 400px;
    --bh: 500px;
    --col: 600px;
    --panel: 340px;
  }
  #game.show {
    display: grid;
    justify-content: center;
    align-content: center;
    row-gap: 10px;
    column-gap: 26px;
  }
  #game.port {
    grid-template-columns: var(--col);
    grid-template-rows: auto auto var(--bh) auto;
    grid-template-areas: "top" "banner" "board" "controls";
  }
  #game.land {
    grid-template-columns: var(--bw) var(--panel);
    grid-template-rows: minmax(0, 1fr) auto auto auto minmax(0, 1fr);
    grid-template-areas: "board ." "board top" "board banner" "board controls" "board .";
    row-gap: 18px;
  }
  .topbar { grid-area: top; min-width: 0; }
  #bannerSlot { grid-area: banner; position: relative; height: 84px; min-width: 0; }
  #game.land #bannerSlot { height: 132px; }
  .board-wrap {
    grid-area: board;
    position: relative;
    width: var(--bw);
    height: var(--bh);
    justify-self: center;
    align-self: center;
  }
  #board {
    position: absolute;
    left: 0;
    top: 0;
    display: block;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  #board.can { cursor: pointer; }

  /* 玩家卡片 */
  .players { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .pcard {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.8);
    border-radius: 24px;
    padding: 6px 12px 6px 6px;
    border: 3px solid transparent;
    opacity: 0.72;
    transition: opacity 0.25s, border-color 0.25s, box-shadow 0.25s;
  }
  .pcard .av {
    flex-shrink: 0;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-family: var(--emoji);
    font-size: 36px;
    line-height: 1;
    background: var(--pink-bg);
    border: 3px solid var(--pink);
  }
  .pcard.p2 .av { background: var(--blue-bg); border-color: var(--blue); }
  .pcard .who { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; line-height: 1.15; gap: 2px; }
  .pcard .nm-row { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .pcard .nm { font-size: 24px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pcard .sub { font-size: 15px; font-weight: 800; color: var(--ink-soft); white-space: nowrap; overflow: hidden; }
  .pcard .sub.paws { font-family: var(--emoji); letter-spacing: -1px; }
  .pcard.active {
    opacity: 1;
    background: #fff;
    border-color: #ffd24a;
    box-shadow: 0 0 0 5px rgba(255, 210, 74, 0.35), 0 8px 16px rgba(150, 100, 60, 0.12);
  }
  .pcard.active .av { animation: hop 1.1s ease-in-out infinite; }
  @keyframes hop {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  .vs { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
  .vs .vs-t { font-family: var(--emoji); font-size: 26px; }
  .vs .score { font-size: 18px; font-weight: 900; color: var(--ink-soft); white-space: nowrap; }
  .status {
    margin-top: 6px;
    text-align: center;
    font-size: 24px;
    font-weight: 900;
    min-height: 34px;
    line-height: 34px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #game.land .status { font-size: 26px; margin-top: 10px; }
  #game.land .players { flex-direction: column; align-items: stretch; gap: 6px; }
  #game.land .pcard { flex: none; }
  #game.land .pcard .av { width: 62px; height: 62px; font-size: 38px; }
  #game.land .vs { flex-direction: row; justify-content: center; gap: 12px; }
  #game.port .pcard .sub { display: none; }

  /* 控制按钮 */
  .controls { grid-area: controls; display: flex; gap: 10px; justify-content: center; min-width: 0; }
  .controls .btn { flex: 1 1 0; padding: 0 6px; min-width: 0; }
  #game.land .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 12px; }
  #game.land .controls .btn { min-height: 60px; font-size: 22px; }
  #game.land .controls .btn-set { grid-column: span 2; min-height: 52px; }

  /* ============== 提醒横幅 ============== */
  .banner {
    position: absolute;
    inset: 0;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 4px 16px;
    font-weight: 900;
    font-size: clamp(22px, 3.4vw, 28px);
    line-height: 1.22;
    overflow: hidden;
  }
  .banner .b-main { display: block; white-space: nowrap; }
  .banner .b-main span { white-space: nowrap; }
  .banner .b-small { display: block; font-size: 18px; font-weight: 800; margin-top: 3px; white-space: nowrap; }
  #game.land .banner { font-size: 27px; padding: 6px 12px; }
  #game.land .banner .b-main span { display: block; }
  .banner.none {
    background: rgba(255, 255, 255, 0.55);
    border: 3px dashed rgba(150, 190, 120, 0.55);
    color: #7f8f62;
    font-size: 22px;
    font-weight: 900;
  }
  .banner.none .b-small { color: #9aa582; }
  .banner.red {
    background: linear-gradient(135deg, #ff5c6c 0%, #ff7a59 100%);
    color: #fff;
    border: 4px solid #fff;
    text-shadow: 0 2px 0 rgba(190, 30, 50, 0.35);
    box-shadow: 0 0 0 4px #ff5c6c, 0 10px 26px rgba(255, 70, 90, 0.45);
    animation: shakeIn 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) both, glowRed 1.3s ease-in-out 0.6s infinite;
  }
  .banner.gold {
    background: linear-gradient(135deg, #fff5b8 0%, #ffd54a 100%);
    color: #7a4c00;
    border: 4px solid #fff;
    box-shadow: 0 0 0 4px #ffc62e, 0 0 26px rgba(255, 200, 40, 0.65);
    animation: popBanner 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both, glowGold 1.6s ease-in-out 0.45s infinite;
  }
  .banner.pink {
    background: linear-gradient(135deg, #ffe0ec 0%, #ffb8d2 100%);
    color: #a8325f;
    border: 4px solid #fff;
    box-shadow: 0 0 0 3px #ff9cc2, 0 8px 18px rgba(255, 120, 170, 0.3);
    animation: popBanner 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .banner.bubble {
    overflow: visible;
    background: #fff;
    color: #e23a4f;
    border: 4px solid #ff5c6c;
    box-shadow: 0 10px 24px rgba(255, 70, 90, 0.3);
    animation: wobble 0.55s ease-in-out both;
  }
  .banner.bubble .b-small { color: #8a6a55; }
  .banner.bubble::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -17px;
    margin-left: -14px;
    border: 14px solid transparent;
    border-bottom: 0;
    border-top-color: #ff5c6c;
  }
  #game.land .banner.bubble::after {
    left: -17px;
    top: 50%;
    bottom: auto;
    margin-left: 0;
    margin-top: -14px;
    border: 14px solid transparent;
    border-left: 0;
    border-right-color: #ff5c6c;
  }
  @keyframes shakeIn {
    0% { transform: scale(0.6); opacity: 0; }
    30% { transform: scale(1.06) rotate(-2.5deg); opacity: 1; }
    45% { transform: scale(1) rotate(2.5deg) translateX(6px); }
    60% { transform: rotate(-2deg) translateX(-6px); }
    75% { transform: rotate(1.2deg) translateX(3px); }
    90% { transform: rotate(-0.6deg) translateX(-2px); }
    100% { transform: none; }
  }
  @keyframes glowRed {
    0%, 100% { box-shadow: 0 0 0 4px #ff5c6c, 0 10px 26px rgba(255, 70, 90, 0.45); }
    50% { box-shadow: 0 0 0 7px #ff8a96, 0 10px 34px rgba(255, 70, 90, 0.65); }
  }
  @keyframes glowGold {
    0%, 100% { box-shadow: 0 0 0 4px #ffc62e, 0 0 22px rgba(255, 200, 40, 0.55); }
    50% { box-shadow: 0 0 0 7px #ffe07a, 0 0 36px rgba(255, 200, 40, 0.85); }
  }
  @keyframes popBanner {
    0% { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes wobble {
    0% { transform: scale(0.8); }
    30% { transform: scale(1.05) rotate(-2deg); }
    55% { transform: rotate(2deg); }
    80% { transform: rotate(-1deg); }
    100% { transform: none; }
  }

  /* ============== 弹层通用 ============== */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    padding:
      calc(16px + env(safe-area-inset-top))
      calc(16px + env(safe-area-inset-right))
      calc(16px + env(safe-area-inset-bottom))
      calc(16px + env(safe-area-inset-left));
    background: rgba(90, 80, 50, 0.38);
  }
  .overlay.show { display: flex; animation: fadeIn 0.2s ease-out; }
  .sheet {
    position: relative;
    width: min(640px, 100%);
    max-height: 100%;
    overflow-y: auto;
    background: var(--sheet);
    border-radius: 34px;
    padding: 26px 24px 24px;
    text-align: center;
    border: 4px solid #fff;
    box-shadow: 0 18px 44px rgba(90, 60, 40, 0.3);
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn { from { transform: scale(0.75); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .sheet h2 { font-size: 30px; font-weight: 900; margin-bottom: 14px; }
  .sheet-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 18px; }

  /* ============== 教程 ============== */
  .tut-step { display: none; }
  .tut-step.show { display: block; animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .tut-art {
    min-height: 280px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .tut-text { font-size: 28px; font-weight: 900; line-height: 1.3; }
  .tut-small { font-size: 21px; font-weight: 800; color: #8a6f52; margin-top: 4px; }
  .tut-dots { display: flex; justify-content: center; gap: 10px; margin-top: 16px; }
  .tut-dots i { width: 14px; height: 14px; border-radius: 50%; background: #e3e8cf; transition: all 0.25s; }
  .tut-dots i.on { width: 34px; border-radius: 8px; background: #8fd07a; }

  /* ============== 结果卡片 ============== */
  .result .r-emo { font-family: var(--emoji); font-size: 84px; line-height: 1.1; animation: hop 1.2s ease-in-out infinite; }
  .result .r-title { font-size: 44px; font-weight: 900; margin-top: 4px; }
  .result.win .r-title { color: #ff5f99; text-shadow: 0 3px 0 #ffe0ec; }
  .result .r-sub { font-size: 24px; font-weight: 800; color: #8a6a55; margin-top: 6px; }
  .result .r-eat { font-size: 22px; font-weight: 900; color: #3f8a55; margin-top: 8px; }
  .result .r-star {
    display: inline-block;
    margin-top: 12px;
    font-size: 40px;
    font-weight: 900;
    color: #d99800;
    text-shadow: 0 3px 0 #fff3c4;
    animation: starUp 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .result .r-tip {
    margin: 16px auto 0;
    max-width: 460px;
    padding: 12px 16px;
    border-radius: 20px;
    background: #fff1f1;
    border: 3px dashed #ff9aa5;
    color: #d8404f;
    font-size: 22px;
    font-weight: 900;
  }
  .result .r-suggest { margin-top: 18px; width: 100%; max-width: 440px; }
  .result .r-suggest.btn { animation: nudge 1.4s ease-in-out infinite; }
  @keyframes starUp {
    0% { transform: translateY(30px) scale(0.3); opacity: 0; }
    60% { transform: translateY(-8px) scale(1.25); opacity: 1; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  @keyframes nudge {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }

    top: -40px;

    border-radius: 3px;
    font-style: normal;
    animation: fall linear forwards;
  }
  @keyframes fall {
    0% { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 1; }

  /* ============== 设置 ============== */
  .set-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding: 14px 16px;
    margin-top: 12px;
    border-radius: 22px;
    background: #fff;
    border: 3px solid #f6e8d6;
    text-align: left;
  }
  .set-name { font-size: 22px; font-weight: 900; }
  .set-name small { display: block; font-size: 17px; font-weight: 800; color: #d8404f; }
  .seg { display: flex; gap: 8px; }
  .seg button {
    min-height: 56px;
    min-width: 92px;
    padding: 0 14px;
    border-radius: 18px;
    font-size: 20px;
    font-weight: 900;
    background: #f5efe7;
    color: #a48b77;
    border: 3px solid transparent;
  }
  .seg button.on { background: #e5f8ea; color: #2f7a4b; border-color: #7fd49b; }
  .seg button.on.off-choice { background: #fff0f0; color: #c0404f; border-color: #ff9aa5; }
  .parent-zone { margin-top: 18px; padding: 14px; border-radius: 22px; background: #f3f0ff; border: 3px dashed #cbbcf5; }
  .parent-zone h3 { font-size: 20px; font-weight: 900; color: #5d4a96; margin-bottom: 10px; }
  .confirm-box { font-size: 22px; font-weight: 900; color: #c0404f; }
  .confirm-box .sheet-btns { margin-top: 10px; }

  @media (hover: hover) and (pointer: fine) {
    .btn:hover:not(:disabled) { filter: brightness(1.04); }
    .card:hover { transform: translateY(-3px); }
    .chip:hover { border-color: #f5c9d9; }
  }

  [hidden] { display: none !important; }
  .test-mode *, .test-mode *::before, .test-mode *::after { animation: none !important; transition: none !important; }
  /* ============== 小动物回家 ============== */
  body { background: linear-gradient(160deg, #e9f8dd 0%, #fff5e1 50%, #e2f2ff 100%); }
  .title .emo { animation: hop 1.2s ease-in-out infinite; display: inline-block; }

  /* 选关 */
  .chapters { display: flex; flex-direction: column; gap: 14px; }
  .chapter {
    background: rgba(255, 255, 255, 0.72);
    border-radius: 26px;
    padding: 12px 16px 14px;
    box-shadow: 0 4px 14px rgba(150, 100, 60, 0.08);
  }
  .chapter-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .chapter-head .ch-name { font-size: 24px; font-weight: 900; }
  .chapter-head .ch-desc { font-size: 17px; font-weight: 800; color: #9a7f69; }
  .chapter-head .ch-stars { margin-left: auto; font-size: 18px; font-weight: 900; color: #b07a00; }
  .levels { display: flex; flex-wrap: wrap; gap: 10px; }
  .lvl {
    --shade: #dcc9ad;
    width: 104px;
    min-height: 92px;
    border-radius: 20px;
    background: #fff;
    box-shadow: 0 5px 0 var(--shade), 0 8px 16px rgba(150, 100, 60, 0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 6px 4px;
    transition: transform 0.08s, box-shadow 0.08s;
  }
  .lvl:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--shade); }
  .lvl .l-id { font-size: 20px; font-weight: 900; }
  .lvl .l-name { font-size: 14px; font-weight: 800; color: #8f725c; white-space: nowrap; }
  .lvl .l-stars { font-family: var(--emoji); font-size: 16px; letter-spacing: -1px; }
  .lvl .l-stars .off { opacity: 0.22; filter: grayscale(1); }
  .lvl.locked { background: #efe9e1; color: #b8a896; box-shadow: 0 5px 0 #d8cfc3; }
  .lvl.locked .l-stars { font-size: 22px; }
  .lvl.next { background: #fff7cf; --shade: #e8c75a; animation: nudge 1.4s ease-in-out infinite; }

  /* 游戏页 */
  #play {
    padding:
      calc(10px + env(safe-area-inset-top))
      calc(14px + env(safe-area-inset-right))
      calc(10px + env(safe-area-inset-bottom))
      calc(14px + env(safe-area-inset-left));
    gap: 18px;
    justify-content: center;
    align-items: center;
  }
  #play.show { display: flex; }
  #play.port { flex-direction: column; }
  .map-wrap { position: relative; flex: 0 0 auto; display: grid; place-items: center; }
  .panel { flex: 0 0 auto; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  #play.land .panel { width: var(--panel, 470px); max-height: 100%; }
  #play.port .panel { width: min(100%, 760px); }

  .lv-head { display: flex; align-items: center; gap: 10px; }
  .lv-title { font-size: 26px; font-weight: 900; white-space: nowrap; }
  .lv-goal { display: flex; gap: 8px; flex-wrap: wrap; font-size: 17px; font-weight: 900; color: #7a6450; }
  .lv-goal span { background: rgba(255, 255, 255, 0.8); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .lv-head .btn { min-height: 46px; font-size: 18px; padding: 0 14px; margin-left: auto; }

  .msg {
    position: relative;
    min-height: 64px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8px 14px;
    font-size: 21px;
    font-weight: 900;
    line-height: 1.3;
    background: rgba(255, 255, 255, 0.6);
    border: 3px dashed rgba(150, 190, 120, 0.55);
    color: #6f7f55;
  }
  .msg.red { background: linear-gradient(135deg, #ff6b78, #ff8b64); color: #fff; border: 3px solid #fff; box-shadow: 0 0 0 3px #ff5c6c; animation: shakeIn 0.5s both; }
  .msg.gold { background: linear-gradient(135deg, #fff5b8, #ffd54a); color: #7a4c00; border: 3px solid #fff; box-shadow: 0 0 0 3px #ffc62e; animation: popBanner 0.4s both; }
  .msg.blue { background: linear-gradient(135deg, #e3f3ff, #bfe3ff); color: #2d5a80; border: 3px solid #fff; box-shadow: 0 0 0 3px #8ccfff; animation: popBanner 0.4s both; }

  /* 地图 */
  .map {
    position: relative;
    display: grid;
    grid-template-columns: repeat(var(--cols), var(--cs));
    grid-template-rows: repeat(var(--rows), var(--cs));
    border-radius: calc(var(--cs) * 0.22);
    padding: calc(var(--cs) * 0.08);
    background: #a8d98f;
    box-shadow: 0 8px 0 #86bf73, 0 14px 26px rgba(80, 120, 60, 0.22);
  }
  .cell { position: relative; margin: calc(var(--cs) * 0.03); border-radius: calc(var(--cs) * 0.16); background: #e7f8d9; display: grid; place-items: center; font-family: var(--emoji); font-size: calc(var(--cs) * 0.6); line-height: 1; }
  .cell.alt { background: #dbf2c9; }
  .cell.water { background: linear-gradient(#9fdcff, #6fbdf2); font-size: calc(var(--cs) * 0.4); }
  .cell.home { background: #ffd0e0; }
  .cell.start { box-shadow: inset 0 0 0 3px rgba(255, 143, 184, 0.45); }
  .carrot, .actor, .dot, .boom, .flag {
    position: absolute;
    left: calc(var(--cs) * 0.08);
    top: calc(var(--cs) * 0.08);
    width: var(--cs);
    height: var(--cs);
    display: grid;
    place-items: center;
    font-family: var(--emoji);
    line-height: 1;
    pointer-events: none;
    transform: translate(calc(var(--c) * var(--cs)), calc(var(--r) * var(--cs)));
  }
  .carrot { font-size: calc(var(--cs) * 0.5); transition: transform 0.3s, opacity 0.3s; }
  .carrot.eaten { opacity: 0; transform: translate(calc(var(--c) * var(--cs)), calc(var(--r) * var(--cs) - var(--cs) * 0.5)) scale(1.6); }
  .actor { font-size: calc(var(--cs) * 0.62); z-index: 3; transition: transform var(--step, 400ms) ease-in-out; }
  .actor .face {
    width: 76%;
    height: 76%;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 35% 30%, #fff 0, #ffd6e5 55%, #ffc0d7 100%);
    border: calc(var(--cs) * 0.05) solid #ff8fb8;
    box-shadow: 0 calc(var(--cs) * 0.05) 0 rgba(120, 80, 40, 0.25);
    font-size: calc(var(--cs) * 0.46);
  }
  .actor.bump .face { animation: bump var(--step, 400ms) ease-in-out; }
  .actor.hop .face { animation: stepHop var(--step, 400ms) ease-in-out; }
  .actor.happy .face { animation: hop 0.6s ease-in-out infinite; }
  @keyframes bump {
    0%, 100% { transform: translate(0, 0); }
    40% { transform: translate(calc(var(--bx) * 0.35), calc(var(--by) * 0.35)); }
    55% { transform: translate(calc(var(--bx) * 0.2), calc(var(--by) * 0.2)) rotate(-12deg); }
    70% { transform: translate(0, 0) rotate(8deg); }
  }
  @keyframes stepHop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(calc(var(--cs) * -0.12)); } }
  .dot { z-index: 1; }
  .dot::after { content: ""; width: 22%; height: 22%; border-radius: 50%; background: rgba(255, 110, 160, 0.55); border: 2px solid #fff; }
  .dot.done::after { background: rgba(255, 180, 0, 0.8); }
  .boom { font-size: calc(var(--cs) * 0.5); z-index: 4; animation: popBanner 0.3s both; }
  .flag { font-size: calc(var(--cs) * 0.34); z-index: 2; }

  /* 程序区 */
  .prog { background: rgba(255, 255, 255, 0.8); border-radius: 22px; padding: 8px 10px 10px; border: 3px solid transparent; }
  .prog.target { border-color: #ffd24a; box-shadow: 0 0 0 4px rgba(255, 210, 74, 0.3); }
  .prog-head { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 900; margin-bottom: 6px; cursor: pointer; }
  .prog-head .cnt { margin-left: auto; font-size: 16px; color: #9a7f69; background: #f5efe7; border-radius: 999px; padding: 2px 10px; }
  .prog-head .cnt.full { color: #c0404f; background: #fff0f0; }
  .prog.magic .prog-head { color: #b0407a; }
  .slots { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 60px; }
  .blk {
    position: relative;
    width: 56px;
    height: 56px;
    border-radius: 16px;
    display: grid;
    place-items: center;
    font-size: 34px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
    box-shadow: 0 4px 0 rgba(0, 0, 0, 0.16);
    flex-shrink: 0;
    transition: transform 0.12s;
  }
  .blk.U { background: #5aa9f0; }
  .blk.D { background: #9b7be0; }
  .blk.L { background: #ff9d3c; }
  .blk.R { background: #4fbf72; }
  .blk.M { background: #ff7fb4; font-family: var(--emoji); font-size: 30px; }
  .blk.run, .rep.run > .rep-head { transform: scale(1.14); box-shadow: 0 0 0 4px #ffd24a, 0 4px 0 rgba(0, 0, 0, 0.16); }
  .blk.err { box-shadow: 0 0 0 4px #ff3348, 0 4px 0 rgba(0, 0, 0, 0.16); animation: shakeIn 0.5s both; }
  .blk.ghost { opacity: 0.4; }
  .add {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    border: 3px dashed #d8c7b1;
    color: #c8b49a;
    font-size: 30px;
    font-weight: 900;
    display: grid;
    place-items: center;
    background: transparent;
    flex-shrink: 0;
  }
  .add.on { border-color: #ffb800; color: #ffb800; background: #fff8dc; animation: nudge 1.2s ease-in-out infinite; }
  .rep {
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 6px 5px 5px;
    border-radius: 18px;
    background: #fff3c4;
    border: 3px solid #ffd24a;
  }
  .rep.target { background: #ffe98a; box-shadow: 0 0 0 4px rgba(255, 190, 0, 0.35); }
  .rep-head {
    min-width: 62px;
    height: 56px;
    border-radius: 14px;
    background: #ffc21a;
    color: #7a4c00;
    font-size: 22px;
    font-weight: 900;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.05;
    padding: 0 6px;
  }
  .rep-head small { font-size: 13px; font-weight: 800; opacity: 0.8; }
  .rep-body { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .rep-del {
    position: absolute;
    right: -10px;
    top: -10px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #ff6b78;
    color: #fff;
    font-size: 16px;
    font-weight: 900;
    display: grid;
    place-items: center;
    border: 2px solid #fff;
  }
  .palette { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .palette .blk { width: 72px; height: 72px; font-size: 44px; border-radius: 20px; box-shadow: 0 6px 0 rgba(0, 0, 0, 0.18); }
  .palette .blk:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18); }
  .palette .blk.rep-btn { width: 96px; background: #ffc21a; color: #7a4c00; font-size: 26px; font-family: var(--emoji); text-shadow: none; }
  .palette .blk.rep-btn small { display: block; font-family: var(--font); font-size: 15px; font-weight: 900; }
  .palette .blk.M small { display: block; font-family: var(--font); font-size: 14px; font-weight: 900; color: #fff; }
  .palette .blk:disabled { opacity: 0.35; }
  .ctrls { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 10px; }
  .ctrls .btn { min-height: 58px; font-size: 20px; padding: 0 6px; }
  .ctrls .go { grid-row: span 2; font-size: 30px; min-height: 126px; }
  .answer { background: #fffbe8; border: 3px dashed #ffc62e; border-radius: 18px; padding: 8px 10px; }
  .answer .a-title { font-size: 16px; font-weight: 900; color: #a26f00; margin-bottom: 6px; }
  .answer .slots { min-height: 0; }
  .answer .blk, .answer .rep-head { transform: scale(0.8); margin: -4px; }

  /* 教程和章节介绍里的小插图 */
  .demo-line { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; font-size: 30px; font-weight: 900; color: #c7a88c; }
  .demo-line .blk { cursor: default; }
  .demo-map { display: inline-grid; grid-template-columns: repeat(4, 54px); gap: 4px; padding: 6px; border-radius: 16px; background: #a8d98f; }
  .demo-map div { width: 54px; height: 54px; border-radius: 10px; background: #e7f8d9; display: grid; place-items: center; font-family: var(--emoji); font-size: 30px; }
  .demo-map .p { background: #fff3c4; }

  /* 结果 */
  .result .r-stars { font-family: var(--emoji); font-size: 58px; margin-top: 8px; letter-spacing: 4px; }
  .result .r-stars span { display: inline-block; animation: starUp 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  .result .r-stars span.off { opacity: 0.2; filter: grayscale(1); animation: none; }
  .result .r-lines { margin-top: 10px; font-size: 21px; font-weight: 900; color: #7a6450; line-height: 1.6; }
  .result .r-tip2 { margin-top: 10px; font-size: 19px; font-weight: 900; color: #b25e00; }
</style>
</head>

<div id="app">

  <!-- ============== 选关页 ============== -->
  <section class="screen show" id="menu">
    <div class="menu-inner">
      <header class="menu-head">
        <div class="title"><span class="emo" id="titleAvatar">🐼</span> 小动物回家</div>
        <div class="star-total" id="starTotal"><span class="emo">⭐</span> <span id="starNum">0</span></div>

<script>
/* === CODE_GAME_START === */
const CodeGame = (() => {
  'use strict';

  /* ---------- 积木 ----------
   * 'U' 'D' 'L' 'R'：往上/下/左/右走一格
   * 'M'：魔法积木（执行“魔法积木”那一行）
   * { t: 'rep', n: 2..9, body: [...] }：重复 n 次（里面不能再放重复）
   * 程序：{ main: [...], magic: [...] }
   */
  const DIRS = { U: [-1, 0], D: [1, 0], L: [0, -1], R: [0, 1] };
  const MIN_REP = 2, MAX_REP = 9;

  /* ---------- 地图 ----------
   * '.' 草地  '#' 大树  '~' 小河  'S' 起点  'H' 家  'c' 胡萝卜
   */
  const CHAPTERS = [
    null,
    { id: 1, emoji: '🌱', name: '排排队', desc: '用箭头积木排出回家的路' },
    { id: 2, emoji: '🐛', name: '找虫子', desc: '程序里有错，找出来改好' },
    { id: 3, emoji: '🔁', name: '重复', desc: '积木不够用？让它重复几次' },
    { id: 4, emoji: '⭐', name: '魔法积木', desc: '把一串动作变成一块魔法积木' },
  ];

  const rep = (n, ...body) => ({ t: 'rep', n, body });
  const S = (str) => str.split('');
  const ARROWS = ['U', 'D', 'L', 'R'];

  const LEVELS = [
    // 🌱 排排队
    { id: '1-1', ch: 1, name: '往右走', map: ['.....', 'S.c.H', '.....'], blocks: ['R'], max: 6, sol: { main: S('RRRR') }, hint: '家在右边，点 4 次 ➡️，再点 ▶️ 开始' },
    { id: '1-2', ch: 1, name: '往上走', map: ['..H..', '..c..', '.....', '..S..'], blocks: ['U', 'R'], max: 5, sol: { main: S('UUU') }, hint: '家在上面，要用 ⬆️' },
    { id: '1-3', ch: 1, name: '拐个弯', map: ['....H', '#...c', '#....', 'S....'], blocks: ARROWS, max: 9, sol: { main: S('RRRRUUU') }, hint: '先往右走到头，再往上走' },
    { id: '1-4', ch: 1, name: '绕过大树', map: ['.....', 'S.#.H', '..c..'], blocks: ARROWS, max: 8, sol: { main: S('DRRRUR') }, hint: '大树走不过去，从下面绕过去' },
    { id: '1-5', ch: 1, name: '小河边', map: ['..~~H', 'S.~..', '..c..', '.~~~.', '.....'], blocks: ARROWS, max: 9, sol: { main: S('DRRRURU') }, hint: '小动物不会游泳，从胡萝卜那里绕过去' },
    { id: '1-6', ch: 1, name: '小树林', map: ['S.#..', '.##.H', '...#.', '#c...', '.....'], blocks: ARROWS, max: 11, sol: { main: S('DDRDRRRUU') }, hint: '先往下走，去捡胡萝卜' },
    // 🐛 找虫子（start：一开始摆好的、有错的程序）
    { id: '2-1', ch: 2, name: '换一块', map: ['.....', 'S...H', '.....'], blocks: ARROWS, max: 5, start: { main: S('RRUR') }, sol: { main: S('RRRR') }, hint: '有一块积木方向错了：点它删掉，再放对的' },
    { id: '2-2', ch: 2, name: '少了一块', map: ['....H', '....c', 'S....'], blocks: ARROWS, max: 7, start: { main: S('RRRRU') }, sol: { main: S('RRRRUU') }, hint: '程序走完了还没到家，还差一步' },
    { id: '2-3', ch: 2, name: '撞到大树', map: ['.....', 'S.#.H', '..c..'], blocks: ARROWS, max: 7, start: { main: S('DRRURR') }, sol: { main: S('DRRRUR') }, hint: '看小动物在哪里撞到树，那一块要改' },
    { id: '2-4', ch: 2, name: '换个顺序', map: ['..c.H', '.#.#.', 'S....'], blocks: ARROWS, max: 7, start: { main: S('URURRR') }, sol: { main: S('UURRRR') }, hint: '先往上走两格，再往右' },
    { id: '2-5', ch: 2, name: '别掉进河里', map: ['S.~..', '..~.H', '.....'], blocks: ARROWS, max: 8, start: { main: S('RRDDRRU') }, sol: { main: S('DDRRRUR') }, hint: '先往下走，从下面绕过小河' },
    // 🔁 重复
    { id: '3-1', ch: 3, name: '走好远', map: ['........', 'S.c..c.H', '........'], blocks: ['R', 'rep'], max: 2, sol: { main: [rep(7, 'R')] }, hint: '放一个 🔁，把 ➡️ 放进去，再把次数点到 7' },
    { id: '3-2', ch: 3, name: '先上再右', map: ['..c..H', '......', '......', '......', '......', 'S.....'], blocks: ['U', 'R', 'rep'], max: 4, sol: { main: [rep(5, 'U'), rep(5, 'R')] }, hint: '用两个 🔁：一个往上走，一个往右走' },
    { id: '3-3', ch: 3, name: '爬楼梯', map: ['....H', '...c.', '..c..', '.c...', 'S....'], blocks: ['U', 'R', 'rep'], max: 3, sol: { main: [rep(4, 'R', 'U')] }, hint: '楼梯是“右、上”一直重复' },
    { id: '3-4', ch: 3, name: '绕着池塘走', map: ['H....', '.~~~.', '.~~~c', '.~~~.', 'S.c..'], blocks: ARROWS.concat(['rep']), max: 6, sol: { main: [rep(4, 'R'), rep(4, 'U'), rep(4, 'L')] }, hint: '用三个 🔁：往右、往上、往左' },
    { id: '3-5', ch: 3, name: '之字形', map: ['S.c....', '....c..', '......c', '......H'], blocks: ARROWS.concat(['rep']), max: 4, sol: { main: [rep(3, 'R', 'R', 'D')] }, hint: '“右、右、下”重复 3 次' },
    { id: '3-6', ch: 3, name: '长长的楼梯', map: ['.....cH', '...c...', '..c....', '.c.....', 'S......'], blocks: ARROWS.concat(['rep']), max: 5, sol: { main: [rep(4, 'R', 'U'), rep(2, 'R')] }, hint: '先爬楼梯，爬完再往右走' },
    // ⭐ 魔法积木（maxMagic：魔法积木那一行最多放几块）
    { id: '4-1', ch: 4, name: '魔法积木', map: ['......H', '....c..', '..c....', 'S......'], blocks: ARROWS.concat(['M']), max: 3, maxMagic: 3, sol: { main: S('MMM'), magic: S('RRU') }, hint: '把“右、右、上”放进 ⭐ 那一行，程序里用 3 次 ⭐' },
    { id: '4-2', ch: 4, name: '跳过小水坑', map: ['.c.c.c.', 'S~.~.~H'], blocks: ARROWS.concat(['M']), max: 3, maxMagic: 4, sol: { main: S('MMM'), magic: S('URRD') }, hint: '⭐ 可以是“上、右、右、下”' },
    { id: '4-3', ch: 4, name: '三个小洞', map: ['#c#c#c#', 'S.....H'], blocks: ARROWS.concat(['M']), max: 3, maxMagic: 4, sol: { main: S('MMM'), magic: S('RUDR') }, hint: '⭐ 可以是“右、上、下、右”' },
    { id: '4-4', ch: 4, name: '魔法加重复', map: ['........H', '......c..', '.........', '..c......', 'S........'], blocks: ARROWS.concat(['M', 'rep']), max: 2, maxMagic: 3, sol: { main: [rep(4, 'M')], magic: S('RRU') }, hint: '⭐ 是“右、右、上”，再用 🔁 重复 4 次' },
    { id: '4-5', ch: 4, name: '大挑战', map: ['.........H', '......c...', '...c......', 'S.c.......'], blocks: ARROWS.concat(['M', 'rep']), max: 2, maxMagic: 3, sol: { main: [rep(3, 'M')], magic: [rep(3, 'R'), 'U'] }, hint: '⭐ 里面也可以放 🔁 哦' },
  ];

  function parse(level) {
    const grid = level.map.map((row) => row.split(''));
    let start = null, home = null;
    const carrots = [];
    grid.forEach((row, r) => row.forEach((ch, c) => {
      if (ch === 'S') { start = [r, c]; row[c] = '.'; }
      else if (ch === 'H') home = [r, c];
      else if (ch === 'c') { carrots.push([r, c]); row[c] = '.'; }
    }));
    return { rows: grid.length, cols: grid[0].length, grid, start, home, carrots };
  }

  const count = (list) => (list || []).reduce((n, b) => n + (typeof b === 'string' ? 1 : 1 + count(b.body)), 0);
  const totalBlocks = (prog) => count(prog.main) + count(prog.magic);

  // 展开成一步一步：{ d: 'U'|..., keys: [正在执行的积木位置] }
  function compile(prog) {
    const steps = [];
    const walk = (list, prefix, outerKeys, depth) => {
      list.forEach((b, i) => {
        const key = prefix + '.' + i;
        if (typeof b === 'string') {
          if (b === 'M') {
            if (depth < 1) walk(prog.magic || [], 'magic', outerKeys.concat(key), depth + 1);
          } else {
            steps.push({ d: b, keys: outerKeys.concat(key) });
          }
        } else if (b && b.t === 'rep') {
          const n = Math.max(MIN_REP, Math.min(MAX_REP, b.n | 0));
          for (let k = 0; k < n; k++) walk(b.body || [], key, outerKeys.concat(key), depth);
        }
      });
    };
    walk(prog.main || [], 'main', [], 0);
    return steps;
  }

  // 执行程序：返回每一帧和结果
  // result：home 到家 / tree 撞树 / water 掉进河 / out 走出地图 / short 走完了没到家 / empty 没有积木
  function run(level, prog) {
    const L = parse(level);
    const steps = compile(prog);
    const frames = [];
    let [r, c] = L.start;
    const eaten = new Set();
    if (!steps.length) return { frames, result: 'empty', carrots: 0, total: L.carrots.length, pos: [r, c] };
    for (let i = 0; i < steps.length && i < 400; i++) {
      const s = steps[i];
      const [dr, dc] = DIRS[s.d];
      const nr = r + dr, nc = c + dc;
      if (nr < 0 || nc < 0 || nr >= L.rows || nc >= L.cols) {
        frames.push({ r, c, tr: nr, tc: nc, d: s.d, keys: s.keys, event: 'out' });
        return { frames, result: 'out', carrots: eaten.size, total: L.carrots.length, pos: [r, c] };
      }
      const ch = L.grid[nr][nc];
      if (ch === '#' || ch === '~') {
        const ev = ch === '#' ? 'tree' : 'water';
        frames.push({ r, c, tr: nr, tc: nc, d: s.d, keys: s.keys, event: ev });
        return { frames, result: ev, carrots: eaten.size, total: L.carrots.length, pos: [r, c] };
      }
      r = nr;
      c = nc;
      let event = 'move';
      const ci = L.carrots.findIndex(([a, b]) => a === r && b === c);
      if (ci >= 0 && !eaten.has(ci)) { eaten.add(ci); event = 'carrot'; }
      frames.push({ r, c, d: s.d, keys: s.keys, event, carrot: ci });
      if (ch === 'H') {
        frames[frames.length - 1].home = true;
        return { frames, result: 'home', carrots: eaten.size, total: L.carrots.length, pos: [r, c] };
      }
    }
    return { frames, result: 'short', carrots: eaten.size, total: L.carrots.length, pos: [r, c] };
  }

  function par(level) {
    return totalBlocks(level.sol);
  }

  // 星星：到家 1 颗，胡萝卜都捡了 +1，积木不超过参考答案 +1
  function stars(level, prog, res) {
    if (res.result !== 'home') return 0;
    let n = 1;
    if (res.carrots === res.total) n++;
    if (totalBlocks(prog) <= par(level)) n++;
    return n;
  }

  const clone = (x) => JSON.parse(JSON.stringify(x));

  return { DIRS, MIN_REP, MAX_REP, CHAPTERS, LEVELS, parse, count, totalBlocks, compile, run, par, stars, clone };
})();
/* === CODE_GAME_END === */
</script>

<script>
(() => {
  'use strict';

  const TEST = /[?&]test=1(?:&|$)/.test(location.search);
  const INSTANT = TEST && !/[?&]anim=1(?:&|$)/.test(location.search);
  const G = CodeGame;
  const AVATARS = ['🐼', '🐶', '🐸', '🐷', '🦄', '🐧', '🐰', '🐱'];
  const ARROW = { U: '↑', D: '↓', L: '←', R: '→' };
  const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  const $ = (id) => document.getElementById(id);
  const now = () => performance.now();

  /* ============== 存储 ============== */
  const Store = (() => {
    const KEY = 'kidsCode.v1';
    const data = { stars: {}, avatar: '🐼', sound: true, preview: true, speed: 'slow', tutorialSeen: false, intro: {}, unlockAll: false };
    try {
      const o = JSON.parse(window.localStorage.getItem(KEY) || 'null');
      if (o && typeof o === 'object') {
        if (o.stars && typeof o.stars === 'object') {
          for (const L of G.LEVELS) {
            const n = o.stars[L.id];
            if (Number.isInteger(n) && n >= 0 && n <= 3) data.stars[L.id] = n;
          }
        }
        if (AVATARS.includes(o.avatar)) data.avatar = o.avatar;
        for (const k of ['sound', 'preview', 'tutorialSeen', 'unlockAll']) if (typeof o[k] === 'boolean') data[k] = o[k];
        if (o.speed === 'fast' || o.speed === 'slow') data.speed = o.speed;
        if (o.intro && typeof o.intro === 'object') for (const k of [2, 3, 4]) if (o.intro[k] === true) data.intro[k] = true;
      }
    } catch (e) { /* 忽略 */ }
    const save = () => { try { window.localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* 忽略 */ } };
    return { data, save };
  })();

  /* ============== 声音 ============== */
  const Sound = (() => {
    let ctx = null, master = null;
    function unlock() {
      try {
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          ctx = new AC();
          master = ctx.createGain();
          master.gain.value = 0.55;
          master.connect(ctx.destination);
        }
        if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
      } catch (e) { ctx = null; }
    }
    function tone(freq, at, dur, type, vol, slideTo) {
      const t0 = ctx.currentTime + at;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.03, dur / 3));
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g);
      g.connect(master);
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    }
    function play(name, arg) {
      if (!Store.data.sound || !ctx || INSTANT) return;
      try {
        if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
        switch (name) {
          case 'add': tone(700, 0, 0.08, 'triangle', 0.18, 900); break;
          case 'remove': tone(500, 0, 0.1, 'triangle', 0.16, 300); break;
          case 'step': tone(440 + (arg % 6) * 60, 0, 0.09, 'sine', 0.16); break;
          case 'carrot': tone(900, 0, 0.06, 'square', 0.08); tone(1200, 0.06, 0.1, 'triangle', 0.14); break;
          case 'bump': tone(160, 0, 0.22, 'sawtooth', 0.12, 90); break;
          case 'splash': tone(900, 0, 0.3, 'sine', 0.1, 200); break;
          case 'boop': tone(420, 0, 0.16, 'triangle', 0.14, 330); break;
          case 'ding': tone(1046, 0, 0.25, 'triangle', 0.16); tone(1568, 0.09, 0.35, 'triangle', 0.12); break;
          case 'win':
            [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.11, i === 3 ? 0.5 : 0.18, 'triangle', 0.2));
            tone(1319, 0.5, 0.45, 'sine', 0.1);
            break;
        }
      } catch (e) { /* 忽略 */ }
    }
    return { unlock, play };
  })();

  /* ============== 状态 ============== */
  const S = {
    screen: 'menu',
    level: null,       // 关卡数据
    info: null,        // parse 结果
    prog: { main: [], magic: [] },
    target: { row: 'main', rep: -1 },
    edits: [],         // 撤销用
    running: false,
    runToken: 0,
    actor: null,       // [r, c]
    lastResult: null,
    hintStep: 0,
    tutStep: 0,
  };

  const levelIndex = (id) => G.LEVELS.findIndex((L) => L.id === id);
  const unlocked = (i) => Store.data.unlockAll || i === 0 || (Store.data.stars[G.LEVELS[i - 1].id] || 0) > 0;
  const totalStars = () => Object.values(Store.data.stars).reduce((a, b) => a + b, 0);
  const rowMax = (row) => (row === 'main' ? S.level.max : S.level.maxMagic || 0);
  const rowList = (row) => S.prog[row];

  function mk(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  /* ============== 选关页 ============== */
  function renderMenu() {
    $('starNum').textContent = totalStars();
    $('titleAvatar').textContent = Store.data.avatar;
    $('btnSound').textContent = Store.data.sound ? '🔊 有声音' : '🔇 没声音';
    const chips = $('avatarChips');
    if (!chips.children.length) {
      AVATARS.forEach((a) => {
        const b = mk('button', 'chip emo-chip', a);
        b.dataset.avatar = a;
        b.addEventListener('click', () => { Store.data.avatar = a; Store.save(); renderMenu(); });
        chips.appendChild(b);
      });
    }
    chips.querySelectorAll('.chip').forEach((b) => b.classList.toggle('on', b.dataset.avatar === Store.data.avatar));
    const box = $('chapters');
    box.textContent = '';
    const firstOpen = G.LEVELS.findIndex((L, i) => unlocked(i) && !(Store.data.stars[L.id] > 0));
    for (let ch = 1; ch <= 4; ch++) {
      const C = G.CHAPTERS[ch];
      const levels = G.LEVELS.filter((L) => L.ch === ch);
      const sec = mk('div', 'chapter');
      const head = mk('div', 'chapter-head');
      head.appendChild(mk('span', 'ch-name', `${C.emoji} 第${ch}章 ${C.name}`));
      head.appendChild(mk('span', 'ch-desc', C.desc));
      const got = levels.reduce((a, L) => a + (Store.data.stars[L.id] || 0), 0);
      head.appendChild(mk('span', 'ch-stars', `⭐ ${got}/${levels.length * 3}`));
      sec.appendChild(head);
      const row = mk('div', 'levels');
      for (const L of levels) {
        const i = levelIndex(L.id);
        const open = unlocked(i);
        const b = mk('button', 'lvl' + (open ? '' : ' locked') + (i === firstOpen ? ' next' : ''));
        b.dataset.id = L.id;
        b.appendChild(mk('div', 'l-id', L.id));
        b.appendChild(mk('div', 'l-name', L.name));
        const st = mk('div', 'l-stars');
        if (open) {
          const n = Store.data.stars[L.id] || 0;
          for (let k = 1; k <= 3; k++) st.appendChild(mk('span', k <= n ? '' : 'off', '⭐'));
        } else {
          st.textContent = '🔒';
        }
        b.appendChild(st);
        b.addEventListener('click', () => {
          if (!unlocked(levelIndex(L.id))) { Sound.play('boop'); return; }
          openLevel(L.id);
        });
        row.appendChild(b);
      }
      sec.appendChild(row);
      box.appendChild(sec);
    }
  }

  function showScreen(name) {
    S.screen = name;
    $('menu').classList.toggle('show', name === 'menu');
    $('play').classList.toggle('show', name === 'play');
    if (name === 'menu') renderMenu();
    else layout();
  }

  /* ============== 进入关卡 ============== */
  function openLevel(id) {
    const i = levelIndex(id);
    if (i < 0) return;
    S.level = G.LEVELS[i];
    S.info = G.parse(S.level);
    S.prog = G.clone(S.level.start || { main: [], magic: [] });
    if (!S.prog.magic) S.prog.magic = [];
    S.target = { row: 'main', rep: -1 };
    S.edits = [];
    S.hintStep = 0;
    stopRun();
    hideOverlay('resultOv');
    showScreen('play');
    buildMap();
    resetActor();
    renderAll();
    setMsg(S.level.start ? '🐛 程序里有虫子！先点 ▶️ 看看哪里出错' : `帮 ${Store.data.avatar} 回到 🏠 吧${S.info.carrots.length ? '，顺路捡 🥕' : ''}！`, S.level.start ? 'blue' : '');
    const ch = S.level.ch;
    if (ch >= 2 && !Store.data.intro[ch] && G.LEVELS.find((L) => L.ch === ch).id === id) openIntro(ch);
  }

  /* ============== 地图 ============== */
  const cellEls = [];
  let actorEl = null;
  function buildMap() {
    const map = $('map');
    const P = S.info;
    map.textContent = '';
    map.style.setProperty('--rows', P.rows);
    map.style.setProperty('--cols', P.cols);
    cellEls.length = 0;
    for (let r = 0; r < P.rows; r++) {
      for (let c = 0; c < P.cols; c++) {
        const ch = P.grid[r][c];
        const el = mk('div', 'cell' + ((r + c) % 2 ? ' alt' : ''));
        if (ch === '#') el.textContent = '🌳';
        else if (ch === '~') { el.classList.add('water'); el.textContent = '🌊'; }
        else if (ch === 'H') { el.classList.add('home'); el.textContent = '🏠'; }
        if (r === P.start[0] && c === P.start[1]) el.classList.add('start');
        map.appendChild(el);
        cellEls.push(el);
      }
    }
    P.carrots.forEach(([r, c], k) => {
      const el = mk('div', 'carrot', '🥕');
      el.dataset.k = k;
      place(el, r, c);
      map.appendChild(el);
    });
    actorEl = mk('div', 'actor');
    const face = mk('div', 'face', Store.data.avatar);
    actorEl.appendChild(face);
    map.appendChild(actorEl);
  }

  function place(el, r, c) {
    el.style.setProperty('--r', r);
    el.style.setProperty('--c', c);
  }

  function resetActor() {
    S.actor = S.info.start.slice();
    actorEl.classList.remove('bump', 'happy', 'hop');
    const prev = actorEl.style.transition;
    actorEl.style.transition = 'none';
    place(actorEl, S.actor[0], S.actor[1]);
    void actorEl.offsetWidth;
    actorEl.style.transition = prev;
    document.querySelectorAll('#map .carrot').forEach((el) => el.classList.remove('eaten'));
    document.querySelectorAll('#map .boom, #map .dot').forEach((el) => el.remove());
    S.lastResult = null;
  }

  // 路线预览：按现在的积木算出会走到哪里
  function renderPreview() {
    document.querySelectorAll('#map .dot:not(.done), #map .boom.plan').forEach((el) => el.remove());
    if (!Store.data.preview || S.running || S.lastResult) return;
    const res = G.run(S.level, S.prog);
    const map = $('map');
    for (const f of res.frames) {
      if (f.event === 'move' || f.event === 'carrot') {
        const d = mk('div', 'dot');
        place(d, f.r, f.c);
        map.appendChild(d);
      } else if (!f.home) {
        const b = mk('div', 'boom plan', '❌');
        b.style.opacity = '0.55';
        place(b, f.tr < 0 || f.tr >= S.info.rows || f.tc < 0 || f.tc >= S.info.cols ? f.r : f.tr, f.tr < 0 || f.tr >= S.info.rows || f.tc < 0 || f.tc >= S.info.cols ? f.c : f.tc);
        map.appendChild(b);
      }
    }
  }

  /* ============== 布局 ============== */
  function layout() {
    if (S.screen !== 'play' || !S.info) return;
    const el = $('play');
    const cs = getComputedStyle(el);
    const W = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const H = el.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const land = W > H * 1.1 && W >= 760;
    el.classList.toggle('land', land);
    el.classList.toggle('port', !land);
    let aw, ah;
    if (land) {
      const panel = Math.round(Math.max(440, Math.min(520, W * 0.42)));
      el.style.setProperty('--panel', panel + 'px');
      aw = W - panel - 30;
      ah = H - 20;
    } else {
      aw = Math.min(W, 760);
      ah = H - $('panel').offsetHeight - 40;
    }
    const P = S.info;
    const size = Math.floor(Math.max(34, Math.min(118, (aw - 20) / (P.cols + 0.16), (ah - 20) / (P.rows + 0.16))));
    $('map').style.setProperty('--cs', size + 'px');
  }

  /* ============== 程序编辑 ============== */
  function snapshot() {
    S.edits.push(JSON.stringify({ prog: S.prog, target: S.target }));
    if (S.edits.length > 60) S.edits.shift();
  }

  function editChanged() {
    if (S.running) stopRun();
    if (S.lastResult) resetActor();
    S.hintAnswer = false;
    renderAll();
  }

  function addBlock(type) {
    if (!S.level || S.running) return 'busy';
    if (!S.level.blocks.includes(type)) return 'not-allowed';
    let { row, rep } = S.target;
    if (row === 'magic' && !S.level.maxMagic) row = 'main';
    if (type === 'M' && row === 'magic') {
      setMsg('⭐ 魔法积木里面不能再放 ⭐', 'red');
      Sound.play('boop');
      return 'magic-in-magic';
    }
    if (type === 'rep' && rep >= 0) {
      setMsg('🔁 里面不能再放 🔁，先点外面', 'red');
      Sound.play('boop');
      return 'rep-in-rep';
    }
    if (G.count(rowList(row)) + 1 > rowMax(row)) {
      setMsg(`积木放满啦！${row === 'main' ? '程序' : '魔法积木'}最多 ${rowMax(row)} 块`, 'red');
      Sound.play('boop');
      shake(row === 'main' ? 'progMain' : 'progMagic');
      return 'full';
    }
    snapshot();
    const list = rep >= 0 ? rowList(row)[rep].body : rowList(row);
    if (type === 'rep') {
      rowList(row).push({ t: 'rep', n: 2, body: [] });
      S.target = { row, rep: rowList(row).length - 1 };
      setMsg('把积木放进 🔁 里，点数字改次数', 'gold');
    } else {
      list.push(type);
      setMsg(msgIdle(), '');
    }
    Sound.play('add');
    editChanged();
    return 'added';
  }

  // key：'main.2' 或 'main.1.0'
  function removeBlock(key) {
    if (S.running) return 'busy';
    const parts = key.split('.');
    const row = parts[0];
    const i = Number(parts[1]);
    const list = rowList(row);
    if (!list || !list[i]) return 'none';
    snapshot();
    if (parts.length === 3) {
      list[i].body.splice(Number(parts[2]), 1);
      S.target = { row, rep: i };
    } else {
      list.splice(i, 1);
      if (S.target.row === row && S.target.rep >= 0) {
        if (S.target.rep === i) S.target = { row, rep: -1 };
        else if (S.target.rep > i) S.target.rep--;
      }
    }
    Sound.play('remove');
    setMsg(msgIdle(), '');
    editChanged();
    return 'removed';
  }

  function cycleRep(key) {
    if (S.running) return;
    const [row, i] = key.split('.');
    const b = rowList(row)[Number(i)];
    if (!b || b.t !== 'rep') return;
    snapshot();
    if (S.target.row === row && S.target.rep === Number(i)) b.n = b.n >= G.MAX_REP ? G.MIN_REP : b.n + 1;
    S.target = { row, rep: Number(i) };
    Sound.play('add');
    editChanged();
  }

  function setTarget(row, rep) {
    if (S.running) return;
    if (row === 'magic' && !S.level.maxMagic) return;
    S.target = { row, rep: rep === undefined ? -1 : rep };
    renderProgram();
  }

  function undoEdit() {
    if (S.running || !S.edits.length) return;
    const o = JSON.parse(S.edits.pop());
    S.prog = o.prog;
    S.target = o.target;
    Sound.play('remove');
    editChanged();
  }

  function clearProgram() {
    if (S.running) return;
    if (!G.totalBlocks(S.prog)) return;
    snapshot();
    S.prog = { main: [], magic: [] };
    S.target = { row: 'main', rep: -1 };
    Sound.play('remove');
    setMsg(msgIdle(), '');
    editChanged();
  }

  const msgIdle = () => '排好积木，点 ▶️ 开始';

  function shake(id) {
    const el = $(id);
    el.classList.remove('shake');
    void el.offsetWidth;
    el.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'translateX(0)' }], { duration: 300 });
  }

  /* ============== 画程序 ============== */
  function blockEl(b, key, readonly) {
    if (typeof b === 'string') {
      const el = mk(readonly ? 'div' : 'button', 'blk ' + b, b === 'M' ? '⭐' : ARROW[b]);
      el.dataset.key = key;
      if (!readonly) el.addEventListener('click', (e) => { e.stopPropagation(); removeBlock(key); });
      return el;
    }
    const wrap = mk('div', 'rep');
    wrap.dataset.key = key;
    const head = mk(readonly ? 'div' : 'button', 'rep-head');
    head.appendChild(mk('span', '', `🔁×${b.n}`));
    head.appendChild(mk('small', '', readonly ? '重复' : '点我改'));
    if (!readonly) head.addEventListener('click', (e) => { e.stopPropagation(); cycleRep(key); });
    wrap.appendChild(head);
    const body = mk('div', 'rep-body');
    b.body.forEach((x, j) => body.appendChild(blockEl(x, key + '.' + j, readonly)));
    if (!readonly) {
      const [row, i] = key.split('.');
      const on = S.target.row === row && S.target.rep === Number(i);
      wrap.classList.toggle('target', on);
      const add = mk('button', 'add' + (on ? ' on' : ''), '+');
      add.addEventListener('click', (e) => { e.stopPropagation(); setTarget(row, Number(i)); });
      body.appendChild(add);
      const del = mk('button', 'rep-del', '✕');
      del.addEventListener('click', (e) => { e.stopPropagation(); removeBlock(key); });
      wrap.appendChild(del);
    }
    wrap.appendChild(body);
    return wrap;
  }

  function renderProgram() {
    for (const row of ['main', 'magic']) {
      const box = $(row === 'main' ? 'progMain' : 'progMagic');
      const slots = $(row === 'main' ? 'slotsMain' : 'slotsMagic');
      if (row === 'magic') box.hidden = !S.level.maxMagic;
      if (box.hidden) continue;
      slots.textContent = '';
      rowList(row).forEach((b, i) => slots.appendChild(blockEl(b, `${row}.${i}`, false)));
      const on = S.target.row === row && S.target.rep < 0;
      const add = mk('button', 'add' + (on ? ' on' : ''), '+');
      add.addEventListener('click', (e) => { e.stopPropagation(); setTarget(row, -1); });
      slots.appendChild(add);
      box.classList.toggle('target', S.target.row === row);
      const n = G.count(rowList(row));
      const cnt = $(row === 'main' ? 'cntMain' : 'cntMagic');
      cnt.textContent = `${n}/${rowMax(row)}`;
      cnt.classList.toggle('full', n >= rowMax(row));
    }
  }

  function renderPalette() {
    const pal = $('palette');
    pal.textContent = '';
    for (const t of S.level.blocks) {
      let b;
      if (t === 'rep') {
        b = mk('button', 'blk rep-btn');
        b.appendChild(mk('span', '', '🔁'));
        b.appendChild(mk('small', '', '重复'));
      } else if (t === 'M') {
        b = mk('button', 'blk M');
        b.appendChild(mk('span', '', '⭐'));
        b.appendChild(mk('small', '', '魔法'));
      } else {
        b = mk('button', 'blk ' + t, ARROW[t]);
      }
      b.dataset.type = t;
      b.addEventListener('click', () => addBlock(t));
      pal.appendChild(b);
    }
  }

  function renderHeader() {
    const L = S.level;
    const C = G.CHAPTERS[L.ch];
    $('lvTitle').textContent = `${C.emoji} ${L.id} ${L.name}`;
    const goal = $('lvGoal');
    goal.textContent = '';
    goal.appendChild(mk('span', '', '🏠 回家'));
    if (S.info.carrots.length) goal.appendChild(mk('span', '', `🥕 ×${S.info.carrots.length}`));
    goal.appendChild(mk('span', '', `🧩 最少 ${G.par(L)} 块`));
    const best = Store.data.stars[L.id] || 0;
    if (best) goal.appendChild(mk('span', '', '⭐'.repeat(best)));
  }

  function renderControls() {
    $('btnGo').textContent = S.running ? '⏹ 停下' : S.lastResult ? '▶️ 再来' : '▶️ 开始';
    $('btnGo').classList.toggle('green', !S.running);
    $('btnGo').classList.toggle('pink', S.running);
    $('btnUndoEdit').disabled = S.running || !S.edits.length;
    $('btnClear').disabled = S.running || !G.totalBlocks(S.prog);
    $('btnHint').disabled = S.running;
    $('btnSpeed').textContent = Store.data.speed === 'fast' ? '🐇 快快走' : '🐢 慢慢走';
    document.querySelectorAll('#palette .blk').forEach((b) => { b.disabled = S.running; });
  }

  function renderAll() {
    renderHeader();
    renderProgram();
    renderPalette();
    renderControls();
    renderAnswer();
    renderPreview();
  }

  function setMsg(text, kind) {
    const el = $('msg');
    el.className = 'msg';
    void el.offsetWidth;
    if (kind) el.classList.add(kind);
    el.textContent = text;
    el.dataset.kind = kind || 'none';
  }

  /* ============== 提示 ============== */
  function hint() {
    if (!S.level || S.running) return;
    S.hintStep++;
    Sound.play('ding');
    if (S.hintStep === 1) {
      setMsg('💡 ' + S.level.hint, 'gold');
    } else {
      S.hintAnswer = true;
      setMsg('💡 下面是一种排法，照着摆一摆吧', 'gold');
      renderAnswer();
    }
  }

  function renderAnswer() {
    const box = $('answer');
    box.hidden = !S.hintAnswer;
    if (!S.hintAnswer) return;
    const body = $('answerBody');
    body.textContent = '';
    for (const row of ['main', 'magic']) {
      const list = S.level.sol[row];
      if (!list || !list.length) continue;
      const line = mk('div', 'slots');
      line.appendChild(mk('span', '', row === 'main' ? '📜' : '⭐='));
      list.forEach((b, i) => line.appendChild(blockEl(b, `ans.${i}`, true)));
      body.appendChild(line);
    }
  }

  /* ============== 运行 ============== */
  const stepMs = () => (Store.data.speed === 'fast' ? 260 : 480);

  function stopRun() {
    S.runToken++;
    S.running = false;
    document.querySelectorAll('.blk.run, .rep.run').forEach((el) => el.classList.remove('run'));
  }

  function clearMarks() {
    document.querySelectorAll('.blk.run, .rep.run, .blk.err').forEach((el) => el.classList.remove('run', 'err'));
  }

  function highlight(keys, cls) {
    document.querySelectorAll('.blk.run, .rep.run').forEach((el) => el.classList.remove('run'));
    for (const k of keys) {
      const el = document.querySelector(`#panel [data-key="${k}"]`);
      if (el) el.classList.add(cls || 'run');
    }
  }

  function go() {
    if (!S.level) return;
    if (S.running) {
      stopRun();
      setMsg('停下来啦，改一改再试', '');
      renderControls();
      return;
    }
    if (!G.totalBlocks(S.prog)) {
      setMsg('先放几块积木吧 👇', 'red');
      Sound.play('boop');
      return;
    }
    resetActor();
    clearMarks();
    const res = G.run(S.level, S.prog);
    S.running = true;
    const token = ++S.runToken;
    setMsg(`${Store.data.avatar} 出发啦！`, 'blue');
    renderControls();
    renderPreview();
    const ms = stepMs();
    actorEl.style.setProperty('--step', ms + 'ms');
    const map = $('map');
    let i = 0;
    const tick = () => {
      if (token !== S.runToken) return;
      if (i >= res.frames.length) { finish(res); return; }
      const f = res.frames[i];
      highlight(f.keys);
      if (f.event === 'move' || f.event === 'carrot') {
        const trail = mk('div', 'dot done');
        place(trail, S.actor[0], S.actor[1]);
        map.appendChild(trail);
        S.actor = [f.r, f.c];
        place(actorEl, f.r, f.c);
        actorEl.classList.remove('hop');
        void actorEl.offsetWidth;
        actorEl.classList.add('hop');
        Sound.play('step', i);
        if (f.event === 'carrot') {
          const c = map.querySelector(`.carrot[data-k="${f.carrot}"]`);
          if (c) setTimeout(() => { c.classList.add('eaten'); Sound.play('carrot'); }, INSTANT ? 0 : ms * 0.6);
        }
      } else {
        // 撞到了：往那个方向顶一下再退回来
        const [dr, dc] = G.DIRS[f.d];
        actorEl.style.setProperty('--bx', `calc(var(--cs) * ${dc})`);
        actorEl.style.setProperty('--by', `calc(var(--cs) * ${dr})`);
        actorEl.classList.remove('bump');
        void actorEl.offsetWidth;
        actorEl.classList.add('bump');
        Sound.play(f.event === 'water' ? 'splash' : 'bump');
        const inside = f.tr >= 0 && f.tr < S.info.rows && f.tc >= 0 && f.tc < S.info.cols;
        const boom = mk('div', 'boom', f.event === 'water' ? '💦' : '💥');
        place(boom, inside ? f.tr : f.r, inside ? f.tc : f.c);
        map.appendChild(boom);
      }
      i++;
      if (INSTANT) tick();
      else setTimeout(tick, ms);
    };
    if (INSTANT) tick();
    else setTimeout(tick, 120);
  }

  function finish(res) {
    S.running = false;
    S.lastResult = res;
    const last = res.frames[res.frames.length - 1];
    if (res.result === 'home') {
      highlight([]);
      actorEl.classList.add('happy');
      const stars = G.stars(S.level, S.prog, res);
      const prev = Store.data.stars[S.level.id] || 0;
      if (stars > prev) Store.data.stars[S.level.id] = stars;
      Store.save();
      setMsg('🎉 回到家啦！', 'gold');
      Sound.play('win');
      renderControls();
      renderHeader();
      const token = S.runToken;
      if (INSTANT) showResult(res, stars);
      else setTimeout(() => { if (token === S.runToken && S.lastResult === res) showResult(res, stars); }, 900);
      return;
    }
    if (last) highlight(last.keys, res.result === 'short' ? 'run' : 'err');
    const msgs = {
      tree: '🌳 撞到大树啦！红色的那块积木要改一改',
      water: '💦 小动物不会游泳！红色的那块积木要改一改',
      out: '🚧 走出地图啦！红色的那块积木要改一改',
      short: '🤔 程序走完了，小动物还没到家，看看它停在哪里',
    };
    setMsg(msgs[res.result] || '再试一次吧', 'red');
    if (res.result === 'short') Sound.play('boop');
    renderControls();
  }

  /* ============== 过关弹层 ============== */
  function showResult(res, stars) {
    const L = S.level;
    $('rEmo').textContent = Store.data.avatar;
    const st = $('rStars');
    st.textContent = '';
    for (let k = 1; k <= 3; k++) {
      const s = mk('span', k <= stars ? '' : 'off', '⭐');
      s.style.animationDelay = (k * 0.18) + 's';
      st.appendChild(s);
    }
    const used = G.totalBlocks(S.prog);
    const lines = $('rLines');
    lines.textContent = '';
    if (res.total) lines.appendChild(mk('div', '', `🥕 捡到 ${res.carrots}/${res.total} 根胡萝卜`));
    lines.appendChild(mk('div', '', `🧩 用了 ${used} 块积木（最少 ${G.par(L)} 块）`));
    let tip = '';
    if (res.carrots < res.total) tip = '💡 下次把胡萝卜也捡了吧';
    else if (used > G.par(L)) tip = L.ch >= 3 ? '💡 用 🔁 或 ⭐ 能少用积木哦' : '💡 能不能少用几块积木？';
    else tip = '🌟 太棒了，一颗星都没少！';
    $('rTip').textContent = tip;
    const i = levelIndex(L.id);
    $('rNext').hidden = i >= G.LEVELS.length - 1;
    showOverlay('resultOv');
    if (!INSTANT) confetti();
  }

  function confetti() {
    const box = $('confetti');
    box.textContent = '';
    const colors = ['#ff8fb8', '#6bbfff', '#ffd24a', '#7ed9a6', '#c9a7ff', '#ffa45c'];
    const W = window.innerWidth;
    for (let i = 0; i < 60; i++) {
      const p = mk('i');
      if (i % 6 === 0) {
        p.textContent = ['⭐', '🥕', '💖'][i % 3];
        p.style.fontSize = 18 + Math.random() * 14 + 'px';
        p.style.fontFamily = EMOJI_FONT;
      } else {
        p.style.width = 8 + Math.random() * 8 + 'px';
        p.style.height = 10 + Math.random() * 10 + 'px';
        p.style.background = colors[i % colors.length];
      }
      p.style.left = Math.random() * W + 'px';
      p.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
      p.style.setProperty('--rot', (Math.random() * 900 - 450) + 'deg');
      p.style.animationDuration = 2.2 + Math.random() * 1.8 + 's';
      p.style.animationDelay = Math.random() * 0.5 + 's';
      box.appendChild(p);
    }
    setTimeout(() => { box.textContent = ''; }, 4500);
  }

  /* ============== 弹层 ============== */
  function showOverlay(id) { $(id).classList.add('show'); }
  function hideOverlay(id) { $(id).classList.remove('show'); }

  function demoBlocks(list) {
    const line = mk('div', 'demo-line');
    list.forEach((b) => {
      if (typeof b === 'string' && b.length > 1) line.appendChild(mk('span', '', b));
      else line.appendChild(blockEl(b, 'demo', true));
    });
    return line;
  }

  let tutBuilt = false;
  function openTutorial() {
    if (!tutBuilt) {
      tutBuilt = true;
      $('tutArt0').appendChild(demoBlocks(['R', 'R', 'U', ' ➜ ', '📜']));
      const map = mk('div', 'demo-map');
      const cells = ['', '', '', '🏠', '', '🌳', '', '·', Store.data.avatar, '·', '🥕', '·', '', '', '', ''];
      cells.forEach((t, k) => { const d = mk('div', t === '·' ? 'p' : ''); d.textContent = t === '·' ? '' : t; map.appendChild(d); });
      $('tutArt1').appendChild(map);
      $('tutArt2').appendChild(demoBlocks(['💥', ' ➜ ', '🔧', ' ➜ ', '🏠']));
    }
    S.tutStep = 0;
    renderTutorial();
    showOverlay('tutOv');
  }

  function renderTutorial() {
    document.querySelectorAll('#tutOv .tut-step').forEach((s) => s.classList.toggle('show', Number(s.dataset.step) === S.tutStep));
    document.querySelectorAll('#tutDots i').forEach((d, i) => d.classList.toggle('on', i === S.tutStep));
    $('tutNext').textContent = S.tutStep < 2 ? '👉 下一步' : '🎮 开始玩！';
  }

  const INTROS = {
    2: { title: '🐛 找虫子', text: '程序里藏着“虫子”（错的积木）', small: '先点 ▶️ 看看小动物在哪里出错，再把那块积木改好', art: () => demoBlocks(['R', 'R', 'U', ' ➜ ', '💥', ' ➜ ', 'R', 'R', 'R']) },
    3: { title: '🔁 重复积木', text: '放进 🔁 的积木会重复好几次', small: '点 🔁 上的数字可以改次数', art: () => { const w = mk('div'); w.appendChild(demoBlocks([{ t: 'rep', n: 3, body: ['R'] }, ' = ', 'R', 'R', 'R'])); return w; } },
    4: { title: '⭐ 魔法积木', text: '在 ⭐ 那一行排好动作', small: '程序里每放一个 ⭐，小动物就做一遍这些动作', art: () => { const w = mk('div'); w.appendChild(demoBlocks(['⭐ = ', 'R', 'R', 'U'])); w.appendChild(demoBlocks(['M', 'M', ' = ', 'R', 'R', 'U', 'R', 'R', 'U'])); return w; } },
  };

  function openIntro(ch) {
    const it = INTROS[ch];
    $('introTitle').textContent = it.title;
    $('introText').textContent = it.text;
    $('introSmall').textContent = it.small;
    const art = $('introArt');
    art.textContent = '';
    art.appendChild(it.art());
    $('introGo').dataset.ch = ch;
    showOverlay('introOv');
  }

  /* ============== 设置 ============== */
  function renderSettings() {
    document.querySelectorAll('#setOv .seg').forEach((seg) => {
      const v = !!Store.data[seg.dataset.opt];
      seg.querySelectorAll('button').forEach((b) => {
        const isOn = b.dataset.v === '1';
        b.classList.toggle('on', isOn === v);
        b.classList.toggle('off-choice', !isOn);
      });
    });
    $('btnUnlock').textContent = Store.data.unlockAll ? '🔒 恢复按顺序解锁' : '🔓 解锁全部关卡';
  }

  function setOption(name, value) {
    Store.data[name] = !!value;
    if (name === 'sound' && value) Sound.unlock();
    Store.save();
    renderSettings();
    if (S.screen === 'play') renderPreview();
    else renderMenu();
  }

  /* ============== 绑定 ============== */
  function bind() {
    const on = (id, fn) => $(id).addEventListener('click', fn);
    on('btnHelp', openTutorial);
    on('btnSettings', () => { renderSettings(); $('clearStep1').hidden = false; $('clearStep2').hidden = true; showOverlay('setOv'); });
    on('btnSound', () => setOption('sound', !Store.data.sound));
    on('btnLevels', () => { stopRun(); showScreen('menu'); });
    on('btnGo', go);
    on('btnUndoEdit', undoEdit);
    on('btnClear', clearProgram);
    on('btnHint', hint);
    on('btnSpeed', () => {
      Store.data.speed = Store.data.speed === 'fast' ? 'slow' : 'fast';
      Store.save();
      renderControls();
    });
    $('progMain').addEventListener('click', () => setTarget('main', -1));
    $('progMagic').addEventListener('click', () => setTarget('magic', -1));
    on('tutNext', () => {
      if (S.tutStep < 2) { S.tutStep++; renderTutorial(); }
      else { hideOverlay('tutOv'); Store.data.tutorialSeen = true; Store.save(); }
    });
    on('introGo', () => {
      Store.data.intro[$('introGo').dataset.ch] = true;
      Store.save();
      hideOverlay('introOv');
    });
    on('rNext', () => {
      const i = levelIndex(S.level.id);
      hideOverlay('resultOv');
      if (i < G.LEVELS.length - 1) openLevel(G.LEVELS[i + 1].id);
    });
    on('rAgain', () => { hideOverlay('resultOv'); openLevel(S.level.id); });
    on('rLevels', () => { hideOverlay('resultOv'); stopRun(); showScreen('menu'); });
    document.querySelectorAll('#setOv .seg button').forEach((b) => {
      b.addEventListener('click', () => setOption(b.parentElement.dataset.opt, b.dataset.v === '1'));
    });
    on('btnUnlock', () => { Store.data.unlockAll = !Store.data.unlockAll; Store.save(); renderSettings(); renderMenu(); });
    on('btnClearStars', () => { $('clearStep1').hidden = true; $('clearStep2').hidden = false; });
    on('btnClearNo', () => { $('clearStep1').hidden = false; $('clearStep2').hidden = true; });
    on('btnClearYes', () => {
      Store.data.stars = {};
      Store.data.intro = {};
      Store.save();
      $('clearStep1').hidden = false;
      $('clearStep2').hidden = true;
      renderMenu();
    });
    on('setClose', () => hideOverlay('setOv'));

    ['pointerdown', 'touchend', 'click', 'keydown'].forEach((ev) => document.addEventListener(ev, Sound.unlock, { capture: true, passive: true }));
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('dblclick', (e) => e.preventDefault());
    let pend = 0;
    const relayout = () => { cancelAnimationFrame(pend); pend = requestAnimationFrame(layout); };
    window.addEventListener('resize', relayout);
    window.addEventListener('orientationchange', () => { relayout(); setTimeout(relayout, 300); });
    if (window.ResizeObserver) new ResizeObserver(relayout).observe($('app'));
  }

  function getState() {
    return {
      screen: S.screen,
      level: S.level ? S.level.id : null,
      prog: G.clone(S.prog),
      target: Object.assign({}, S.target),
      running: S.running,
      actor: S.actor ? S.actor.slice() : null,
      result: S.lastResult ? S.lastResult.result : null,
      msg: $('msg').textContent,
      msgKind: $('msg').dataset.kind,
      stars: Object.assign({}, Store.data.stars),
      overlay: ['tutOv', 'introOv', 'resultOv', 'setOv'].filter((id) => $(id).classList.contains('show')),
      errKeys: [...document.querySelectorAll('.blk.err')].map((e) => e.dataset.key),
      previewDots: document.querySelectorAll('#map .dot:not(.done)').length,
      layout: $('play').classList.contains('land') ? 'landscape' : 'portrait',
    };
  }

  function init() {
    if (INSTANT) document.documentElement.classList.add('test-mode');
    bind();
    renderSettings();
    showScreen('menu');
    if (!TEST && !Store.data.tutorialSeen) openTutorial();
    if (!TEST && 'serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) {
      navigator.serviceWorker.register('sw.js').catch(() => { /* 忽略 */ });
    }
    if (TEST) {
      window.__code = {
        G,
        getState,
        openLevel: (id) => { openLevel(id); hideOverlay('introOv'); return getState(); },
        add: (t) => addBlock(t),
        remove: (k) => removeBlock(k),
        cycleRep: (k) => cycleRep(k),
        setTarget: (row, rep) => { setTarget(row, rep); return getState(); },
        undo: () => { undoEdit(); return getState(); },
        clear: () => { clearProgram(); return getState(); },
        hint: () => { hint(); return getState(); },
        go: () => { go(); return getState(); },
        setOption: (k, v) => { setOption(k, v); return getState(); },
        unlockAll: (v) => { Store.data.unlockAll = !!v; Store.save(); renderMenu(); },
      };
    }
  }

  init();
})();
</script>
</body>
</html>
