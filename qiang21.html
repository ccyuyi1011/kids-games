<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="抢 21">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#fff0e6">
<link rel="manifest" href="qiang21.webmanifest">
<link rel="apple-touch-icon" href="icons/qiang21-180.png">
<link rel="icon" type="image/png" href="icons/qiang21-192.png">
<title>抢 21</title>
<style>
  /* ============== 基础与配色 ============== */
  :root {
    --ink: #5b4331;
    --ink-soft: #9a7f69;
    --pink: #ff8fb8;
    --pink-bg: #ffd6e5;
    --blue: #6bbfff;
    --blue-bg: #d4ecff;
    --gold: #ffc93c;
    --red: #ff4658;
    --sheet: #fffdf8;
    --font: ui-rounded, "SF Pro Rounded", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: var(--font);
    color: var(--ink);
    background: linear-gradient(160deg, #e9f8dd 0%, #fff5e1 50%, #e2f2ff 100%);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    overscroll-behavior: none;
    touch-action: manipulation;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 8% 12%, rgba(190, 240, 170, 0.55) 0, rgba(190, 240, 170, 0) 28%),
      radial-gradient(circle at 92% 18%, rgba(255, 230, 150, 0.5) 0, rgba(255, 230, 150, 0) 26%),
      radial-gradient(circle at 85% 90%, rgba(170, 215, 255, 0.55) 0, rgba(170, 215, 255, 0) 30%),
      radial-gradient(circle at 12% 88%, rgba(255, 200, 220, 0.45) 0, rgba(255, 200, 220, 0) 26%);
  }

  button {
    font-family: inherit;
    color: inherit;
    border: none;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  .emo { font-family: var(--emoji); }

  #app { position: fixed; inset: 0; }

  .screen { position: absolute; inset: 0; display: none; }
  .screen.show { display: flex; }

  /* ============== 通用按钮 ============== */
  .btn {
    --shade: #e9d2b3;
    min-height: 56px;
    padding: 0 20px;
    font-size: 20px;
    font-weight: 800;
    color: var(--ink);
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 5px 0 var(--shade), 0 9px 18px rgba(150, 100, 60, 0.12);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
    transition: transform 0.08s, box-shadow 0.08s, opacity 0.2s, filter 0.15s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--shade), 0 3px 8px rgba(150, 100, 60, 0.12); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn:disabled:active { transform: none; box-shadow: 0 5px 0 var(--shade); }
  .btn.pink   { background: linear-gradient(#ffb3cf, #ff8fb8); color: #fff; --shade: #e36a97; text-shadow: 0 1px 1px rgba(170, 50, 90, 0.35); }
  .btn.blue   { background: linear-gradient(#bfe3ff, #8ccfff); color: #2d5a80; --shade: #5fa9e0; }
  .btn.green  { background: linear-gradient(#c9f2d6, #9fe3b6); color: #2f6b45; --shade: #6fc18d; }
  .btn.yellow { background: linear-gradient(#fff0a8, #ffd966); color: #7a5300; --shade: #e7b63c; }
  .btn.purple { background: linear-gradient(#e6d6ff, #c9b0ff); color: #4f3a85; --shade: #a58ae0; }
  .btn.big { min-height: 64px; font-size: 24px; border-radius: 24px; padding: 0 28px; }

  /* ============== 菜单页 ============== */
  #menu {
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding:
      calc(14px + env(safe-area-inset-top))
      calc(20px + env(safe-area-inset-right))
      calc(20px + env(safe-area-inset-bottom))
      calc(20px + env(safe-area-inset-left));
  }
  .menu-inner {
    width: 100%;
    max-width: 1120px;
    margin: auto 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .menu-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .title {
    font-size: clamp(32px, 5.2vw, 50px);
    font-weight: 900;
    letter-spacing: 3px;
    color: #5d4a2f;
    text-shadow: 0 3px 0 #fff, 0 6px 14px rgba(120, 200, 110, 0.35);
    white-space: nowrap;
  }
  .title .emo { display: inline-block; animation: roar 2.4s ease-in-out infinite; }
  .star-total {
    flex-shrink: 0;
    background: #fff;
    border-radius: 999px;
    padding: 8px 20px;
    font-size: 26px;
    font-weight: 900;
    color: #b07a00;
    box-shadow: 0 5px 0 #f1d58c, 0 8px 16px rgba(180, 130, 40, 0.15);
    white-space: nowrap;
  }
  .star-total.bump { animation: bump 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .subtitle { text-align: center; font-size: clamp(22px, 3vw, 28px); font-weight: 900; color: #6d5a3d; }

  
  .card {
    --bg: #fff;
    --shade: #e9d2b3;
    position: relative;
    background: var(--bg);
    border-radius: 28px;
    padding: 14px 8px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    border: 3px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 6px 0 var(--shade), 0 12px 22px rgba(150, 100, 60, 0.13);
    transition: transform 0.12s, box-shadow 0.08s;
    min-width: 0;
  }
  .card:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--shade), 0 4px 10px rgba(150, 100, 60, 0.12); }
  .card .c-emo { font-family: var(--emoji); font-size: clamp(50px, 6.4vw, 70px); line-height: 1.15; animation: sway 3s ease-in-out infinite; }
  .card:nth-child(2) .c-emo { animation-delay: -0.6s; }
  .card:nth-child(3) .c-emo { animation-delay: -1.2s; }
  .card:nth-child(4) .c-emo { animation-delay: -1.8s; }
  .card:nth-child(5) .c-emo { animation-delay: -2.4s; }
  .card .c-name { font-size: 24px; font-weight: 900; }
  .card .c-tag { font-size: 18px; font-weight: 700; color: #8f725c; white-space: nowrap; }
  .card .c-paws { font-family: var(--emoji); font-size: 15px; letter-spacing: -1px; white-space: nowrap; }
  .card .c-paws .off { opacity: 0.2; filter: grayscale(1); }
  .card .c-wins {
    margin-top: 2px;
    font-size: 18px;
    font-weight: 900;
    color: #a26f00;
    background: rgba(255, 255, 255, 0.85);
    border-radius: 999px;
    padding: 2px 12px;
    white-space: nowrap;
  }
  .card.family .c-tag { white-space: normal; text-align: center; }

  .opt-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 22px; }
  .opt-group {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 10px;
    background: rgba(255, 255, 255, 0.72);
    border-radius: 26px;
    padding: 10px 16px;
    box-shadow: 0 4px 14px rgba(150, 100, 60, 0.08);
  }
  .opt-label { font-size: 20px; font-weight: 900; margin-right: 4px; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .chip {
    min-height: 56px;
    min-width: 56px;
    padding: 0 14px;
    border-radius: 18px;
    background: #fff;
    border: 3px solid #f1e4d3;
    font-size: 20px;
    font-weight: 800;
    color: var(--ink);
    white-space: nowrap;
    transition: transform 0.15s, border-color 0.15s, background 0.15s;
  }
  .chip.emo-chip { font-family: var(--emoji); font-size: 34px; width: 62px; height: 62px; padding: 0; line-height: 1; }
  .chip.on {
    border-color: var(--pink);
    background: #fff0f6;
    box-shadow: 0 0 0 4px rgba(255, 143, 184, 0.28);
    transform: scale(1.07);
  }
  .menu-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; padding-bottom: 6px; }

  @keyframes sway {
    0%, 100% { transform: rotate(-4deg); }
    50% { transform: rotate(4deg) translateY(-2px); }
  }
  @keyframes roar {
    0%, 70%, 100% { transform: scale(1) rotate(0); }
    78% { transform: scale(1.18) rotate(-8deg); }
    86% { transform: scale(1.12) rotate(6deg); }
  }
  @keyframes bump {
    0% { transform: scale(1); }
    40% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }

  /* ============== 弹层通用 ============== */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    padding:
      calc(16px + env(safe-area-inset-top))
      calc(16px + env(safe-area-inset-right))
      calc(16px + env(safe-area-inset-bottom))
      calc(16px + env(safe-area-inset-left));
    background: rgba(90, 80, 50, 0.38);
  }
  .overlay.show { display: flex; animation: fadeIn 0.2s ease-out; }
  .sheet {
    position: relative;
    width: min(640px, 100%);
    max-height: 100%;
    overflow-y: auto;
    background: var(--sheet);
    border-radius: 34px;
    padding: 26px 24px 24px;
    text-align: center;
    border: 4px solid #fff;
    box-shadow: 0 18px 44px rgba(90, 60, 40, 0.3);
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn { from { transform: scale(0.75); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .sheet h2 { font-size: 30px; font-weight: 900; margin-bottom: 14px; }
  .sheet-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 18px; }

  /* ============== 教程 ============== */
  .tut-step { display: none; }
  .tut-step.show { display: block; animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .tut-art {
    min-height: 280px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .tut-text { font-size: 28px; font-weight: 900; line-height: 1.3; }
  .tut-small { font-size: 21px; font-weight: 800; color: #8a6f52; margin-top: 4px; }
  .tut-dots { display: flex; justify-content: center; gap: 10px; margin-top: 16px; }
  .tut-dots i { width: 14px; height: 14px; border-radius: 50%; background: #e3e8cf; transition: all 0.25s; }
  .tut-dots i.on { width: 34px; border-radius: 8px; background: #8fd07a; }

  /* ============== 结果卡片 ============== */
  .result .r-emo { font-family: var(--emoji); font-size: 84px; line-height: 1.1; animation: hop 1.2s ease-in-out infinite; }
  .result .r-title { font-size: 44px; font-weight: 900; margin-top: 4px; }
  .result.win .r-title { color: #ff5f99; text-shadow: 0 3px 0 #ffe0ec; }
  .result .r-sub { font-size: 24px; font-weight: 800; color: #8a6a55; margin-top: 6px; }
  .result .r-eat { font-size: 22px; font-weight: 900; color: #3f8a55; margin-top: 8px; }
  .result .r-star {
    display: inline-block;
    margin-top: 12px;
    font-size: 40px;
    font-weight: 900;
    color: #d99800;
    text-shadow: 0 3px 0 #fff3c4;
    animation: starUp 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .result .r-tip {
    margin: 16px auto 0;
    max-width: 460px;
    padding: 12px 16px;
    border-radius: 20px;
    background: #fff1f1;
    border: 3px dashed #ff9aa5;
    color: #d8404f;
    font-size: 22px;
    font-weight: 900;
  }
  .result .r-suggest { margin-top: 18px; width: 100%; max-width: 440px; }
  .result .r-suggest.btn { animation: nudge 1.4s ease-in-out infinite; }
  @keyframes starUp {
    0% { transform: translateY(30px) scale(0.3); opacity: 0; }
    60% { transform: translateY(-8px) scale(1.25); opacity: 1; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  @keyframes nudge {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
  #confetti i {
    position: absolute;
    top: -40px;
    display: block;
    border-radius: 3px;
    font-style: normal;
    animation: fall linear forwards;
  }
  @keyframes fall {
    0% { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 1; }
    100% { transform: translate3d(var(--dx), 110vh, 0) rotate(var(--rot)); opacity: 0.9; }
  }

  /* ============== 设置 ============== */
  .set-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding: 14px 16px;
    margin-top: 12px;
    border-radius: 22px;
    background: #fff;
    border: 3px solid #f6e8d6;
    text-align: left;
  }
  .set-name { font-size: 22px; font-weight: 900; }
  .set-name small { display: block; font-size: 17px; font-weight: 800; color: #d8404f; }
  .seg { display: flex; gap: 8px; }
  .seg button {
    min-height: 56px;
    min-width: 92px;
    padding: 0 14px;
    border-radius: 18px;
    font-size: 20px;
    font-weight: 900;
    background: #f5efe7;
    color: #a48b77;
    border: 3px solid transparent;
  }
  .seg button.on { background: #e5f8ea; color: #2f7a4b; border-color: #7fd49b; }
  .seg button.on.off-choice { background: #fff0f0; color: #c0404f; border-color: #ff9aa5; }
  .parent-zone { margin-top: 18px; padding: 14px; border-radius: 22px; background: #f3f0ff; border: 3px dashed #cbbcf5; }
  .parent-zone h3 { font-size: 20px; font-weight: 900; color: #5d4a96; margin-bottom: 10px; }
  .confirm-box { font-size: 22px; font-weight: 900; color: #c0404f; }
  .confirm-box .sheet-btns { margin-top: 10px; }

  @media (hover: hover) and (pointer: fine) {
    .btn:hover:not(:disabled) { filter: brightness(1.04); }
    .card:hover { transform: translateY(-3px); }
    .chip:hover { border-color: #f5c9d9; }
  }

  [hidden] { display: none !important; }
  .test-mode *, .test-mode *::before, .test-mode *::after { animation: none !important; transition: none !important; }
  /* 选关 */
  .chapters { display: flex; flex-direction: column; gap: 14px; }
  .chapter {
    background: rgba(255, 255, 255, 0.72);
    border-radius: 26px;
    padding: 12px 16px 14px;
    box-shadow: 0 4px 14px rgba(150, 100, 60, 0.08);
  }
  .chapter-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .chapter-head .ch-name { font-size: 24px; font-weight: 900; }
  .chapter-head .ch-desc { font-size: 17px; font-weight: 800; color: #9a7f69; }
  .chapter-head .ch-stars { margin-left: auto; font-size: 18px; font-weight: 900; color: #b07a00; }
  .levels { display: flex; flex-wrap: wrap; gap: 10px; }
  .lvl {
    --shade: #dcc9ad;
    width: 104px;
    min-height: 92px;
    border-radius: 20px;
    background: #fff;
    box-shadow: 0 5px 0 var(--shade), 0 8px 16px rgba(150, 100, 60, 0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 6px 4px;
    transition: transform 0.08s, box-shadow 0.08s;
  }
  .lvl:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--shade); }
  .lvl .l-id { font-size: 20px; font-weight: 900; }
  .lvl .l-name { font-size: 14px; font-weight: 800; color: #8f725c; white-space: nowrap; }
  .lvl .l-stars { font-family: var(--emoji); font-size: 16px; letter-spacing: -1px; }
  .lvl .l-stars .off { opacity: 0.22; filter: grayscale(1); }
  .lvl.locked { background: #efe9e1; color: #b8a896; box-shadow: 0 5px 0 #d8cfc3; }
  .lvl.locked .l-stars { font-size: 22px; }
  .lvl.next { background: #fff7cf; --shade: #e8c75a; animation: nudge 1.4s ease-in-out infinite; }

  .emo-img { display: inline-block; width: 1.08em; height: 1.08em; vertical-align: -0.16em; object-fit: contain; pointer-events: none; }
  /* ============== 抢 21 ============== */
  body { background: linear-gradient(160deg, #fff0e6 0%, #fdf4ff 50%, #e6f0ff 100%); }
  .title .emo { display: inline-block; animation: hop 1.3s ease-in-out infinite; }

  .cards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 760px) { .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .card .c-paws span { font-family: var(--emoji); }

  #play { padding: calc(10px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom)); gap: 12px; flex-direction: column; justify-content: flex-start; align-items: center; }
  #play.show { display: flex; }
  .play-inner { width: 100%; max-width: 780px; margin: auto 0; display: flex; flex-direction: column; gap: 12px; }

  .lv-head { display: flex; align-items: center; gap: 10px; }
  .lv-title { font-size: 24px; font-weight: 900; white-space: nowrap; }
  .lv-head .btn { min-height: 46px; font-size: 18px; padding: 0 14px; margin-left: auto; }

  .vsrow { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .who {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255, 255, 255, 0.8);
    border: 3px solid transparent;
    border-radius: 999px;
    padding: 5px 16px 5px 8px;
    font-size: 20px; font-weight: 900;
    opacity: 0.6;
    transition: opacity 0.2s, border-color 0.2s, box-shadow 0.2s;
  }
  .who .av { font-family: var(--emoji); font-size: 30px; line-height: 1; }
  .who .av .emo-img { width: 1em; height: 1em; vertical-align: middle; }
  .who.p1 { color: #b4356a; }
  .who.p2 { color: #2f6ea8; }
  .who.on { opacity: 1; border-color: currentColor; box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.7); }
  .vsrow .score { font-size: 22px; font-weight: 900; color: #8a6a55; }

  .goal {
    font-size: clamp(18px, 2.3vw, 24px);
    font-weight: 900;
    text-align: center;
    background: rgba(255, 255, 255, 0.75);
    border-radius: 20px;
    padding: 8px 14px;
    line-height: 1.35;
  }
  .goal b { color: #e0632a; }

  /* 数字格 */
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .cell {
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.85);
    border: 3px solid #f0e2cf;
    display: grid; place-items: center;
    font-size: clamp(18px, 3.4vw, 28px);
    font-weight: 900;
    color: #a9937c;
    transition: transform 0.15s, background 0.2s, color 0.2s;
  }
  .cell.p1 { background: linear-gradient(140deg, #ffd7e6, #ffabc8); border-color: #fff; color: #9c2f5c; }
  .cell.p2 { background: linear-gradient(140deg, #d6e9ff, #a8cdf5); border-color: #fff; color: #275e8f; }
  .cell.just { animation: popBanner 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  .cell.goal-cell { border-color: #ffc62e; box-shadow: 0 0 0 3px #ffe07a; }
  .cell.win { animation: glowGold 1s ease-in-out infinite; }

  /* 报几个 */
  .picks { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .pick {
    --shade: #e9d2b3;
    min-width: 128px;
    min-height: 82px;
    border-radius: 24px;
    background: #fff;
    box-shadow: 0 6px 0 var(--shade), 0 10px 18px rgba(150, 100, 60, 0.12);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    padding: 6px 14px;
    transition: transform 0.1s, box-shadow 0.08s;
  }
  .pick .big { font-size: 26px; font-weight: 900; }
  .pick .sub { font-size: 16px; font-weight: 800; color: #8f725c; white-space: nowrap; }
  .pick:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--shade); }
  .pick:disabled { opacity: 0.4; }
  .pick.tip { background: #fff8dc; --shade: #e8c75a; animation: nudge 1s ease-in-out infinite; }

  .msg {
    min-height: 54px;
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 6px 14px;

<script>
(() => {
  'use strict';
  /* ============== 抢 21（纯逻辑，可单独测） ============== */
  const GOAL = 21;
  const MAXTAKE = 3;

  // 五个难度：p = 走最优的概率
  const LEVELS = [
    { id: 'chick', emoji: '🐣', name: '小鸡', tag: '乱报一通', p: 0 },
    { id: 'rabbit', emoji: '🐰', name: '兔子', tag: '偶尔聪明', p: 0.25 },
    { id: 'cat', emoji: '🐱', name: '小猫', tag: '一半一半', p: 0.5 },
    { id: 'bear', emoji: '🐻', name: '小熊', tag: '很会算', p: 0.8 },
    { id: 'fox', emoji: '🦊', name: '狐狸', tag: '从不出错', p: 1 },
  ];

  const moves = (cur) => {
    const out = [];
    for (let n = 1; n <= MAXTAKE; n++) if (cur + n <= GOAL) out.push(n);
    return out;
  };

  // 最优：报完以后剩下的数是 4 的倍数，对手就输定了
  function best(cur) {
    for (const n of moves(cur)) if ((GOAL - (cur + n)) % (MAXTAKE + 1) === 0) return n;
    return null;
  }

  function aiMove(cur, p, rnd) {
    const r = rnd || Math.random;
    const list = moves(cur);
    const b = best(cur);
    if (b !== null && r() < p) return b;
    return list[Math.floor(r() * list.length)];
  }

  // 现在这一步能不能赢（给提示用）
  function tip(cur) {
    const b = best(cur);
    if (b !== null) return { n: b, sure: true };
    return { n: moves(cur)[0], sure: false };
  }

  window.NimGame = { GOAL, MAXTAKE, LEVELS, moves, best, aiMove, tip };
})();
</script>

<script>
(() => {
  'use strict';
  const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  /* ============== 动物头像：系统 emoji，画不出来就用备用图片 ============== */
  // 有的设备（部分 iPad、微信内置浏览器等）画不出彩色 emoji，就换成 icons/emoji 里的 Noto Emoji 图片
  const Emo = (() => {
    const FILES = {
      '🐣': '1f423', '🐰': '1f430', '🐱': '1f431', '🐻': '1f43b', '🦊': '1f98a', '🐯': '1f42f',
      '🐼': '1f43c', '🐶': '1f436', '🐸': '1f438', '🐷': '1f437', '🦄': '1f984', '🐧': '1f427',
      '🐨': '1f428', '🦘': '1f998', '🐭': '1f42d', '🐺': '1f43a', '🐆': '1f406', '🦁': '1f981',
      '🐘': '1f418', '🧑': '1f9d1', '🏠': '1f3e0', '⭐': '2b50', '🐵': '1f435', '🐹': '1f439',
      '🍪': '1f36a', '🍎': '1f34e', '🥕': '1f955', '🍌': '1f34c', '🍬': '1f36c', '🍓': '1f353',
      '🍇': '1f347', '🧺': '1f9fa', '✅': '2705', '🍉': '1f349', '🪷': '1fab7', '🏁': '1f3c1',
      '🙋': '1f64b', '👧': '1f467', '🏆': '1f3c6', '⚖️': '2696', '🎴': '1f3b4',
    };
    const SPLIT = new RegExp('(' + Object.keys(FILES).join('|') + ')', 'u');
    const src = (e) => 'icons/emoji/' + FILES[e] + '.png';
    const imgs = new Map();
    const forced = /[?&]emoji=img(?:&|$)/.test(location.search) || /MicroMessenger/i.test(navigator.userAgent);
    const off = /[?&]emoji=text(?:&|$)/.test(location.search);
    let detected = null;   // 这台设备能不能画 emoji（第一次用到时才测）
    let loading = false;
    let ready = null;
    let gen = 0;

    function canvasEmojiOk() {
      try {
        const c = document.createElement('canvas');
        c.width = c.height = 32;
        const x = c.getContext('2d');
        x.textAlign = 'center';
        x.textBaseline = 'middle';
        // 画两个颜色鲜明的 emoji：都画不出彩色，就说明这台设备画不了
        const check = (ch, test) => {
          x.clearRect(0, 0, 32, 32);
          x.font = '24px ' + EMOJI_FONT;
          x.fillText(ch, 16, 17);
          const d = x.getImageData(0, 0, 32, 32).data;
          let n = 0;
          for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 100 && test(d[i], d[i + 1], d[i + 2])) n++;
          return n >= 10;
        };
        return check('🦊', (r, g, b) => r - b > 60) || check('🐸', (r, g, b) => g - r > 30);
      } catch (e) {
        return true; // 读不了像素就当作正常
      }
    }

    function useImg() {
      if (off) return false;
      if (forced) return true;
      if (window.__picAnimals) return true;
      if (detected === null) detected = canvasEmojiOk();
      return !detected;
    }

    function preload(cb) {
      if (cb) ready = cb;
      if (!useImg() || loading) return;
      loading = true;
      let left = Object.keys(FILES).length;
      for (const e of Object.keys(FILES)) {
        const im = new Image();
        im.onload = im.onerror = () => { if (--left === 0 && ready) ready(); };
        im.src = src(e);
        imgs.set(e, im);
      }
    }

    // 在 canvas 上画：成功返回 true
    function draw(x, e, cx, cy, size) {
      if (!useImg()) return false;
      preload();
      const im = imgs.get(e);
      if (!im || !im.complete || !im.naturalWidth) return false;
      x.drawImage(im, cx - size / 2, cy - size / 2, size, size);
      return true;
    }

    // 设置 DOM 文字，动物 emoji 换成图片
    function text(el, str) {
      str = String(str);
      const on = useImg();
      const key = (on ? 'i' + gen : 't') + str;
      if (el.dataset.emo === key) return;
      el.dataset.emo = key;
      el.dataset.emoRaw = str;
      if (!on) { el.textContent = str; return; }
      preload();
      el.textContent = '';
      for (const part of str.split(SPLIT)) {
        if (!part) continue;
        if (FILES[part]) {
          const im = document.createElement('img');
          im.className = 'emo-img';
          im.src = src(part);
          im.alt = part;
          im.draggable = false;
          el.appendChild(im);
        } else {
          el.appendChild(document.createTextNode(part));
        }
      }
    }

    // 设置里切换之后重画
    function refresh() {
      gen++;
      loading = false;
      preload();
      // 把已经画过的地方按新模式重画一遍
      document.querySelectorAll('[data-emo-raw]').forEach((el) => text(el, el.dataset.emoRaw));
    }

    return { useImg, preload, draw, text, refresh, has: (e) => useImg() && !!FILES[e] };
  })();

  window.Emo = Emo;
})();
</script>

<script>
(() => {
  'use strict';
  const TEST = /[?&]test=1(?:&|$)/.test(location.search);
  const INSTANT = TEST && !/[?&]anim=1(?:&|$)/.test(location.search);
  const G = NimGame;
  const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  const $ = (id) => document.getElementById(id);
  const ME = '🙋';

  /* ============== 存储 ============== */
  const Store = (() => {
    const KEY = 'kidsQiang21.v1';
    const data = { wins: {}, loses: {}, sound: true, picAnimals: false, players: 1, first: 'me', tutorialSeen: false };
    try {
      const o = JSON.parse(window.localStorage.getItem(KEY) || 'null');
      if (o && typeof o === 'object') {
        for (const L of G.LEVELS) {
          if (o.wins && Number.isInteger(o.wins[L.id]) && o.wins[L.id] >= 0) data.wins[L.id] = o.wins[L.id];
          if (o.loses && Number.isInteger(o.loses[L.id]) && o.loses[L.id] >= 0) data.loses[L.id] = o.loses[L.id];
        }
        for (const k of ['sound', 'picAnimals', 'tutorialSeen']) if (typeof o[k] === 'boolean') data[k] = o[k];
        if (o.players === 1 || o.players === 2) data.players = o.players;
        if (o.first === 'me' || o.first === 'other') data.first = o.first;
      }
    } catch (e) { /* 忽略 */ }
    const save = () => { try { window.localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* 忽略 */ } };
    return { data, save };
  })();

  /* ============== 声音 ============== */
  const Sound = (() => {
    let ctx = null, master = null;
    function unlock() {
      try {
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          ctx = new AC();
          master = ctx.createGain();
          master.gain.value = 0.55;
          master.connect(ctx.destination);
        }
        if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
      } catch (e) { ctx = null; }
    }
    function tone(freq, at, dur, type, vol, slideTo) {
      const t0 = ctx.currentTime + at;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.03, dur / 3));
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g);
      g.connect(master);
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    }
    function play(name, i) {
      if (!Store.data.sound || !ctx || INSTANT) return;
      try {
        if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
        switch (name) {
          case 'say': tone(420 + (i || 0) * 22, 0, 0.1, 'triangle', 0.14); break;
          case 'tip': [660, 880].forEach((f, k) => tone(f, k * 0.09, 0.16, 'sine', 0.13)); break;
          case 'boop': tone(420, 0, 0.14, 'triangle', 0.12, 330); break;
          case 'lose': [400, 330, 262].forEach((f, k) => tone(f, k * 0.13, 0.22, 'sine', 0.14)); break;
          case 'win':
            [523, 659, 784, 1047].forEach((f, k) => tone(f, k * 0.11, k === 3 ? 0.5 : 0.18, 'triangle', 0.2));
            tone(1319, 0.5, 0.45, 'sine', 0.1);
            break;
        }
      } catch (e) { /* 忽略 */ }
    }
    return { unlock, play };
  })();

  /* ============== 状态 ============== */
  const S = { screen: 'menu', lv: null, cur: 0, owner: [], turn: 1, over: false, winner: 0, busy: false, tutStep: 0 };

  const mk = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  };
  const emoEl = (tag, cls, text) => { const e = mk(tag, cls); Emo.text(e, text); return e; };
  const twoPlayer = () => Store.data.players === 2;
  const starsOf = (id) => Math.min(3, Store.data.wins[id] || 0);
  const totalStars = () => G.LEVELS.reduce((a, L) => a + starsOf(L.id), 0);
  const wait = (ms) => new Promise((r) => setTimeout(r, INSTANT ? 0 : ms));
  const otherName = () => (twoPlayer() ? '对手' : S.lv ? S.lv.name : '对手');
  const otherEmo = () => (twoPlayer() ? '👧' : S.lv ? S.lv.emoji : '🦊');

  /* ============== 菜单 ============== */
  function renderMenu() {
    $('starNum').textContent = totalStars();
    $('btnSound').textContent = Store.data.sound ? '🔊 有声音' : '🔇 没声音';
    const box = $('cards');
    box.textContent = '';
    const shades = ['#efd679', '#f1b6cd', '#c9b6e8', '#d9bb98', '#f0a97e'];
    G.LEVELS.forEach((L, i) => {
      const c = mk('button', 'card');
      c.style.setProperty('--shade', shades[i % shades.length]);
      c.dataset.id = L.id;
      c.appendChild(emoEl('div', 'c-emo', L.emoji));
      c.appendChild(mk('div', 'c-name', L.name));
      c.appendChild(mk('div', 'c-tag', L.tag));
      const st = mk('div', 'c-paws');
      const v = starsOf(L.id);
      for (let k = 1; k <= 3; k++) st.appendChild(mk('span', k <= v ? '' : 'off', '⭐'));
      c.appendChild(st);
      const w = Store.data.wins[L.id] || 0;
      const l = Store.data.loses[L.id] || 0;
      c.appendChild(mk('div', 'c-wins', w || l ? `赢 ${w} · 输 ${l}` : '还没玩过'));
      c.addEventListener('click', () => start(L.id));
      box.appendChild(c);
    });

    const pc = $('playerChips');
    pc.textContent = '';
    [[1, '🙋 一个人'], [2, '👧 两个人比赛']].forEach(([v, label]) => {
      const b = emoEl('button', 'chip' + (Store.data.players === v ? ' on' : ''), label);
      b.addEventListener('click', () => { Store.data.players = v; Store.save(); renderMenu(); });
      pc.appendChild(b);
    });

    const fc = $('firstChips');
    fc.textContent = '';
    [['me', twoPlayer() ? '🙋 我先' : '🙋 我先'], ['other', twoPlayer() ? '👧 对手先' : '🐾 动物先']].forEach(([v, label]) => {
      const b = emoEl('button', 'chip' + (Store.data.first === v ? ' on' : ''), label);
      b.addEventListener('click', () => { Store.data.first = v; Store.save(); renderMenu(); });
      fc.appendChild(b);
    });
  }

  function showScreen(name) {
    S.screen = name;
    $('menu').classList.toggle('show', name === 'menu');
    $('play').classList.toggle('show', name === 'play');
    if (name === 'menu') renderMenu();
  }

  /* ============== 一局 ============== */
  function start(id) {
    S.lv = G.LEVELS.find((L) => L.id === id) || S.lv || G.LEVELS[0];
    S.cur = 0;
    S.owner = [];
    S.turn = Store.data.first === 'me' ? 1 : 2;
    S.over = false;
    S.winner = 0;
    S.busy = false;
    hideOverlay('resultOv');
    showScreen('play');
    render();
    setMsg(S.turn === 1 ? '你先报，点下面的按钮' : (twoPlayer() ? '👧 对手先报' : `${otherName()}先报`), '');
    if (S.turn === 2 && !twoPlayer()) aiTurn();
  }

  function say(n) {
    if (S.over || S.busy) return 'busy';
    if (!G.moves(S.cur).includes(n)) { Sound.play('boop'); return 'bad'; }
    const who = S.turn;
    for (let k = 0; k < n; k++) {
      S.cur++;
      S.owner[S.cur] = who;
      Sound.play('say', k);
    }
    if (S.cur >= G.GOAL) { finish(who); render(); return 'win'; }
    S.turn = 3 - who;
    render();
    setMsg(turnMsg(), '');
    if (who === 1 && !twoPlayer()) aiTurn();
    return 'ok';
  }

  async function aiTurn() {
    if (S.over || twoPlayer()) return;
    S.busy = true;
    render();
    await wait(650);
    if (S.over) { S.busy = false; return; }
    const n = G.aiMove(S.cur, S.lv.p);
    S.busy = false;
    const before = S.cur;
    say(n);
    if (!S.over) setMsg(`${otherName()}报了 ${nums(before, n)}，轮到你啦`, 'blue');
  }

  function turnMsg() {
    if (S.turn === 1) return twoPlayer() ? '🙋 轮到你了' : '轮到你啦';
    return twoPlayer() ? '👧 轮到对手了' : `轮到 ${otherName()} 了`;
  }

  function nums(before, n) {
    const out = [];
    for (let k = 1; k <= n; k++) out.push(before + k);
    return out.join('、');
  }

  function finish(who) {
    S.over = true;
    S.winner = who;
    const id = S.lv.id;
    if (!twoPlayer()) {
      if (who === 1) Store.data.wins[id] = (Store.data.wins[id] || 0) + 1;
      else Store.data.loses[id] = (Store.data.loses[id] || 0) + 1;
      Store.save();
    }
    Sound.play(who === 1 ? 'win' : 'lose');
    setMsg(who === 1 ? '你抢到 21 啦！🎉' : `${otherName()}抢到 21 了`, who === 1 ? 'gold' : 'blue');
    if (INSTANT) showResult();
    else setTimeout(showResult, 800);
  }

  /* ============== 画面 ============== */
  function setMsg(text, kind) {
    const el = $('msg');
    el.dataset.kind = kind || '';
    el.className = 'msg' + (kind ? ' ' + kind : '');
    Emo.text(el, text);
  }

  function render() {
    Emo.text($('lvTitle'), twoPlayer() ? '🏆 抢 21' : `🏆 对手：${S.lv.emoji} ${S.lv.name}`);

    const vs = $('vsrow');
    vs.textContent = '';
    const w1 = mk('div', 'who p1' + (S.turn === 1 && !S.over ? ' on' : ''));
    w1.appendChild(emoEl('span', 'av', ME));
    w1.appendChild(mk('span', '', '我'));
    vs.appendChild(w1);
    vs.appendChild(mk('span', 'score', 'VS'));
    const w2 = mk('div', 'who p2' + (S.turn === 2 && !S.over ? ' on' : ''));
    w2.appendChild(emoEl('span', 'av', otherEmo()));
    w2.appendChild(mk('span', '', otherName()));
    vs.appendChild(w2);

    const grid = $('grid');
    grid.textContent = '';
    for (let i = 1; i <= G.GOAL; i++) {
      const c = mk('div', 'cell', String(i));
      if (S.owner[i]) c.classList.add(S.owner[i] === 1 ? 'p1' : 'p2');
      if (i === G.GOAL) c.classList.add('goal-cell');
      if (i === G.GOAL && S.over) c.classList.add('win');
      grid.appendChild(c);
    }

    const picks = $('picks');
    picks.textContent = '';
    const myTurn = !S.over && !S.busy && (S.turn === 1 || twoPlayer());
    for (let n = 1; n <= G.MAXTAKE; n++) {
      const b = mk('button', 'pick');
      b.dataset.n = n;
      b.appendChild(mk('div', 'big', `报 ${n} 个`));
      b.appendChild(mk('div', 'sub', S.cur + n <= G.GOAL ? `数到 ${S.cur + n}` : '太多了'));
      b.disabled = !myTurn || S.cur + n > G.GOAL;
      b.addEventListener('click', () => say(n));
      picks.appendChild(b);
    }
  }

  function hint() {
    if (S.over || S.busy || (S.turn !== 1 && !twoPlayer())) { Sound.play('boop'); return; }
    const t = G.tip(S.cur);
    Sound.play('tip');
    setMsg(t.sure ? `报 ${t.n} 个，剩下的就是 4 的倍数啦` : '这次有点难，先随便报一个吧', '');
    const b = $('picks').querySelector(`[data-n="${t.n}"]`);
    if (b) { b.classList.add('tip'); setTimeout(() => b.classList.remove('tip'), INSTANT ? 0 : 2600); }
  }

  function showResult() {
    const win = S.winner === 1;
    Emo.text($('rTitle'), win ? '🎉 你赢啦！' : `${otherEmo()} ${otherName()}赢了`);
    Emo.text($('rEmo'), win ? ME : otherEmo());
    const st = $('rStars');
    st.textContent = '';
    st.hidden = twoPlayer();
    if (!twoPlayer()) {
      const v = starsOf(S.lv.id);
      for (let k = 1; k <= 3; k++) {
        const s = mk('span', k <= v ? '' : 'off', '⭐');
        s.style.animationDelay = (k * 0.18) + 's';
        st.appendChild(s);
      }
    }
    const lines = $('rLines');
    lines.textContent = '';
    if (twoPlayer()) {
      lines.appendChild(mk('div', '', win ? '先报到 21 的人赢' : '对手抢到了 21'));
    } else {
      const w = Store.data.wins[S.lv.id] || 0;
      const l = Store.data.loses[S.lv.id] || 0;
      lines.appendChild(emoEl('div', '', `和 ${S.lv.emoji} ${S.lv.name}：赢 ${w} 次 · 输 ${l} 次`));
      lines.appendChild(mk('div', '', win ? '记住了吗？剩 4 的倍数就稳赢' : '下次试试：报完剩 4 的倍数'));
    }
    const i = G.LEVELS.findIndex((L) => L.id === S.lv.id);
    $('rHarder').hidden = twoPlayer() || i >= G.LEVELS.length - 1;
    if (!$('rHarder').hidden) $('rHarder').dataset.id = G.LEVELS[i + 1].id;
    showOverlay('resultOv');
    if (win && !INSTANT) confetti();
  }

  function confetti() {
    const box = $('confetti');
    box.textContent = '';
    const colors = ['#ff8fb8', '#6bbfff', '#ffd24a', '#7ed9a6', '#c9a7ff', '#ffa45c'];
    const W = window.innerWidth;
    for (let i = 0; i < 60; i++) {
      const p = mk('i');
      if (i % 6 === 0) {
        p.textContent = ['⭐', '🏆', '💖'][i % 3];
        p.style.fontSize = 18 + Math.random() * 14 + 'px';
        p.style.fontFamily = EMOJI_FONT;
      } else {
        p.style.width = 8 + Math.random() * 8 + 'px';
        p.style.height = 10 + Math.random() * 10 + 'px';
        p.style.background = colors[i % colors.length];
      }
      p.style.left = Math.random() * W + 'px';
      p.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
      p.style.setProperty('--rot', (Math.random() * 900 - 450) + 'deg');
      p.style.animationDuration = 2.2 + Math.random() * 1.8 + 's';
      p.style.animationDelay = Math.random() * 0.5 + 's';
      box.appendChild(p);
    }
    setTimeout(() => { box.textContent = ''; }, 4500);
  }

  /* ============== 弹层 ============== */
  const showOverlay = (id) => $(id).classList.add('show');
  const hideOverlay = (id) => $(id).classList.remove('show');

  let tutBuilt = false;
  function openTutorial() {
    if (!tutBuilt) {
      tutBuilt = true;
      const row = (parts) => {
        const r = mk('div', 'demo-row');
        parts.forEach((t) => {
          if (/^[0-9]/.test(t)) r.appendChild(mk('span', 'num', t));
          else if (t.length > 3) r.appendChild(mk('span', 'lbl', t));
          else r.appendChild(emoEl('span', '', t));
        });
        return r;
      };
      $('tutArt0').appendChild(row(['🙋', '1 2', '🦊', '3', '🙋', '4 5 6']));
      $('tutArt1').appendChild(row(['🙋', '21', ' 抢到啦 ', '🏆']));
      $('tutArt2').appendChild(row(['4 8 12 16 20', ' 都是好位置 ']));
    }
    S.tutStep = 0;
    renderTutorial();
    showOverlay('tutOv');
  }
  function renderTutorial() {
    document.querySelectorAll('#tutOv .tut-step').forEach((s) => s.classList.toggle('show', Number(s.dataset.step) === S.tutStep));
    document.querySelectorAll('#tutDots i').forEach((d, i) => d.classList.toggle('on', i === S.tutStep));
    $('tutNext').textContent = S.tutStep < 2 ? '👉 下一步' : '🎮 开始玩！';
  }

  function renderSettings() {
    document.querySelectorAll('#setOv .seg').forEach((seg) => {
      const v = !!Store.data[seg.dataset.opt];
      seg.querySelectorAll('button').forEach((b) => {
        const isOn = b.dataset.v === '1';
        b.classList.toggle('on', isOn === v);
        b.classList.toggle('off-choice', !isOn);
      });
    });
  }

  function setOption(name, value) {
    const v = !!value && value !== '0';
    Store.data[name] = v;
    if (name === 'sound' && v) Sound.unlock();
    if (name === 'picAnimals') { window.__picAnimals = v; Emo.refresh(); if (S.screen === 'play') render(); }
    Store.save();
    renderSettings();
    if (S.screen === 'menu') renderMenu();
  }

  /* ============== 绑定 ============== */
  function bind() {
    const on = (id, fn) => $(id).addEventListener('click', fn);
    on('btnHelp', openTutorial);
    on('btnSettings', () => { renderSettings(); $('clearStep1').hidden = false; $('clearStep2').hidden = true; showOverlay('setOv'); });
    on('btnSound', () => setOption('sound', !Store.data.sound));
    on('btnLevels', () => showScreen('menu'));
    on('btnHint', hint);
    on('btnAgain', () => start(S.lv.id));
    on('tutNext', () => {
      if (S.tutStep < 2) { S.tutStep++; renderTutorial(); }
      else { hideOverlay('tutOv'); Store.data.tutorialSeen = true; Store.save(); }
    });
    on('rAgain', () => { hideOverlay('resultOv'); start(S.lv.id); });
    on('rHarder', () => { hideOverlay('resultOv'); start($('rHarder').dataset.id); });
    on('rLevels', () => { hideOverlay('resultOv'); showScreen('menu'); });
    document.querySelectorAll('#setOv .seg button').forEach((b) => b.addEventListener('click', () => setOption(b.parentElement.dataset.opt, b.dataset.v === '1')));
    on('btnClearStars', () => { $('clearStep1').hidden = true; $('clearStep2').hidden = false; });
    on('btnClearNo', () => { $('clearStep1').hidden = false; $('clearStep2').hidden = true; });
    on('btnClearYes', () => { Store.data.wins = {}; Store.data.loses = {}; Store.save(); $('clearStep1').hidden = false; $('clearStep2').hidden = true; renderMenu(); });
    on('setClose', () => hideOverlay('setOv'));
    ['pointerdown', 'touchend', 'click', 'keydown'].forEach((ev) => document.addEventListener(ev, Sound.unlock, { capture: true, passive: true }));
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('dblclick', (e) => e.preventDefault());
  }

  function getState() {
    return {
      screen: S.screen,
      level: S.lv ? S.lv.id : null,
      cur: S.cur,
      owner: S.owner.slice(),
      turn: S.turn,
      over: S.over,
      winner: S.winner,
      busy: S.busy,
      msg: $('msg').textContent,
      msgKind: $('msg').dataset.kind,
      wins: Object.assign({}, Store.data.wins),
      loses: Object.assign({}, Store.data.loses),
      overlay: ['tutOv', 'resultOv', 'setOv'].filter((id) => $(id).classList.contains('show')),
      emojiImages: Emo.useImg(),
    };
  }

  function init() {
    if (INSTANT) document.documentElement.classList.add('test-mode');
    window.__picAnimals = Store.data.picAnimals;
    bind();
    renderSettings();
    document.querySelectorAll('.title .emo').forEach((el) => { el.dataset.raw = el.dataset.raw || el.textContent; Emo.text(el, el.dataset.raw); });
    Emo.preload(() => { if (S.screen === 'play') render(); renderMenu(); });
    showScreen('menu');
    if (!TEST && !Store.data.tutorialSeen) openTutorial();
    if (!TEST && 'serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) {
      navigator.serviceWorker.register('sw.js').catch(() => { /* 忽略 */ });
    }
    if (TEST) {
      window.__nim = {
        G,
        getState,
        start: (id) => { start(id); return getState(); },
        say: (n) => say(n),
        hint: () => { hint(); return getState(); },
        setPlayers: (n) => { Store.data.players = n; Store.save(); renderMenu(); },
        setFirst: (v) => { Store.data.first = v; Store.save(); renderMenu(); },
        setOption: (k, v) => { setOption(k, v); return getState(); },
        playBest: () => { const n = G.best(S.cur); return say(n === null ? 1 : n); },
      };
    }
  }

  init();
})();
</script>

</body>
</html>
