<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="游戏乐园">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#fff5e1">
<link rel="manifest" href="all.webmanifest">
<link rel="apple-touch-icon" href="icons/all-180.png">
<link rel="icon" type="image/png" href="icons/all-192.png">
<title>小动物游戏乐园</title>
<style>
  :root {
    --ink: #5b4331;
    --font: ui-rounded, "SF Pro Rounded", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background: linear-gradient(160deg, #ffe8f1 0%, #fff5e1 45%, #e2f2ff 100%);
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    padding:
      calc(18px + env(safe-area-inset-top))
      calc(18px + env(safe-area-inset-right))
      calc(24px + env(safe-area-inset-bottom))
      calc(18px + env(safe-area-inset-left));
  }
  .wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .head { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
  h1 {
    font-size: clamp(30px, 5vw, 48px);
    font-weight: 900;
    letter-spacing: 2px;
    color: #6d4a33;
    text-shadow: 0 3px 0 #fff, 0 6px 14px rgba(255, 143, 184, 0.3);
    white-space: nowrap;
  }
  h1 .emo { font-family: var(--emoji); display: inline-block; animation: hop 1.4s ease-in-out infinite; }
  .sub { text-align: center; font-size: clamp(17px, 2.4vw, 22px); font-weight: 800; color: #8a6f57; }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

  .games { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .game {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px;
    border-radius: 28px;
    background: rgba(255, 255, 255, 0.86);
    border: 4px solid #fff;
    box-shadow: 0 6px 0 #e6d3b8, 0 12px 22px rgba(150, 100, 60, 0.14);
    text-decoration: none;
    color: inherit;
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .game:active { transform: translateY(5px); box-shadow: 0 1px 0 #e6d3b8, 0 4px 10px rgba(150, 100, 60, 0.12); }
  .game img { width: 86px; height: 86px; border-radius: 22px; flex-shrink: 0; }
  .game .txt { min-width: 0; }
  .game .nm { font-size: 26px; font-weight: 900; white-space: nowrap; }
  .game .ds { font-size: 17px; font-weight: 800; color: #8f725c; line-height: 1.35; margin-top: 2px; }
  @media (hover: hover) and (pointer: fine) { .game:hover { transform: translateY(-3px); } }

  .tip {
    text-align: center;
    font-size: 17px;
    font-weight: 800;
    color: #97836a;
    background: rgba(255, 255, 255, 0.6);
    border-radius: 20px;
    border: 3px dashed rgba(214, 176, 132, 0.5);
    padding: 12px 14px;
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1><span class="emo">🎮</span> 小动物游戏乐园</h1></div>
  <div class="sub">选一个游戏开始玩吧！</div>

  <div class="games">
    <a class="game" href="kids.html">
      <img src="icons/wuziqi-192.png" alt="五子棋">
      <div class="txt"><div class="nm">五子棋乐园</div><div class="ds">连成 5 个就赢</div></div>
    </a>
    <a class="game" href="tiaoqi.html">
      <img src="icons/tiaoqi-192.png" alt="跳棋">
      <div class="txt"><div class="nm">跳棋乐园</div><div class="ds">连跳跳得好远</div></div>
    </a>
    <a class="game" href="doushouqi.html">
      <img src="icons/doushouqi-192.png" alt="斗兽棋">
      <div class="txt"><div class="nm">斗兽棋乐园</div><div class="ds">大的吃小的，老鼠吃大象</div></div>
    </a>
    <a class="game" href="chess.html">
      <img src="icons/chess-192.png" alt="国际象棋">
      <div class="txt"><div class="nm">国际象棋乐园</div><div class="ds">把对方的国王将死</div></div>
    </a>
    <a class="game" href="huijia.html">
      <img src="icons/huijia-192.png" alt="小动物回家">
      <div class="txt"><div class="nm">小动物回家</div><div class="ds">排积木，让小动物回家</div></div>
    </a>
    <a class="game" href="fendongxi.html">
      <img src="icons/fen-192.png" alt="分东西">
      <div class="txt"><div class="nm">分东西</div><div class="ds">给小动物分得公平</div></div>
    </a>
    <a class="game" href="fanpai.html">
      <img src="icons/fanpai-192.png" alt="记忆翻牌">
      <div class="txt"><div class="nm">记忆翻牌</div><div class="ds">找出一样的两张</div></div>
    </a>
    <a class="game" href="tianping.html">
      <img src="icons/tianping-192.png" alt="天平称一称">
      <div class="txt"><div class="nm">天平称一称</div><div class="ds">两边一样重就平了</div></div>
    </a>
    <a class="game" href="shuzhou.html">
      <img src="icons/shuzhou-192.png" alt="青蛙跳数轴">
      <div class="txt"><div class="nm">青蛙跳数轴</div><div class="ds">一格一格跳到荷叶上</div></div>
    </a>
    <a class="game" href="qiang21.html">
      <img src="icons/qiang21-192.png" alt="抢21">
      <div class="txt"><div class="nm">抢 21</div><div class="ds">谁报到 21 谁赢</div></div>
    </a>
  </div>

  <div class="tip">
    📱 iPad 上用 Safari 打开这一页，点分享 → <b>添加到主屏幕</b>，以后点一个图标就能进所有游戏，没网也能玩。
  </div>
</div>

<script>
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* 忽略 */ });
  }
</script>
</body>
</html>
