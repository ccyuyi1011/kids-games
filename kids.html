      const g = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.03, dur / 3));
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g);
      g.connect(master);
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    }

    function play(name, arg) {
      if (!Store.data.sound || !ctx || TEST) return;
      try {
        if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
        switch (name) {
          case 'pop': // 落子：两方音高略不同
            tone(arg === 1 ? 700 : 560, 0, 0.13, 'sine', 0.32, arg === 1 ? 480 : 380);
            break;
          case 'ding': // 提示
            tone(1046, 0, 0.25, 'triangle', 0.16);
            tone(1568, 0.09, 0.35, 'triangle', 0.12);
            break;
          case 'danger': // 柔和的两音提醒
            tone(784, 0, 0.2, 'sine', 0.26);
            tone(622, 0.22, 0.28, 'sine', 0.24);
            break;
          case 'three': // 很轻的单音
            tone(660, 0, 0.18, 'sine', 0.07);
            break;
          case 'boop': // 再想想
            tone(520, 0, 0.14, 'triangle', 0.14, 600);
            break;
          case 'win': // 欢快琶音
            [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.11, i === 3 ? 0.5 : 0.18, 'triangle', 0.2));
            tone(1319, 0.5, 0.45, 'sine', 0.1);
            break;
          case 'lose': // 温柔下行
            [523, 466, 392].forEach((f, i) => tone(f, i * 0.2, 0.32, 'sine', 0.12));
            break;
          case 'tap':
            tone(880, 0, 0.06, 'sine', 0.05);
            break;
        }
      } catch (e) { /* 忽略音频错误 */ }
    }

    return { unlock, play };
  })();

  /* ============== 游戏状态 ============== */
  const emptyDanger = () => ({ kind: 'none', oppWin: [], oppFour: [], myWin: false, banner: '' });

  const S = {
    screen: 'menu',
    mode: 'ai',          // 'ai' | 'family'
    level: 1,
    size: Store.data.size,
    avatar: Store.data.avatar,
    board: [],
    current: 1,
    history: [],
    gameOver: false,
    winner: null,        // null 进行中；1/2 胜者；0 平局
    winLine: null,
    winAt: 0,
    lastMove: null,
    thinking: false,
    token: 0,            // 回合令牌：重来/退一步/回家/改设置 都会让旧的 AI 结果失效
    danger: emptyDanger(),
    myWinCells: [],
    bands: [],
    dangerAt: 0,
    pending: null,       // 再想想：暂停在这里的棋子
    pendingAt: 0,
    hint: null,
    hintUntil: 0,
    hover: null,
    dragId: null,
    anims: new Map(),    // 落子弹出动画开始时间
    lastHumanRed: false, // 小朋友上一步时是否显示过红色提醒
    lastHumanBlocked: false,
    result: null,
    session: { p1: 0, p2: 0 },
    tutStep: 0,
  };

  const inB = (r, c) => r >= 0 && r < S.size && c >= 0 && c < S.size;
  const hasCell = (list, r, c) => list.some((p) => p[0] === r && p[1] === c);
  const copyBoard = () => S.board.map((row) => row.slice());
  const dangerOn = () => Store.data.danger;
  const isHumanTurn = () => S.mode === 'family' || S.current === 1;
  const canAct = () => S.screen === 'game' && !S.gameOver && !S.thinking && isHumanTurn();

  // 头像 / 名字
  function avatarOf(p) {
    if (p === 1) return S.avatar;
    return S.mode === 'ai' ? LEVELS[S.level].emoji : FAMILY.emoji;
  }
  function nameOf(p) {
    if (p === 1) return '你';
    return S.mode === 'ai' ? LEVELS[S.level].name : FAMILY.name;
  }
  // 横幅里称呼对手：人机用名字，家人模式用头像
  function whoFor(p) {
    return S.mode === 'ai' ? (p === 1 ? '你' : LEVELS[S.level].name) : avatarOf(p) + ' ';
  }

  /* ============== 危险提醒计算 ============== */
  // 某方向上穿过 (r,c) 的同色连续段
  function runCells(b, r, c, dr, dc, p) {
    let sr = r, sc = c;
    while (inB(sr - dr, sc - dc) && b[sr - dr][sc - dc] === p) { sr -= dr; sc -= dc; }
    const out = [];
    for (let rr = sr, cc = sc; inB(rr, cc) && b[rr][cc] === p; rr += dr, cc += dc) out.push([rr, cc]);
    return out;
  }

  // 威胁连线（半透明色带），告诉孩子“为什么危险”
  // 色带只盖住对手已有的棋子；同一条线上重叠的色带合并成一条
  function computeBands(opp, kind, winList, fourList) {
    const b = copyBoard();
    const segs = [];
    // 线号 + 沿线坐标，便于合并
    const lineOf = (d, r, c) => (d === 0 ? r : d === 1 ? c : d === 2 ? r - c : r + c);
    const along = (d, r, c) => (d === 0 ? c : r);
    const cellAt = (d, line, t) => (d === 0 ? [line, t] : d === 1 ? [t, line] : d === 2 ? [t, t - line] : [t, line - t]);
    const addStones = (d, stones, color) => {
      if (stones.length < 2) return;
      const ts = stones.map(([r, c]) => along(d, r, c));
      const seg = { d, line: lineOf(d, stones[0][0], stones[0][1]), lo: Math.min(...ts), hi: Math.max(...ts), color };
      for (const s of segs) {
        if (s.d === seg.d && s.line === seg.line && s.color === seg.color && seg.lo <= s.hi + 1 && seg.hi >= s.lo - 1) {
          s.lo = Math.min(s.lo, seg.lo);
          s.hi = Math.max(s.hi, seg.hi);
          return;
        }
      }
      segs.push(seg);
    };
    if (kind === 'win') {
      for (const [r, c] of winList) {
        b[r][c] = opp;
        DIRS.forEach(([dr, dc], d) => {
          const run = runCells(b, r, c, dr, dc, opp);
          if (run.length >= 5) addStones(d, run.filter(([x, y]) => x !== r || y !== c), 'red');
        });
        b[r][c] = 0;
      }
    } else if (kind === 'three') {
      for (const [fr, fc] of fourList) {
        b[fr][fc] = opp;
        DIRS.forEach(([dr, dc], d) => {
          const stones = new Map();
          for (let s = -5; s <= 5; s++) {
            const wr = fr + dr * s, wc = fc + dc * s;
            if (!inB(wr, wc) || b[wr][wc] !== 0) continue;
            b[wr][wc] = opp;
            const run = runCells(b, wr, wc, dr, dc, opp);
            b[wr][wc] = 0;
            if (run.length >= 5 && hasCell(run, fr, fc)) {
              for (const [x, y] of run) {
                if ((x === fr && y === fc) || (x === wr && y === wc)) continue;
                stones.set(x * 100 + y, [x, y]);
              }
            }
          }
          addStones(d, [...stones.values()], 'orange');
        });
        b[fr][fc] = 0;
      }
    }
    // 同线合并后可能又能和别的合并，再合一遍
    for (let i = 0; i < segs.length; i++) {
      for (let j = i + 1; j < segs.length; j++) {
        const s = segs[i], q = segs[j];
        if (s.d === q.d && s.line === q.line && s.color === q.color && q.lo <= s.hi + 1 && q.hi >= s.lo - 1) {
          s.lo = Math.min(s.lo, q.lo);
          s.hi = Math.max(s.hi, q.hi);
          segs.splice(j, 1);
          j = i;
        }
      }
    }
    return segs.map((s) => ({ a: cellAt(s.d, s.line, s.lo), z: cellAt(s.d, s.line, s.hi), color: s.color }));
  }

  function clearDanger() {
    S.danger = emptyDanger();
    S.myWinCells = [];
    S.bands = [];
    S.pending = null;
  }

  // 每个人类回合开始时计算；withSound 表示“新出现”时播放提醒音
  function refreshDanger(withSound) {
    clearDanger();
    if (!dangerOn() || S.screen !== 'game' || S.gameOver || S.thinking || !isHumanTurn()) return;
    const me = S.current;
    const opp = me === 1 ? 2 : 1;
    let tOpp, tMe;
    try {
      tOpp = KidsAI.findThreats(copyBoard(), opp);
      tMe = KidsAI.findThreats(copyBoard(), me);
    } catch (e) {
      return;
    }
    const oppWin = (tOpp && tOpp.win) || [];
    const oppFour = (tOpp && tOpp.four) || [];
    const myWin = (tMe && tMe.win) || [];
    const kind = oppWin.length ? 'win' : oppFour.length ? 'three' : 'none';
    const who = whoFor(opp);
    let banner = '';
    if (myWin.length) banner = '✨ 你马上就能赢啦，找找看！';
    else if (kind === 'win') banner = oppWin.length >= 2 ? `⚠️ ${who}有两个地方能赢！` : `⚠️ ${who}快赢啦！堵住红圈！`;
    else if (kind === 'three') banner = `👀 注意！${who}连成3个了`;
    S.danger = {
      kind,
      oppWin: oppWin.map((p) => [p[0], p[1]]),
      oppFour: oppFour.map((p) => [p[0], p[1]]),
      myWin: myWin.length > 0,
      banner,
    };
    S.myWinCells = myWin.map((p) => [p[0], p[1]]);
    S.bands = computeBands(opp, kind, S.danger.oppWin, S.danger.oppFour);
    S.dangerAt = now();
    if (withSound) {
      if (kind === 'win') Sound.play('danger');
      else if (kind === 'three') Sound.play('three');
    }
  }

  /* ============== 对局流程 ============== */
  function startGame(mode, level, size) {
    S.mode = mode === 'family' ? 'family' : 'ai';
    S.level = Math.min(5, Math.max(1, Math.round(Number(level) || 1)));
    S.size = SIZES.includes(Number(size)) ? Number(size) : (Number(size) >= 5 ? Math.round(Number(size)) : Store.data.size);
    S.avatar = Store.data.avatar;
    S.session = { p1: 0, p2: 0 };
    newGame();
  }

  function newGame() {
    S.token++;
    S.board = Array.from({ length: S.size }, () => new Array(S.size).fill(0));
    S.current = 1;
    S.history = [];
    resetRoundState();
    hideOverlay('resultOv');
    showScreen('game');
    startTurn();
  }

  function resetRoundState() {
    S.gameOver = false;
    S.winner = null;
    S.winLine = null;
    S.lastMove = null;
    S.thinking = false;
    S.hint = null;
    S.hover = null;
    S.result = null;
    S.anims.clear();
    S.lastHumanRed = false;
    S.lastHumanBlocked = false;
    clearDanger();
  }

  // 回合开始：AI 回合开始思考；人类回合计算危险提醒
  function startTurn() {
    S.token++;
    S.thinking = false;
    clearDanger();
    if (!S.gameOver && S.screen === 'game') {
      if (S.mode === 'ai' && S.current === 2) beginAiThinking();
      else refreshDanger(true);
    }
    renderGame();
  }

  function beginAiThinking() {
    const token = S.token;
    S.thinking = true;
    S.hover = null;
    if (TEST) {
      applyAiMove(token, computeAiMove());
      return;
    }
    const total = 600 + Math.random() * 400;
    const t0 = now();
    setTimeout(() => {
      if (token !== S.token) return;
      const move = computeAiMove();
      const wait = Math.max(0, total - (now() - t0));
      setTimeout(() => applyAiMove(token, move), wait);
    }, 30);
  }

  function computeAiMove() {
    let mv = null;
    try { mv = KidsAI.findMove(copyBoard(), 2, S.level); } catch (e) { mv = null; }
    if (!mv || !inB(mv[0], mv[1]) || S.board[mv[0]][mv[1]] !== 0) {
      // 兜底：找一个空位
      mv = null;
      for (let r = 0; r < S.size && !mv; r++) {
        for (let c = 0; c < S.size; c++) if (S.board[r][c] === 0) { mv = [r, c]; break; }
      }
    }
    return mv;
  }

  function applyAiMove(token, mv) {
    // 过期的 AI 结果一律丢弃
    if (token !== S.token || S.screen !== 'game' || S.gameOver || S.mode !== 'ai' || S.current !== 2) return;
    S.thinking = false;
    if (!mv || S.board[mv[0]][mv[1]] !== 0) {
      finishGame(0, null);
      return;
    }
    placeStone(mv[0], mv[1]);
  }

  function placeStone(r, c) {
    const p = S.current;
    if (isHumanTurn()) {
      S.lastHumanRed = S.danger.kind === 'win';
      S.lastHumanBlocked = S.lastHumanRed && hasCell(S.danger.oppWin, r, c);
    }
    S.board[r][c] = p;
    S.history.push({ r, c, p });
    S.lastMove = [r, c];
    if (!TEST) S.anims.set(r * S.size + c, now());
    S.hint = null;
    S.hover = null;
    clearDanger();
    Sound.play('pop', p);
    let line = null;
    try { line = KidsAI.getWinLine(copyBoard(), r, c, p); } catch (e) { line = null; }
    if (line && line.length >= 5) {
      finishGame(p, line);
      return;
    }
    if (S.history.length >= S.size * S.size || !S.board.some((row) => row.includes(0))) {
      finishGame(0, null);
      return;
    }
    S.current = p === 1 ? 2 : 1;
    startTurn();
  }

  function finishGame(winner, line) {
    S.token++;
    S.gameOver = true;
    S.thinking = false;
    S.winner = winner;
    S.winLine = line;
    S.winAt = now();
    clearDanger();
    const res = { kind: 'draw', tip: false, suggest: 0, star: false };
    if (S.mode === 'ai') {
      const st = Store.data.streak[S.level];
      if (winner === 1) {
        res.kind = 'win';
        res.star = true;
        Store.data.stars++;
        Store.data.wins[S.level]++;
        st.w++;
        st.l = 0;
        if (st.w >= 3 && S.level < 5) res.suggest = S.level + 1;
      } else if (winner === 2) {
        res.kind = 'lose';
        st.l++;
        st.w = 0;
        res.tip = S.lastHumanRed && !S.lastHumanBlocked;
        if (st.l >= 2 && S.level > 1) res.suggest = S.level - 1;
      } else {
        st.w = 0;
        st.l = 0;
      }
      Store.save();
    } else {
      res.kind = winner ? 'family' : 'draw';
    }
    if (winner === 1) S.session.p1++;
    else if (winner === 2) S.session.p2++;
    S.result = res;
    renderGame();
    const token = S.token;
    if (TEST) showResult();
    else setTimeout(() => { if (token === S.token && S.gameOver) showResult(); }, winner ? 1500 : 700);
  }

  // 人类松手 / 点击：唯一的落子入口（含“再想想”）
  function humanRelease(r, c) {
    if (!canAct()) return 'ignored';
    r = Number(r);
    c = Number(c);
    if (!Number.isInteger(r) || !Number.isInteger(c) || !inB(r, c) || S.board[r][c] !== 0) return 'ignored';
    const d = S.danger;
    if (d.kind === 'win') {
      const blocks = hasCell(d.oppWin, r, c);
      const wins = hasCell(S.myWinCells, r, c);
      const confirmed = S.pending && S.pending[0] === r && S.pending[1] === c;
      if (!blocks && !wins && !confirmed) {
        S.pending = [r, c];
        S.pendingAt = now();
        Sound.play('boop');
        renderGame();
        return 'pending';
      }
    }
    placeStone(r, c);
    return 'placed';
  }

  function undo() {
    if (S.screen !== 'game') return;
    const h = S.history;
    const popOne = () => {
      const m = h.pop();
      S.board[m.r][m.c] = 0;
      S.anims.delete(m.r * S.size + m.c);
      return m;
    };
    if (S.mode === 'ai') {
      if (!h.some((m) => m.p === 1)) return;
      while (h.length && h[h.length - 1].p === 2) popOne();
      if (h.length && h[h.length - 1].p === 1) popOne();
      S.current = 1;
    } else {
      if (!h.length) return;
      S.current = popOne().p;
    }
    hideOverlay('resultOv');
    resetRoundState();
    S.lastMove = h.length ? [h[h.length - 1].r, h[h.length - 1].c] : null;
    startTurn();
  }

  function restart() {
    if (S.screen !== 'game') return;
    newGame();
  }

  function goHome() {
    S.token++;
    S.thinking = false;
    S.hover = null;
    clearDanger();
    hideOverlay('resultOv');
    showScreen('menu');
  }

  function loadPosition(board, current) {
    if (!Array.isArray(board) || !board.length) return;
    const n = board.length;
    S.size = n;
    S.board = board.map((row) => Array.from({ length: n }, (_, i) => (row[i] === 1 || row[i] === 2 ? row[i] : 0)));
    S.current = current === 2 ? 2 : 1;
    S.history = [];
    S.token++;
    resetRoundState();
    hideOverlay('resultOv');
    if (S.screen !== 'game') showScreen('game');
    else layout();
    startTurn();
  }

  function showHint() {
    if (!canAct()) return;
    let h = null;
    try { h = KidsAI.findHint(copyBoard(), S.current); } catch (e) { h = null; }
    if (!h || !inB(h[0], h[1]) || S.board[h[0]][h[1]] !== 0) return;
    S.hint = [h[0], h[1]];
    S.hintUntil = now() + 3000;
    Sound.play('ding');
    renderGame();
  }

  // 设置项：与设置面板开关同一路径
  function setOption(name, value) {
    const v = !!value && value !== '0';
    if (name === 'danger') Store.data.danger = v;
    else if (name === 'picAnimals') {
      Store.data.picAnimals = v;
      Emo.refresh();
      spriteCache.clear();
      redrawEmoji();
    } else if (name === 'sound') {
      Store.data.sound = v;
      if (v) Sound.unlock();
    } else return;
    Store.save();
    // 设置改变：作废旧 AI 计时并重新开始当前回合
    if (S.screen === 'game' && !S.gameOver) startTurn();
    renderSettings();
    renderMenu();
  }

  function getState() {
    const d = S.danger;
    return {
      screen: S.screen,
      mode: S.mode,
      level: S.level,
      size: S.size,
      board: copyBoard(),
      current: S.current,
      gameOver: S.gameOver,
      winner: S.winner,
      historyLength: S.history.length,
      thinking: S.thinking,
      stars: Store.data.stars,
      danger: {
        kind: d.kind,
        oppWin: d.oppWin.map((p) => p.slice()),
        oppFour: d.oppFour.map((p) => p.slice()),
        myWin: d.myWin,
        banner: d.banner,
        pending: S.pending ? S.pending.slice() : null,
        bubble: S.pending ? bubbleText().join('') : '',
        bands: S.bands.map((b) => ({ a: b.a.slice(), z: b.z.slice(), color: b.color })),
      },
      hint: S.hint ? S.hint.slice() : null,
      winLine: S.winLine ? S.winLine.map((p) => p.slice()) : null,
      lastMove: S.lastMove ? S.lastMove.slice() : null,
      result: S.result ? Object.assign({}, S.result) : null,
      overlay: ['tutOv', 'resultOv', 'setOv'].filter((id) => $(id).classList.contains('show')),
      avatar: S.avatar,
      session: Object.assign({}, S.session),
      hover: S.hover ? S.hover.slice() : null,
      layout: $('game').classList.contains('land') ? 'landscape' : 'portrait',
      emojiImages: Emo.useImg(),
      geom: boardGeom(),
    };
  }

  // 测试用：棋盘在页面上的位置（CSS 像素）
  function boardGeom() {
    if (!canvas || S.screen !== 'game') return null;
    const rect = canvas.getBoundingClientRect();
    const k = rect.width / (G.side || 1);
    return { left: rect.left, top: rect.top, side: rect.width, cell: G.cell * k, margin: G.m * G.cell * k };
  }

  function bubbleText() {
    const opp = S.current === 1 ? 2 : 1;
    return [`🤔 ${whoFor(opp)}要赢啦！`, '先堵红圈？'];
  }

  /* ============== 棋盘绘制（Canvas） ============== */
  const $ = (id) => document.getElementById(id);
  const TAU = Math.PI * 2;
  let canvas = null;
  let ctx = null;
  const G = { side: 0, n: 11, m: 0.8, cell: 10, dpr: 1 };
  let boardCache = null;
  const spriteCache = new Map();
  let rafId = 0;

  const pos = (i) => (G.m + i) * G.cell;
  const wave = (t, period) => (Math.sin(t / period) + 1) / 2;

  // 计算竖屏 / 横屏布局，棋盘尽量大且整页不滚动
  function layout() {
    if (S.screen !== 'game' || !canvas) return;
    const gEl = $('game');
    const cs = getComputedStyle(gEl);
    const W = gEl.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const H = gEl.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const land = W > H * 1.08 && W >= 640 && H >= 420;
    gEl.classList.toggle('land', land);
    gEl.classList.toggle('port', !land);
    let side;
    if (land) {
      const panel = Math.round(Math.max(280, Math.min(400, W * 0.3)));
      gEl.style.setProperty('--panel', panel + 'px');
      side = Math.min(H - 12, W - panel - 20);
    } else {
      const col = Math.floor(Math.min(W, 900));
      gEl.style.setProperty('--col', col + 'px');
      const used = $('topbar').offsetHeight + $('bannerSlot').offsetHeight + $('controls').offsetHeight + 10 * 3 + 22;
      side = Math.min(col, H - used);
    }
    side = Math.max(180, Math.floor(side));
    gEl.style.setProperty('--side', side + 'px');
    sizeCanvas(side);
  }

  function sizeCanvas(side) {
    const dpr = Math.min(3, Math.max(1, window.devicePixelRatio || 1));
    const n = S.size;
    if (G.side === side && G.dpr === dpr && G.n === n && boardCache) { draw(); return; }
    G.side = side;
    G.dpr = dpr;
    G.n = n;
    G.cell = side / (n - 1 + G.m * 2);
    const radius = Math.round(Math.max(14, Math.min(28, side * 0.035)));
    canvas.style.width = side + 'px';
    canvas.style.height = side + 'px';
    canvas.style.borderRadius = radius + 'px';
    $('boardWrap').style.borderRadius = radius + 'px';
    canvas.width = Math.round(side * dpr);
    canvas.height = Math.round(side * dpr);
    spriteCache.clear();
    buildBoardCache(radius);
    draw();
  }

  function starPoints(n) {
    if (n === 15) return [[3, 3], [3, 11], [11, 3], [11, 11], [7, 7]];
    if (n === 11) return [[2, 2], [2, 8], [8, 2], [8, 8], [5, 5]];
    if (n === 9) return [[2, 2], [2, 6], [6, 2], [6, 6], [4, 4]];
    const e = n >= 13 ? 3 : 2;
    const pts = [[e, e], [e, n - 1 - e], [n - 1 - e, e], [n - 1 - e, n - 1 - e]];
    if (n % 2 === 1) pts.push([(n - 1) / 2, (n - 1) / 2]);
    return pts;
  }

  // 静态木板 + 网格缓存
  function buildBoardCache(radius) {
    const cv = document.createElement('canvas');
    cv.width = canvas.width;
    cv.height = canvas.height;
    const x = cv.getContext('2d');
    x.scale(G.dpr, G.dpr);
    const s = G.side;
    const cell = G.cell;
    const n = G.n;
    const g = x.createLinearGradient(0, 0, s, s);
    g.addColorStop(0, '#fce9c2');
    g.addColorStop(1, '#f3d49e');
    x.fillStyle = g;
    x.fillRect(0, 0, s, s);
    // 柔和木纹
    x.save();
    x.strokeStyle = '#c99452';
    for (let i = 0; i < 16; i++) {
      const y = (s * (i + 0.5)) / 16;
      x.globalAlpha = 0.05 + (i % 3) * 0.02;
      x.lineWidth = 1 + (i % 4);
      x.beginPath();
      x.moveTo(-10, y);
      x.bezierCurveTo(s * 0.3, y + ((i % 2) ? 8 : -8), s * 0.6, y + ((i % 3) - 1) * 10, s + 10, y + ((i % 2) ? -4 : 5));
      x.stroke();
    }
    x.restore();
    // 内侧高光边
    x.strokeStyle = 'rgba(255, 255, 255, 0.6)';
    x.lineWidth = 3;
    x.beginPath();
    if (x.roundRect) x.roundRect(3, 3, s - 6, s - 6, Math.max(4, radius - 3));
    else x.rect(3, 3, s - 6, s - 6);
    x.stroke();
    // 网格
    const a = pos(0);
    const b = pos(n - 1);
    x.strokeStyle = 'rgba(160, 112, 62, 0.55)';
    x.lineWidth = Math.max(1, cell * 0.035);
    x.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const p = pos(i);
      x.beginPath();
      x.moveTo(a, p);
      x.lineTo(b, p);
      x.moveTo(p, a);
      x.lineTo(p, b);
      x.stroke();
    }
    x.strokeStyle = 'rgba(160, 112, 62, 0.7)';
    x.lineWidth = Math.max(1.5, cell * 0.055);
    x.strokeRect(a, a, b - a, b - a);
    // 星位
    x.fillStyle = 'rgba(150, 100, 55, 0.75)';
    for (const [r, c] of starPoints(n)) {
      x.beginPath();
      x.arc(pos(c), pos(r), Math.max(2.5, cell * 0.085), 0, TAU);
      x.fill();
    }
    boardCache = cv;
  }

  // 棋子贴图缓存：彩色底 + 描边 + 头像 emoji
  function sprite(p, emoji, d) {
    const key = p + '|' + emoji + '|' + d.toFixed(2) + '|' + G.dpr + '|' + (Emo.has(emoji) ? 'img' : 'txt');
    let s = spriteCache.get(key);
    if (s) return s;
    const pad = Math.ceil(d * 0.14);
    const css = d + pad * 2;
    const cv = document.createElement('canvas');
    cv.width = cv.height = Math.ceil(css * G.dpr);
    const x = cv.getContext('2d');
    x.scale(cv.width / css, cv.height / css);
    const cx = css / 2;
    const cy = css / 2;
    const R = d / 2;
    const bg = p === 1 ? '#ffd6e5' : '#d4ecff';
    const edge = p === 1 ? '#ffc0d7' : '#b9e0ff';
    const border = p === 1 ? '#ff8fb8' : '#6bbfff';
    // 投影
    x.beginPath();
    x.arc(cx, cy + R * 0.12, R * 0.98, 0, TAU);
    x.fillStyle = 'rgba(120, 80, 40, 0.24)';
    x.fill();
    // 底色
    const gr = x.createRadialGradient(cx - R * 0.35, cy - R * 0.4, R * 0.08, cx, cy, R);
    gr.addColorStop(0, '#ffffff');
    gr.addColorStop(0.45, bg);
    gr.addColorStop(1, edge);
    x.beginPath();
    x.arc(cx, cy, R, 0, TAU);
    x.fillStyle = gr;
    x.fill();
    // 描边
    const lw = Math.max(1.5, R * 0.13);
    x.beginPath();
    x.arc(cx, cy, R - lw / 2, 0, TAU);
    x.lineWidth = lw;
    x.strokeStyle = border;
    x.stroke();
    // 头像 emoji（约为直径的 72%）
    if (!Emo.draw(x, emoji, cx, cy, d * 0.7)) {
      if (Emo.has(emoji)) return { cv, css }; // 图片还没加载好：先不缓存，加载完再画
      let fs = d * 0.6;
      x.font = fs + 'px ' + EMOJI_FONT;
      const mw = x.measureText(emoji).width;
      if (mw > 0) fs = Math.min(d * 0.8, (fs * d * 0.72) / mw);
      x.font = fs + 'px ' + EMOJI_FONT;
      x.textAlign = 'center';
      x.textBaseline = 'middle';
      x.fillText(emoji, cx, cy + d * 0.035);
    }
    s = { cv, css };
    spriteCache.set(key, s);
    return s;
  }

  function drawStone(p, emoji, x, y, scale, alpha) {
    const s = sprite(p, emoji, G.cell * 0.9);
    const w = s.css * scale;
    ctx.globalAlpha = alpha;
    ctx.drawImage(s.cv, x - w / 2, y - w / 2, w, w);
    ctx.globalAlpha = 1;
  }

  function circle(x, y, R) {
    ctx.beginPath();
    ctx.arc(x, y, Math.max(0.5, R), 0, TAU);
  }

  // 胶囊形色带路径
  function capsule(x1, y1, x2, y2, h) {
    const ang = Math.atan2(y2 - y1, x2 - x1);
    const len = Math.hypot(x2 - x1, y2 - y1);
    ctx.save();
    ctx.translate(x1, y1);
    ctx.rotate(ang);
    ctx.beginPath();
    ctx.arc(0, 0, h, Math.PI / 2, Math.PI * 1.5);
    ctx.lineTo(len, -h);
    ctx.arc(len, 0, h, -Math.PI / 2, Math.PI / 2);
    ctx.closePath();
    ctx.restore();
  }

  const easeOutBack = (e) => {
    const c1 = 1.9;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(e - 1, 3) + c1 * Math.pow(e - 1, 2);
  };

  function draw() {
    if (!ctx || !G.side || !boardCache || !S.board.length) return;
    const t = now();
    ctx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
    ctx.clearRect(0, 0, G.side, G.side);
    ctx.drawImage(boardCache, 0, 0, G.side, G.side);
    if (S.winLine) drawWinGlow(t);
    if (S.hint) drawHint(t);
    drawBands(t, true);
    drawStones(t);
    drawBands(t, false);
    drawLastMark(t);
    drawOrangeRings(t);
    drawRedRings(t);
    drawGhosts(t);
  }

  function drawWinGlow(t) {
    const L = S.winLine;
    const a = L[0];
    const z = L[L.length - 1];
    const k = wave(t, 220);
    capsule(pos(a[1]), pos(a[0]), pos(z[1]), pos(z[0]), G.cell * (0.56 + 0.06 * k));
    ctx.fillStyle = `rgba(255, 214, 64, ${0.45 + 0.25 * k})`;
    ctx.fill();
    ctx.lineWidth = Math.max(2, G.cell * 0.06);
    ctx.strokeStyle = 'rgba(255, 180, 20, 0.9)';
    ctx.stroke();
  }

  function drawStones(t) {
    const n = S.size;
    let winIdx = null;
    if (S.winLine) {
      winIdx = new Map();
      S.winLine.forEach((p, i) => winIdx.set(p[0] * n + p[1], i));
    }
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        const p = S.board[r][c];
        if (!p) continue;
        const k = r * n + c;
        let scale = 1;
        const a0 = S.anims.get(k);
        if (a0 !== undefined) {
          const e = (t - a0) / 220;
          if (e >= 1) S.anims.delete(k);
          else scale = Math.max(0.2, easeOutBack(Math.max(0, e)));
        }
        let dy = 0;
        if (winIdx && winIdx.has(k)) {
          dy = -Math.abs(Math.sin((t - S.winAt) / 230 + winIdx.get(k) * 0.6)) * G.cell * 0.18;
        }
        drawStone(p, avatarOf(p), pos(c), pos(r) + dy, scale, 1);
      }
    }
  }

  // 威胁色带：底色画在棋子下面（棋子颜色不被染），描边画在棋子上面
  function drawBands(t, under) {
    if (!S.bands.length) return;
    const k = wave(t, 260);
    for (const b of S.bands) {
      capsule(pos(b.a[1]), pos(b.a[0]), pos(b.z[1]), pos(b.z[0]), G.cell * 0.52);
      const red = b.color === 'red';
      if (under) {
        ctx.fillStyle = red ? `rgba(255, 60, 85, ${0.3 + 0.14 * k})` : `rgba(255, 150, 30, ${0.24 + 0.1 * k})`;
        ctx.fill();
      } else {
        ctx.lineWidth = Math.max(2.5, G.cell * (red ? 0.065 : 0.05));
        ctx.strokeStyle = red ? 'rgba(255, 45, 70, 0.9)' : 'rgba(255, 140, 0, 0.85)';
        ctx.stroke();
      }
    }
  }

  function drawLastMark(t) {
    if (!S.lastMove || S.gameOver) return;
    const [r, c] = S.lastMove;
    if (!S.board[r] || !S.board[r][c]) return;
    const k = wave(t, 380);
    circle(pos(c), pos(r), G.cell * (0.5 + 0.03 * k));
    ctx.lineWidth = Math.max(2, G.cell * 0.05);
    ctx.strokeStyle = `rgba(255, 255, 255, ${0.55 + 0.45 * k})`;
    ctx.stroke();
  }

  function drawHint(t) {
    const [r, c] = S.hint;
    if (S.board[r][c]) { S.hint = null; return; }
    const x = pos(c);
    const y = pos(r);
    const k = wave(t, 170);
    const R = G.cell * (0.4 + 0.1 * k);
    const gl = ctx.createRadialGradient(x, y, R * 0.2, x, y, R * 1.6);
    gl.addColorStop(0, 'rgba(255, 240, 120, 0.95)');
    gl.addColorStop(0.55, 'rgba(255, 220, 60, 0.55)');
    gl.addColorStop(1, 'rgba(255, 220, 60, 0)');
    ctx.fillStyle = gl;
    circle(x, y, R * 1.6);
    ctx.fill();
    circle(x, y, R);
    ctx.lineWidth = Math.max(2.5, G.cell * 0.07);
    ctx.strokeStyle = '#ffbf00';
    ctx.stroke();
    if (Emo.useImg()) {
      sparkle(x + R * 0.85, y - R * 0.85, G.cell * 0.2);
    } else {
      ctx.font = G.cell * 0.4 + 'px ' + EMOJI_FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('✨', x + R * 0.85, y - R * 0.85);
    }
  }

  // 金色四角星（备用图片模式下代替 ✨ emoji）
  function sparkle(cx, cy, R) {
    ctx.beginPath();
    for (let k = 0; k < 8; k++) {
      const r = k % 2 ? R * 0.32 : R;
      const a = -Math.PI / 2 + (k * Math.PI) / 4;
      ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
    }
    ctx.closePath();
    ctx.fillStyle = '#ffc21a';
    ctx.fill();
  }

  function drawOrangeRings(t) {
    if (S.danger.kind !== 'three' || !dangerOn()) return;
    const k = wave(t, 300);
    const R = G.cell * (0.45 + 0.05 * k);
    const lw = Math.max(3, Math.min(7, G.cell * 0.09));
    for (const [r, c] of S.danger.oppFour) {
      const x = pos(c);
      const y = pos(r);
      circle(x, y, R);
      ctx.fillStyle = 'rgba(255, 160, 40, 0.2)';
      ctx.fill();
      ctx.lineWidth = lw + 3;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.stroke();
      ctx.setLineDash([G.cell * 0.2, G.cell * 0.12]);
      ctx.lineDashOffset = -t / 40;
      ctx.lineWidth = lw;
      ctx.strokeStyle = '#ff8a00';
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.lineDashOffset = 0;
    }
  }

  function drawRedRings(t) {
    if (S.danger.kind !== 'win' || !dangerOn()) return;
    const pend = !!S.pending;
    const k = wave(t, pend ? 110 : 210);
    const R = G.cell * (pend ? 0.54 + 0.14 * k : 0.52 + 0.07 * k);
    const lw = Math.max(4, Math.min(10, G.cell * 0.13));
    const since = t - S.pendingAt;
    const wig = pend && since < 900 ? Math.sin(since / 28) * G.cell * 0.12 * (1 - since / 900) : 0;
    const ping = (((t - S.dangerAt) % 1500) + 1500) % 1500 / 1500; // 向外扩散的波纹 0..1
    for (const [r, c] of S.danger.oppWin) {
      const x = pos(c) + wig;
      const y = pos(r);
      // 外发光
      const gl = ctx.createRadialGradient(x, y, R * 0.8, x, y, R * 1.6);
      gl.addColorStop(0, 'rgba(255, 50, 75, 0.35)');
      gl.addColorStop(1, 'rgba(255, 50, 75, 0)');
      ctx.fillStyle = gl;
      circle(x, y, R * 1.6);
      ctx.fill();
      // 扩散波纹（像雷达一样吸引注意）
      circle(x, y, R * (1.05 + ping * 0.75));
      ctx.lineWidth = Math.max(1.5, lw * 0.7 * (1 - ping));
      ctx.strokeStyle = `rgba(255, 45, 70, ${0.7 * (1 - ping)})`;
      ctx.stroke();
      // 圈内保持浅色，看起来是“空位”
      circle(x, y, R);
      ctx.fillStyle = 'rgba(255, 244, 246, 0.72)';
      ctx.fill();
      ctx.fillStyle = `rgba(255, 70, 95, ${0.16 + 0.1 * k})`;
      ctx.fill();
      ctx.lineWidth = lw + 6;
      ctx.strokeStyle = '#fff';
      ctx.stroke();
      ctx.lineWidth = lw;
      ctx.strokeStyle = '#ff2d47';
      ctx.stroke();
      // 中心小红点：点这里
      circle(x, y, G.cell * 0.1);
      ctx.fillStyle = '#ff2d47';
      ctx.fill();
    }
  }

  function drawGhosts(t) {
    if (S.gameOver || S.thinking || !isHumanTurn()) return;
    const p = S.current;
    if (S.pending) {
      const [r, c] = S.pending;
      const x = pos(c);
      const y = pos(r) + Math.sin(t / 180) * G.cell * 0.05;
      drawStone(p, avatarOf(p), x, y, 1, 0.62);
      circle(x, y, G.cell * 0.54);
      ctx.setLineDash([G.cell * 0.13, G.cell * 0.09]);
      ctx.lineDashOffset = -t / 30;
      ctx.lineWidth = Math.max(2, G.cell * 0.05);
      ctx.strokeStyle = 'rgba(110, 75, 50, 0.85)';
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.lineDashOffset = 0;
      // 小问号
      const bx = x + G.cell * 0.42;
      const by = y - G.cell * 0.42;
      circle(bx, by, G.cell * 0.2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.lineWidth = Math.max(1.5, G.cell * 0.035);
      ctx.strokeStyle = '#ff5c6c';
      ctx.stroke();
      ctx.fillStyle = '#ff3b52';
      ctx.font = `900 ${G.cell * 0.28}px "PingFang SC", "Microsoft YaHei", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('?', bx, by + G.cell * 0.01);
    }
    if (S.hover && S.screen === 'game') {
      const [r, c] = S.hover;
      if (S.board[r][c] || (S.pending && S.pending[0] === r && S.pending[1] === c)) return;
      drawStone(p, avatarOf(p), pos(c), pos(r), 1, 0.5);
    }
  }

  function loop() {
    rafId = 0;
    if (S.screen !== 'game') return;
    if (S.hint && now() > S.hintUntil) {
      S.hint = null;
      renderStatus();
    }
    draw();
    rafId = requestAnimationFrame(loop);
  }

  function startLoop() {
    if (!rafId) rafId = requestAnimationFrame(loop);
  }

  /* ============== 游戏页 DOM 刷新 ============== */
  function mk(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function renderGame() {
    if (!canvas) return;
    renderPlayers();
    renderStatus();
    renderBanner();
    renderControls();
    draw();
  }

  function renderPlayers() {
    Emo.text($('av1'), avatarOf(1));
    Emo.text($('av2'), avatarOf(2));
    $('nm1').textContent = nameOf(1);
    $('nm2').textContent = nameOf(2);
    // 名字下面的小字：人机显示难度爪印，家人模式显示“一起玩”
    const sub1 = S.mode === 'ai' ? `⭐ ${Store.data.stars}` : '加油！';
    const sub2 = S.mode === 'ai' ? '🐾'.repeat(S.level) : '加油！';
    if ($('sub1').textContent !== sub1) $('sub1').textContent = sub1;
    if ($('sub2').textContent !== sub2) $('sub2').textContent = sub2;
    $('sub2').classList.toggle('paws', S.mode === 'ai');
    $('pc1').classList.toggle('active', !S.gameOver && S.current === 1);
    $('pc2').classList.toggle('active', !S.gameOver && S.current === 2);
    $('score').textContent = `${S.session.p1} : ${S.session.p2}`;
  }

  function renderStatus() {
    let txt;
    const opp = LEVELS[S.level];
    if (S.gameOver) {
      if (S.winner === 0) txt = '🤝 平局！';
      else if (S.mode === 'ai') txt = S.winner === 1 ? '🎉 你赢啦！' : `${opp.emoji} ${opp.name}赢了这局`;
      else txt = `🎉 ${avatarOf(S.winner)} 赢啦！`;
    } else if (S.thinking) {
      txt = `🤔 ${opp.name}在想…`;
    } else if (S.hint && now() < S.hintUntil) {
      txt = '💡 试试这里';
    } else if (S.mode === 'ai') {
      txt = '轮到你啦！';
    } else {
      txt = `轮到 ${avatarOf(S.current)} 啦！`;
    }
    Emo.text($('status'), txt);
  }

  let bannerKey = '';
  function renderBanner() {
    const el = $('banner');
    let cls = 'none';
    let main = ['🍀 连成5个就赢啦！'];
    let small = '';
    if (S.screen === 'game' && !S.gameOver && !S.thinking && isHumanTurn() && dangerOn()) {
      const d = S.danger;
      const who = whoFor(S.current === 1 ? 2 : 1);
      if (S.pending) {
        cls = 'bubble';
        main = bubbleText();
        small = '再点一次这里就放下';
      } else if (d.myWin) {
        cls = 'gold';
        main = ['✨ 你马上就能赢啦，', '找找看！'];
      } else if (d.kind === 'win') {
        cls = 'red';
        if (d.oppWin.length >= 2) {
          main = [`⚠️ ${who}有两个`, '地方能赢！'];
          small = '快堵住一个红圈！';
        } else {
          main = [`⚠️ ${who}快赢啦！`, '堵住红圈！'];
        }
      } else if (d.kind === 'three') {
        cls = 'orange';
        main = ['👀 注意！', `${who}连成3个了`];
        small = '看看橙色圈哦';
      }
    }
    const key = cls + '|' + main.join('') + '|' + small + '|' + (S.pending ? S.pending.join(',') : '');
    if (key === bannerKey) return;
    bannerKey = key;
    el.className = 'banner';
    void el.offsetWidth; // 重新触发动画
    el.className = 'banner ' + cls;
    el.textContent = '';
    const m = mk('span', 'b-main');
    main.forEach((part) => { const s = mk('span', ''); Emo.text(s, part); m.appendChild(s); });
    el.appendChild(m);
    if (small) { const s = mk('span', 'b-small'); Emo.text(s, small); el.appendChild(s); }
    el.dataset.kind = cls;
  }

  function renderControls() {
    const act = canAct();
    $('btnHint').disabled = !act;
    const canUndo = S.mode === 'ai' ? S.history.some((m) => m.p === 1) : S.history.length > 0;
    $('btnUndo').disabled = !canUndo;
    canvas.classList.toggle('wait', !act);
  }

  /* ============== 屏幕与弹层 ============== */
  function showScreen(name) {
    S.screen = name;
    $('menu').classList.toggle('show', name === 'menu');
    $('game').classList.toggle('show', name === 'game');
    if (name === 'game') {
      layout();
      startLoop();
    } else {
      renderMenu();
    }
  }

  function showOverlay(id) { $(id).classList.add('show'); }
  function hideOverlay(id) { $(id).classList.remove('show'); }

  /* ============== 菜单 ============== */
  function buildMenu() {
    const cards = $('cards');
    for (let l = 1; l <= 5; l++) {
      const L = LEVELS[l];
      const b = mk('button', 'card');
      b.dataset.level = l;
      b.style.setProperty('--bg', L.bg);
      b.style.setProperty('--shade', L.shade);
      const ce = mk('div', 'c-emo');
      Emo.text(ce, L.emoji);
      b.appendChild(ce);
      b.appendChild(mk('div', 'c-name', L.name));
      b.appendChild(mk('div', 'c-tag', L.tag));
      const paws = mk('div', 'c-paws');
      for (let i = 1; i <= 5; i++) paws.appendChild(mk('span', i <= l ? '' : 'off', '🐾'));
      b.appendChild(paws);
      b.appendChild(mk('div', 'c-wins', '⭐×0'));
      b.addEventListener('click', () => startGame('ai', l, Store.data.size));
      cards.appendChild(b);
    }
    const f = mk('button', 'card family');
    f.style.setProperty('--bg', '#e2f6e8');
    f.style.setProperty('--shade', '#9fd8b1');
    f.appendChild(mk('div', 'c-emo', '👨‍👩‍👧'));
    f.appendChild(mk('div', 'c-name', '和家人一起玩'));
    f.appendChild(mk('div', 'c-tag', '两个人轮流下'));
    f.appendChild(mk('div', 'c-wins c-vs', '🐼 🆚 🐯'));
    f.addEventListener('click', () => startGame('family', 1, Store.data.size));
    cards.appendChild(f);

    const ac = $('avatarChips');
    AVATARS.forEach((a) => {
      const b = mk('button', 'chip emo-chip');
      Emo.text(b, a);
      b.dataset.avatar = a;
      b.setAttribute('aria-label', a);
      b.addEventListener('click', () => {
        Store.data.avatar = a;
        Store.save();
        renderMenu();
      });
      ac.appendChild(b);
    });
    const sc = $('sizeChips');
    SIZES.forEach((n) => {
      const b = mk('button', 'chip', SIZE_LABEL[n]);
      b.dataset.size = n;
      b.addEventListener('click', () => {
        Store.data.size = n;
        Store.save();
        renderMenu();
      });
      sc.appendChild(b);
    });
  }

  let menuStars = null;
  function renderMenu() {
    $('starNum').textContent = Store.data.stars;
    // 回到菜单时星星变多：跳一下
    if (S.screen === 'menu') {
      const st = $('starTotal');
      if (menuStars !== null && Store.data.stars > menuStars) {
        st.classList.remove('bump');
        void st.offsetWidth;
        st.classList.add('bump');
      }
      menuStars = Store.data.stars;
    }
    document.querySelectorAll('#cards .card[data-level]').forEach((b) => {
      b.querySelector('.c-wins').textContent = '⭐×' + Store.data.wins[b.dataset.level];
    });
    const vs = document.querySelector('#cards .c-vs');
    if (vs) Emo.text(vs, `${Store.data.avatar} 🆚 🐯`);
    document.querySelectorAll('#avatarChips .chip').forEach((b) => b.classList.toggle('on', b.dataset.avatar === Store.data.avatar));
    document.querySelectorAll('#sizeChips .chip').forEach((b) => b.classList.toggle('on', Number(b.dataset.size) === Store.data.size));
    $('btnSound').textContent = Store.data.sound ? '🔊 有声音' : '🔇 没声音';
  }

  /* ============== 教程 ============== */
  // 小棋盘插图：items = [{r, c, t: 'p'|'b'|'ghost'|'ring'|'win'}]
  function miniBoard(n, cellPx, items, bands, hand) {
    const wrap = mk('div', 'mini');
    wrap.style.setProperty('--n', n);
    wrap.style.setProperty('--c', cellPx + 'px');
    wrap.appendChild(mk('div', 'grid'));
    const byKey = new Map(items.map((it) => [it.r * n + it.c, it]));
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        const cellEl = mk('div', 'mc');
        const it = byKey.get(r * n + c);
        if (it) {
          if (it.t === 'ring') cellEl.appendChild(mk('div', 'mring'));
          else {
            const cls = 'ms' + (it.t === 'b' ? ' b' : '') + (it.t === 'ghost' ? ' ghost' : '') + (it.win ? ' win' : '');
            const st = mk('div', cls);
            Emo.text(st, it.t === 'b' ? '🐻' : S.avatar || Store.data.avatar);
            cellEl.appendChild(st);
          }
        }
        wrap.appendChild(cellEl);
      }
    }
    (bands || []).forEach(([r1, c1, r2, c2, gold]) => {
      const x1 = 8 + (c1 + 0.5) * cellPx;
      const y1 = 8 + (r1 + 0.5) * cellPx;
      const x2 = 8 + (c2 + 0.5) * cellPx;
      const y2 = 8 + (r2 + 0.5) * cellPx;
      const len = Math.hypot(x2 - x1, y2 - y1) + cellPx * 0.95;
      const h = cellPx * 0.95;
      const band = mk('div', 'mband' + (gold ? ' mgold' : ''));
      band.style.width = len + 'px';
      band.style.height = h + 'px';
      band.style.left = (x1 + x2) / 2 - len / 2 + 'px';
      band.style.top = (y1 + y2) / 2 - h / 2 + 'px';
      band.style.transform = `rotate(${Math.atan2(y2 - y1, x2 - x1)}rad)`;
      wrap.appendChild(band);
    });
    if (hand) {
      const hd = mk('div', 'mhand', '👆');
      hd.style.left = 8 + (hand[1] + 0.45) * cellPx + 'px';
      hd.style.top = 8 + (hand[0] + 0.75) * cellPx + 'px';
      wrap.appendChild(hd);
    }
    return wrap;
  }

  function buildTutorialArt() {
    S.avatar = S.screen === 'game' ? S.avatar : Store.data.avatar;
    const a0 = $('tutArt0');
    a0.textContent = '';
    a0.appendChild(miniBoard(5, 52, [
      { r: 2, c: 2, t: 'p' }, { r: 1, c: 2, t: 'b' }, { r: 2, c: 1, t: 'p' }, { r: 3, c: 3, t: 'b' }, { r: 2, c: 3, t: 'ghost' },
    ], [], [2, 3]));
    const row = mk('div', 'turn-row');
    const face = (e) => { const s = mk('span'); Emo.text(s, e); return s; };
    row.append(face(S.avatar), mk('b', '', '➜'), face('🐻'), mk('b', '', '➜'), face(S.avatar));
    a0.appendChild(row);

    const a1 = $('tutArt1');
    a1.textContent = '';
    a1.appendChild(miniBoard(5, 40, [0, 1, 2, 3, 4].map((c) => ({ r: 2, c, t: 'p', win: true })), [[2, 0, 2, 4, true]]));
    a1.appendChild(miniBoard(5, 40, [0, 1, 2, 3, 4].map((i) => ({ r: i, c: i, t: 'p', win: true })), [[0, 0, 4, 4, true]]));

    const a2 = $('tutArt2');
    a2.textContent = '';
    a2.appendChild(miniBoard(6, 48, [
      { r: 2, c: 0, t: 'b' }, { r: 2, c: 1, t: 'b' }, { r: 2, c: 2, t: 'b' }, { r: 2, c: 3, t: 'b' },
      { r: 2, c: 4, t: 'ring' }, { r: 3, c: 1, t: 'p' }, { r: 1, c: 2, t: 'p' }, { r: 3, c: 3, t: 'p' },
    ], [[2, 0, 2, 4]], [2, 4]));
  }

  function openTutorial() {
    buildTutorialArt();
    S.tutStep = 0;
    renderTutorial();
    showOverlay('tutOv');
  }

  function renderTutorial() {
    document.querySelectorAll('#tutOv .tut-step').forEach((s) => s.classList.toggle('show', Number(s.dataset.step) === S.tutStep));
    document.querySelectorAll('#tutDots i').forEach((d, i) => d.classList.toggle('on', i === S.tutStep));
    $('tutNext').textContent = S.tutStep < 2 ? '👉 下一步' : '🎮 开始玩！';
  }

  /* ============== 结果卡片 ============== */
  function showResult() {
    const r = S.result;
    if (!r || !S.gameOver) return;
    const L = LEVELS[S.level];
    const card = $('resultCard');
    card.className = 'sheet result ' + r.kind;
    let emo = '🤝';
    let title = '平局！';
    let sub = '你们都很棒';
    if (r.kind === 'win') {
      emo = S.avatar;
      title = '🎉 你赢啦！';
      sub = `${L.emoji} ${L.name}说：你真棒！`;
    } else if (r.kind === 'lose') {
      emo = L.emoji;
      title = '差一点点！';
      sub = `${L.emoji} ${L.name}赢了这局`;
    } else if (r.kind === 'family') {
      emo = avatarOf(S.winner);
      title = `${avatarOf(S.winner)} 赢啦！`;
      sub = '一起玩真开心！';
    }
    Emo.text($('rEmo'), emo);
    Emo.text($('rTitle'), title);
    Emo.text($('rSub'), sub);
    const star = $('rStar');
    star.hidden = !r.star;
    if (r.star) {
      star.style.animation = 'none';
      void star.offsetWidth;
      star.style.animation = '';
    }
    $('rTip').hidden = !r.tip;
    const sug = $('rSuggest');
    if (r.suggest) {
      const T = LEVELS[r.suggest];
      Emo.text(sug, r.suggest < S.level ? `换 ${T.emoji} ${T.name} 试试` : `挑战 ${T.emoji} ${T.name}！`);
      sug.dataset.level = r.suggest;
      sug.hidden = false;
    } else {
      sug.hidden = true;
    }
    showOverlay('resultOv');
    if (r.kind === 'win' || r.kind === 'family') {
      Sound.play('win');
      confetti();
    } else if (r.kind === 'lose') {
      Sound.play('lose');
    }
  }

  function confetti() {
    if (TEST) return;
    const box = $('confetti');
    box.textContent = '';
    const colors = ['#ff8fb8', '#6bbfff', '#ffd24a', '#7ed9a6', '#c9a7ff', '#ffa45c'];
    const W = window.innerWidth;
    for (let i = 0; i < 70; i++) {
      const p = mk('i');
      const star = i % 7 === 0;
      if (star) {
        p.textContent = ['⭐', '🌸', '💖'][i % 3];
        p.style.fontSize = 18 + Math.random() * 14 + 'px';
        p.style.fontFamily = EMOJI_FONT;
      } else {
        p.style.width = 8 + Math.random() * 8 + 'px';
        p.style.height = 10 + Math.random() * 10 + 'px';
        p.style.background = colors[i % colors.length];
      }
      p.style.left = Math.random() * W + 'px';
      p.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
      p.style.setProperty('--rot', (Math.random() * 900 - 450) + 'deg');
      p.style.animationDuration = 2.2 + Math.random() * 1.8 + 's';
      p.style.animationDelay = Math.random() * 0.6 + 's';
      box.appendChild(p);
    }
    setTimeout(() => { box.textContent = ''; }, 4800);
  }

  /* ============== 设置 ============== */
  function renderSettings() {
    document.querySelectorAll('#setOv .seg').forEach((seg) => {
      const v = !!Store.data[seg.dataset.opt];
      seg.querySelectorAll('button').forEach((b) => {
        const isOn = b.dataset.v === '1';
        b.classList.toggle('on', isOn === v);
        b.classList.toggle('off-choice', !isOn);
      });
    });
  }

  function openSettings() {
    $('clearStep1').hidden = false;
    $('clearStep2').hidden = true;
    renderSettings();
    showOverlay('setOv');
  }

  /* ============== 输入（Pointer Events） ============== */
  // 指针位置 -> 最近的空交叉点（手指略偏时自动吸附到旁边的空位）
  function eventCell(e) {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height || !G.cell) return null;
    const x = ((e.clientX - rect.left) * G.side) / rect.width;
    const y = ((e.clientY - rect.top) * G.side) / rect.height;
    const clamp = (v) => Math.max(0, Math.min(S.size - 1, v));
    const fy = clamp(y / G.cell - G.m);
    const fx = clamp(x / G.cell - G.m);
    const r0 = Math.round(fy);
    const c0 = Math.round(fx);
    if (S.board[r0][c0] === 0) return [r0, c0];
    let best = null;
    let bestD = 0.8 * 0.8;
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        const r = r0 + dr, c = c0 + dc;
        if (!inB(r, c) || S.board[r][c] !== 0) continue;
        const dd = (r - fy) * (r - fy) + (c - fx) * (c - fx);
        if (dd < bestD) { bestD = dd; best = [r, c]; }
      }
    }
    return best;
  }

  function eventInside(e) {
    const rect = canvas.getBoundingClientRect();
    return e.clientX >= rect.left - 4 && e.clientX <= rect.right + 4 && e.clientY >= rect.top - 4 && e.clientY <= rect.bottom + 4;
  }

  function updateHover(e) {
    const cell = canAct() && eventInside(e) ? eventCell(e) : null;
    S.hover = cell && S.board[cell[0]][cell[1]] === 0 ? cell : null;
    // 桌面：可落子时显示小手
    if (e.pointerType === 'mouse') canvas.classList.toggle('wait', !S.hover);
  }

  function bindBoardInput() {
    canvas.addEventListener('pointerdown', (e) => {
      if (!e.isPrimary) return;
      e.preventDefault();
      if (!canAct()) return;
      S.dragId = e.pointerId;
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
      updateHover(e);
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!e.isPrimary) return;
      if (S.dragId === e.pointerId || (e.pointerType === 'mouse' && S.dragId === null)) updateHover(e);
    });
    canvas.addEventListener('pointerup', (e) => {
      if (S.dragId !== e.pointerId) return;
      S.dragId = null;
      const cell = eventInside(e) ? eventCell(e) : null;
      S.hover = null;
      if (cell) humanRelease(cell[0], cell[1]);
      if (e.pointerType === 'mouse') updateHover(e);
    });
    canvas.addEventListener('pointercancel', () => {
      S.dragId = null;
      S.hover = null;
    });
    canvas.addEventListener('pointerleave', () => {
      if (S.dragId === null) S.hover = null;
    });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  /* ============== 按钮绑定 ============== */
  function bindButtons() {
    const on = (id, fn) => $(id).addEventListener('click', fn);
    on('btnHelp', openTutorial);
    on('btnSettings', openSettings);
    on('btnGameSettings', openSettings);
    on('btnSound', () => setOption('sound', !Store.data.sound));
    on('btnHint', showHint);
    on('btnUndo', undo);
    on('btnRestart', restart);
    on('btnHome', goHome);
    on('tutNext', () => {
      if (S.tutStep < 2) {
        S.tutStep++;
        renderTutorial();
      } else {
        hideOverlay('tutOv');
        Store.data.tutorialSeen = true;
        Store.save();
      }
    });
    on('rAgain', () => { hideOverlay('resultOv'); restart(); });
    on('rHome', goHome);
    on('rUndo', undo);
    on('rSuggest', () => {
      const lv = Number($('rSuggest').dataset.level);
      hideOverlay('resultOv');
      if (lv >= 1 && lv <= 5) startGame('ai', lv, S.size);
    });
    document.querySelectorAll('#setOv .seg button').forEach((b) => {
      b.addEventListener('click', () => setOption(b.parentElement.dataset.opt, b.dataset.v === '1'));
    });
    on('btnClearStars', () => {
      $('clearStep1').hidden = true;
      $('clearStep2').hidden = false;
    });
    on('btnClearNo', () => {
      $('clearStep1').hidden = false;
      $('clearStep2').hidden = true;
    });
    on('btnClearYes', () => {
      Store.data.stars = 0;
      for (let l = 1; l <= 5; l++) {
        Store.data.wins[l] = 0;
        Store.data.streak[l] = { w: 0, l: 0 };
      }
      Store.save();
      $('clearStep1').hidden = false;
      $('clearStep2').hidden = true;
      renderMenu();
    });
    on('setClose', () => hideOverlay('setOv'));
  }

  /* ============== 初始化 ============== */
  // 换成图片 / 图片加载好之后，把用到动物的地方重画一遍
  function redrawEmoji() {
    spriteCache.clear();
    document.querySelectorAll('.title .emo').forEach((el) => { if (el.dataset.raw) Emo.text(el, el.dataset.raw); });
    if (S.screen === 'game') renderGame();
    renderMenu();
    if ($('tutOv').classList.contains('show')) openTutorial();
  }

  function init() {
    canvas = $('board');
    ctx = canvas.getContext('2d');
    document.querySelectorAll('.title .emo').forEach((el) => { el.dataset.raw = el.dataset.raw || el.textContent; Emo.text(el, el.dataset.raw); });
    Emo.preload(redrawEmoji);
    if (TEST) document.documentElement.classList.add('test-mode');
    buildMenu();
    renderMenu();
    renderSettings();
    bindBoardInput();
    bindButtons();

    // 首次手势解锁声音（iOS）
    ['pointerdown', 'touchend', 'click', 'keydown'].forEach((ev) => {
      document.addEventListener(ev, Sound.unlock, { capture: true, passive: true });
    });
    // 防止双指缩放、双击缩放、游戏中页面滚动
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('dblclick', (e) => e.preventDefault());
    document.addEventListener('touchmove', (e) => {
      if (S.screen === 'game' && !(e.target.closest && e.target.closest('.sheet'))) e.preventDefault();
    }, { passive: false });

    // 尺寸 / 方向变化时重新布局并重绘
    let pend = 0;
    const relayout = () => {
      cancelAnimationFrame(pend);
      pend = requestAnimationFrame(() => { layout(); renderGame(); });
    };
    window.addEventListener('resize', relayout);
    window.addEventListener('orientationchange', () => { relayout(); setTimeout(relayout, 300); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', relayout);
    if (window.ResizeObserver) new ResizeObserver(relayout).observe($('app'));
    document.addEventListener('visibilitychange', () => { if (!document.hidden) relayout(); });

    showScreen('menu');
    if (!TEST && !Store.data.tutorialSeen) openTutorial();

    // 离线缓存（只在 https / 本机时可用；添加到主屏幕后没网也能玩）
    if (!TEST && 'serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) {
      navigator.serviceWorker.register('sw.js').catch(() => { /* 忽略 */ });
    }

    // 测试钩子：仅 ?test=1
    if (TEST) {
      window.__kids = {
        getState,
        startGame: (mode, level, size) => { startGame(mode, level, size); return getState(); },
        tap: (row, col) => humanRelease(row, col),
        loadPosition: (board, current) => { loadPosition(board, current); return getState(); },
        setOption: (name, value) => { setOption(name, value); return getState(); },
      };
    }
  }

  init();
})();
</script>
