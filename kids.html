<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="五子棋乐园">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#ffe8f1">
<link rel="manifest" href="kids.webmanifest">
<link rel="apple-touch-icon" href="icons/wuziqi-180.png">
<link rel="icon" type="image/png" href="icons/wuziqi-192.png">
<title>五子棋乐园</title>
<style>
  /* ============== 基础与配色 ============== */
  :root {
    --ink: #5b4331;
    --ink-soft: #9a7f69;
    --pink: #ff8fb8;
    --pink-bg: #ffd6e5;
    --blue: #6bbfff;
    --blue-bg: #d4ecff;
    --gold: #ffc93c;
    --red: #ff4658;
    --orange: #ff9a1f;
    --sheet: #fffdf8;
    --font: ui-rounded, "SF Pro Rounded", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: var(--font);
    color: var(--ink);
    background: linear-gradient(160deg, #ffe8f1 0%, #fff5e1 48%, #e2f2ff 100%);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    overscroll-behavior: none;
    touch-action: manipulation; /* 禁止双击缩放 */
  }

  /* 背景上的柔和光斑 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 8% 12%, rgba(255, 190, 215, 0.55) 0, rgba(255, 190, 215, 0) 28%),
      radial-gradient(circle at 92% 18%, rgba(255, 230, 150, 0.5) 0, rgba(255, 230, 150, 0) 26%),
      radial-gradient(circle at 85% 90%, rgba(170, 215, 255, 0.55) 0, rgba(170, 215, 255, 0) 30%),
      radial-gradient(circle at 12% 88%, rgba(190, 240, 200, 0.45) 0, rgba(190, 240, 200, 0) 26%);
  }

  button {
    font-family: inherit;
    color: inherit;
    border: none;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  .emo { font-family: var(--emoji); }

  #app { position: fixed; inset: 0; }

  .screen { position: absolute; inset: 0; display: none; }
  .screen.show { display: flex; }

  /* ============== 通用按钮 ============== */
  .btn {
    --shade: #e9d2b3;
    min-height: 56px;
    padding: 0 20px;
    font-size: 20px;
    font-weight: 800;
    color: var(--ink);
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 5px 0 var(--shade), 0 9px 18px rgba(150, 100, 60, 0.12);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
    transition: transform 0.08s, box-shadow 0.08s, opacity 0.2s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--shade), 0 3px 8px rgba(150, 100, 60, 0.12); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn:disabled:active { transform: none; box-shadow: 0 5px 0 var(--shade); }
  .btn.pink   { background: linear-gradient(#ffb3cf, #ff8fb8); color: #fff; --shade: #e36a97; text-shadow: 0 1px 1px rgba(170, 50, 90, 0.35); }
  .btn.blue   { background: linear-gradient(#bfe3ff, #8ccfff); color: #2d5a80; --shade: #5fa9e0; }
  .btn.green  { background: linear-gradient(#c9f2d6, #9fe3b6); color: #2f6b45; --shade: #6fc18d; }
  .btn.yellow { background: linear-gradient(#fff0a8, #ffd966); color: #7a5300; --shade: #e7b63c; }
  .btn.purple { background: linear-gradient(#e6d6ff, #c9b0ff); color: #4f3a85; --shade: #a58ae0; }
  .btn.big { min-height: 64px; font-size: 24px; border-radius: 24px; padding: 0 28px; }

  /* ============== 菜单页 ============== */
  #menu {
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding:
      calc(14px + env(safe-area-inset-top))
      calc(20px + env(safe-area-inset-right))
      calc(20px + env(safe-area-inset-bottom))
      calc(20px + env(safe-area-inset-left));
  }
  .menu-inner {
    width: 100%;
    max-width: 1120px;
    margin: auto 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .menu-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .title {
    font-size: clamp(32px, 5.2vw, 50px);
    font-weight: 900;
    letter-spacing: 3px;
    color: #6d4a33;
    text-shadow: 0 3px 0 #fff, 0 6px 14px rgba(255, 143, 184, 0.35);
    white-space: nowrap;
  }
  .star-total {
    flex-shrink: 0;
    background: #fff;
    border-radius: 999px;
    padding: 8px 20px;
    font-size: 26px;
    font-weight: 900;
    color: #b07a00;
    box-shadow: 0 5px 0 #f1d58c, 0 8px 16px rgba(180, 130, 40, 0.15);
    white-space: nowrap;
  }
  .star-total.bump { animation: bump 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .subtitle { text-align: center; font-size: clamp(22px, 3vw, 28px); font-weight: 900; color: #7a5641; }

  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  @media (min-aspect-ratio: 4/3) and (min-width: 960px) {
    .cards { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; }
  }
  @media (max-width: 520px) {
    .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  .card {
    --bg: #fff;
    --shade: #e9d2b3;
    position: relative;
    background: var(--bg);
    border-radius: 28px;
    padding: 14px 8px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    border: 3px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 6px 0 var(--shade), 0 12px 22px rgba(150, 100, 60, 0.13);
    transition: transform 0.08s, box-shadow 0.08s;
    min-width: 0;
  }
  .card:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--shade), 0 4px 10px rgba(150, 100, 60, 0.12); }
  .card .c-emo { font-family: var(--emoji); font-size: clamp(50px, 6.4vw, 70px); line-height: 1.15; animation: sway 3s ease-in-out infinite; }
  .card:nth-child(2) .c-emo { animation-delay: -0.6s; }
  .card:nth-child(3) .c-emo { animation-delay: -1.2s; }
  .card:nth-child(4) .c-emo { animation-delay: -1.8s; }
  .card:nth-child(5) .c-emo { animation-delay: -2.4s; }
  .card .c-name { font-size: 24px; font-weight: 900; }
  .card .c-tag { font-size: 18px; font-weight: 700; color: #8f725c; white-space: nowrap; }
  .card .c-paws { font-family: var(--emoji); font-size: 15px; letter-spacing: -1px; white-space: nowrap; }
  .card .c-paws .off { opacity: 0.2; filter: grayscale(1); }
  .card .c-wins {
    margin-top: 2px;
    font-size: 18px;
    font-weight: 900;
    color: #a26f00;
    background: rgba(255, 255, 255, 0.85);
    border-radius: 999px;
    padding: 2px 12px;
    white-space: nowrap;
  }
  .card.family .c-tag { white-space: normal; text-align: center; }

  .opt-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 22px; }
  .opt-group {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 10px;
    background: rgba(255, 255, 255, 0.72);
    border-radius: 26px;
    padding: 10px 16px;
    box-shadow: 0 4px 14px rgba(150, 100, 60, 0.08);
  }
  .opt-label { font-size: 20px; font-weight: 900; margin-right: 4px; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .chip {
    min-height: 56px;
    min-width: 56px;
    padding: 0 14px;
    border-radius: 18px;
    background: #fff;
    border: 3px solid #f1e4d3;
    font-size: 20px;
    font-weight: 800;
    color: var(--ink);
    white-space: nowrap;
    transition: transform 0.15s, border-color 0.15s, background 0.15s;
  }
  .chip.emo-chip { font-family: var(--emoji); font-size: 34px; width: 62px; height: 62px; padding: 0; line-height: 1; }
  .chip.on {
    border-color: var(--pink);
    background: #fff0f6;
    box-shadow: 0 0 0 4px rgba(255, 143, 184, 0.28);
    transform: scale(1.07);
  }
  .menu-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; padding-bottom: 6px; }

  @keyframes sway {
    0%, 100% { transform: rotate(-4deg); }
    50% { transform: rotate(4deg) translateY(-2px); }
  }
  @keyframes bump {
    0% { transform: scale(1); }
    40% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }

  /* ============== 游戏页布局（竖屏 / 横屏由 JS 切换 class） ============== */
  #game {
    padding:
      calc(10px + env(safe-area-inset-top))
      calc(12px + env(safe-area-inset-right))
      calc(10px + env(safe-area-inset-bottom))
      calc(12px + env(safe-area-inset-left));
    --side: 400px;
    --col: 600px;
    --panel: 320px;
  }
  #game.show {
    display: grid;
    justify-content: center;
    align-content: center;
    row-gap: 10px;
    column-gap: 20px;
  }
  #game.port {
    grid-template-columns: var(--col);
    grid-template-rows: auto auto var(--side) auto;
    grid-template-areas: "top" "banner" "board" "controls";
  }
  #game.land {
    grid-template-columns: var(--side) var(--panel);
    grid-template-rows: auto minmax(0, 1fr) auto minmax(0, 1fr) auto;
    grid-template-areas: "board banner" "board ." "board top" "board ." "board controls";
    row-gap: 14px;
  }
  .topbar { grid-area: top; min-width: 0; }
  #bannerSlot { grid-area: banner; position: relative; height: 84px; min-width: 0; }
  #game.land #bannerSlot { height: 172px; }
  .board-wrap {
    grid-area: board;
    position: relative;
    width: var(--side);
    height: var(--side);
    justify-self: center;
    align-self: center;
    border-radius: 26px;
    box-shadow: 0 8px 0 #e2bf86, 0 16px 30px rgba(140, 90, 40, 0.26);
  }
  #board {
    position: absolute;
    left: 0;
    top: 0;
    display: block;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    border-radius: 26px;
    cursor: pointer;
  }
  #board.wait { cursor: default; }

  /* 玩家卡片 */
  .players { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .pcard {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.8);
    border-radius: 24px;
    padding: 6px 12px 6px 6px;
    border: 3px solid transparent;
    opacity: 0.72;
    transition: opacity 0.25s, border-color 0.25s, box-shadow 0.25s;
  }
  .pcard.p2 { flex-direction: row-reverse; padding: 6px 6px 6px 12px; }
  .pcard .av {
    flex-shrink: 0;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-family: var(--emoji);
    font-size: 36px;
    line-height: 1;
    background: var(--pink-bg);
    border: 3px solid var(--pink);
  }
  .pcard.p2 .av { background: var(--blue-bg); border-color: var(--blue); }
  .pcard .who { min-width: 0; display: flex; flex-direction: column; line-height: 1.15; }
  .pcard .nm { font-size: 24px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pcard .sub { font-size: 15px; font-weight: 800; color: var(--ink-soft); white-space: nowrap; overflow: hidden; }
  .pcard .sub.paws { font-family: var(--emoji); letter-spacing: -1px; }
  .pcard.p2 .who { align-items: flex-end; }
  .pcard.active {
    opacity: 1;
    background: #fff;
    border-color: #ffd24a;
    box-shadow: 0 0 0 5px rgba(255, 210, 74, 0.35), 0 8px 16px rgba(150, 100, 60, 0.12);
    animation: hop 1.1s ease-in-out infinite;
  }
  @keyframes hop {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  .vs { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
  .vs .vs-t { font-family: var(--emoji); font-size: 26px; }
  .vs .score { font-size: 18px; font-weight: 900; color: var(--ink-soft); white-space: nowrap; }
  .status {
    margin-top: 6px;
    text-align: center;
    font-size: 24px;
    font-weight: 900;
    min-height: 34px;
    line-height: 34px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #game.land .status { font-size: 26px; margin-top: 10px; }
  #game.land .players { flex-direction: column; align-items: stretch; gap: 6px; }
  #game.land .pcard { flex: none; }
  #game.land .pcard.p2 { flex-direction: row; padding: 6px 12px 6px 6px; }
  #game.land .pcard.p2 .who { align-items: flex-start; }
  #game.land .pcard .av { width: 64px; height: 64px; font-size: 40px; }
  #game.land .vs { flex-direction: row; justify-content: center; gap: 12px; }

  /* 控制按钮 */
  .controls { grid-area: controls; display: flex; gap: 10px; justify-content: center; min-width: 0; }
  #game.port .controls { margin-top: 10px; }
  .controls .btn { flex: 1 1 0; padding: 0 6px; min-width: 0; }
  #game.land .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; }
  #game.land .controls .btn { min-height: 66px; font-size: 22px; }
  #game.land .controls .btn-set { grid-column: span 2; min-height: 56px; }


  /* ============== 危险提醒横幅（最重要） ============== */
  .banner {
    position: absolute;
    inset: 0;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 4px 16px;
    font-weight: 900;
    font-size: clamp(22px, 3.4vw, 30px);
    line-height: 1.22;
    overflow: hidden;
  }
  .banner .b-main { display: block; white-space: nowrap; }
  .banner .b-main span { white-space: nowrap; }
  .banner .b-small { display: block; font-size: 18px; font-weight: 800; margin-top: 2px; white-space: nowrap; }
  #game.land .banner { font-size: 29px; padding: 8px 12px; }
  #game.land .banner .b-main span { display: block; }
  .banner.none {
    background: rgba(255, 255, 255, 0.5);
    border: 3px dashed rgba(214, 176, 132, 0.45);
    color: #b39780;
    font-size: 20px;
    font-weight: 800;
  }
  #game.land .banner.none { font-size: 22px; }
  .banner.red {
    background: linear-gradient(135deg, #ff5c6c 0%, #ff7a59 100%);
    color: #fff;
    border: 4px solid #fff;
    text-shadow: 0 2px 0 rgba(190, 30, 50, 0.35);
    box-shadow: 0 0 0 4px #ff5c6c, 0 10px 26px rgba(255, 70, 90, 0.45);
    animation: shakeIn 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) both, glowRed 1.3s ease-in-out 0.6s infinite;
  }
  .banner.orange {
    background: linear-gradient(135deg, #ffe3a3 0%, #ffbe5c 100%);
    color: #7a4200;
    border: 4px solid #fff;
    box-shadow: 0 0 0 3px #ffb347, 0 8px 18px rgba(255, 160, 60, 0.3);
    animation: popBanner 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .banner.gold {
    background: linear-gradient(135deg, #fff5b8 0%, #ffd54a 100%);
    color: #7a4c00;
    border: 4px solid #fff;
    box-shadow: 0 0 0 4px #ffc62e, 0 0 26px rgba(255, 200, 40, 0.65);
    animation: popBanner 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both, glowGold 1.6s ease-in-out 0.45s infinite;
  }
  .banner.bubble {
    overflow: visible;
    background: #fff;
    color: #e23a4f;
    border: 4px solid #ff5c6c;
    box-shadow: 0 10px 24px rgba(255, 70, 90, 0.3);
    animation: wobble 0.55s ease-in-out both;
  }
  .banner.bubble .b-small { color: #8a6a55; }
  /* 气泡小尾巴：竖屏指向下方棋盘，横屏指向左侧棋盘 */
  .banner.bubble::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -17px;
    margin-left: -14px;
    border: 14px solid transparent;
    border-bottom: 0;
    border-top-color: #ff5c6c;
  }
  #game.land .banner.bubble::after {
    left: -17px;
    top: 50%;
    bottom: auto;
    margin-left: 0;
    margin-top: -14px;
    border: 14px solid transparent;
    border-left: 0;
    border-right-color: #ff5c6c;
  }
  @keyframes shakeIn {
    0% { transform: scale(0.6); opacity: 0; }
    30% { transform: scale(1.06) rotate(-2.5deg); opacity: 1; }
    45% { transform: scale(1) rotate(2.5deg) translateX(6px); }
    60% { transform: rotate(-2deg) translateX(-6px); }
    75% { transform: rotate(1.2deg) translateX(3px); }
    90% { transform: rotate(-0.6deg) translateX(-2px); }
    100% { transform: none; }
  }
  @keyframes glowRed {
    0%, 100% { box-shadow: 0 0 0 4px #ff5c6c, 0 10px 26px rgba(255, 70, 90, 0.45); }
    50% { box-shadow: 0 0 0 7px #ff8a96, 0 10px 34px rgba(255, 70, 90, 0.65); }
  }
  @keyframes glowGold {
    0%, 100% { box-shadow: 0 0 0 4px #ffc62e, 0 0 22px rgba(255, 200, 40, 0.55); }
    50% { box-shadow: 0 0 0 7px #ffe07a, 0 0 36px rgba(255, 200, 40, 0.85); }
  }
  @keyframes popBanner {
    0% { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes wobble {
    0% { transform: scale(0.8); }
    30% { transform: scale(1.05) rotate(-2deg); }
    55% { transform: rotate(2deg); }
    80% { transform: rotate(-1deg); }
    100% { transform: none; }
  }

  /* ============== 弹层通用 ============== */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    padding:
      calc(16px + env(safe-area-inset-top))
      calc(16px + env(safe-area-inset-right))
      calc(16px + env(safe-area-inset-bottom))
      calc(16px + env(safe-area-inset-left));
    background: rgba(110, 75, 50, 0.38);
  }
  .overlay.show { display: flex; animation: fadeIn 0.2s ease-out; }
  .sheet {
    position: relative;
    width: min(620px, 100%);
    max-height: 100%;
    overflow-y: auto;
    background: var(--sheet);
    border-radius: 34px;
    padding: 26px 24px 24px;
    text-align: center;
    border: 4px solid #fff;
    box-shadow: 0 18px 44px rgba(90, 60, 40, 0.3);
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn { from { transform: scale(0.75); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .sheet h2 { font-size: 30px; font-weight: 900; margin-bottom: 14px; }
  .sheet-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 18px; }

  /* ============== 教程 ============== */
  .tut-step { display: none; }
  .tut-step.show { display: block; animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .tut-art {
    min-height: 250px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .tut-text { font-size: 28px; font-weight: 900; line-height: 1.3; }
  .tut-small { font-size: 22px; font-weight: 800; color: #9a6f52; margin-top: 4px; }
  .tut-dots { display: flex; justify-content: center; gap: 10px; margin-top: 16px; }
  .tut-dots i { width: 14px; height: 14px; border-radius: 50%; background: #f0dcc4; transition: all 0.25s; }
  .tut-dots i.on { width: 34px; border-radius: 8px; background: var(--pink); }
  .turn-row { width: 100%; font-family: var(--emoji); font-size: 34px; }
  .turn-row b { font-family: var(--font); font-size: 26px; color: #c7a88c; margin: 0 6px; }

  /* 教程里的小棋盘 */
  .mini {
    --c: 44px;
    position: relative;
    display: grid;
    grid-template-columns: repeat(var(--n), var(--c));
    grid-template-rows: repeat(var(--n), var(--c));
    padding: 8px;
    border-radius: 18px;
    background-color: #f7dca8;

  }
  .mini .grid {
    position: absolute;
    inset: 8px;
    background-image:
      linear-gradient(to right, rgba(150, 105, 60, 0.5) 2px, transparent 2px),
      linear-gradient(to bottom, rgba(150, 105, 60, 0.5) 2px, transparent 2px);
    background-size: var(--c) var(--c);
    background-position: calc(var(--c) / 2 - 1px) calc(var(--c) / 2 - 1px);

  .mini .mc { position: relative; display: grid; place-items: center; }
  .ms {
    width: 86%;

    border-radius: 50%;
    display: grid;
    place-items: center;
    font-family: var(--emoji);
    font-size: calc(var(--c) * 0.52);

  .ms.b { background: var(--blue-bg); border-color: var(--blue); }
  .ms.win { box-shadow: 0 0 0 4px rgba(255, 205, 60, 0.9), 0 0 14px rgba(255, 190, 40, 0.9); animation: hop 1s ease-in-out infinite; }
  .ms.ghost { opacity: 0.5; }
  .mring {
    position: absolute;
    width: 96%;
    height: 96%;
    border-radius: 50%;
    border: 5px solid #ff3348;
    background: rgba(255, 51, 72, 0.16);
    box-shadow: 0 0 0 3px #fff, 0 0 16px rgba(255, 51, 72, 0.7);

  .mband {
    position: absolute;
    border-radius: 999px;

  /* ============== 结果卡片 ============== */
  .result .r-emo { font-family: var(--emoji); font-size: 84px; line-height: 1.1; animation: hop 1.2s ease-in-out infinite; }
  .result .r-title { font-size: 44px; font-weight: 900; margin-top: 4px; }

  /* ============== 其他 ============== */

<script>
/* === KIDS_AI_START === */
const KidsAI = (() => {
  /* ============== 基础工具 ==============
   * 棋盘: 0 空, 1 先手, 2 后手; 支持 9..15 的方形棋盘
   * 所有函数都不会永久修改传入的棋盘
   */
  const DIRS = [[0, 1], [1, 0], [1, 1], [1, -1]];

  function inside(size, r, c) {
    return r >= 0 && r < size && c >= 0 && c < size;
  }

  // 从 (r,c) 出发沿 (dr,dc) 数连续的 player 棋子(不含起点); (vr,vc) 视为 player 的虚拟棋子
  function runFrom(board, r, c, dr, dc, player, vr, vc) {
    const size = board.length;
    let n = 0;
    let rr = r + dr, cc = c + dc;
    while (rr >= 0 && rr < size && cc >= 0 && cc < size &&
           (board[rr][cc] === player || (rr === vr && cc === vc))) {
      n++;
      rr += dr;
      cc += dc;
    }
    return n;
  }

  // 在 (r,c) 放 player 的子后是否连成 5 个或更多
  function makesFive(board, r, c, player, vr = -1, vc = -1) {
    for (let d = 0; d < 4; d++) {
      const dr = DIRS[d][0], dc = DIRS[d][1];
      const n = 1 + runFrom(board, r, c, dr, dc, player, vr, vc) +
        runFrom(board, r, c, -dr, -dc, player, vr, vc);
      if (n >= 5) return true;
    }
    return false;
  }

  function isEmptyBoard(board) {
    for (let r = 0; r < board.length; r++)
      for (let c = 0; c < board.length; c++)
        if (board[r][c]) return false;
    return true;
  }

  function firstEmpty(board) {
    for (let r = 0; r < board.length; r++)
      for (let c = 0; c < board.length; c++)
        if (!board[r][c]) return [r, c];
    return null;
  }

  function copyBoard(board) {
    return board.map(row => Array.from(row));
  }

  /* ============== 威胁检测 (危险提醒的核心) ==============
   * win : 落子即成五的空位
   * four: 不在 win 中, 落子后该方至少有 2 个成五点的空位 (活三的关键点 / 双冲四)
   * 结果按行、列排序, 无重复
   */
  function findThreats(board, player) {
    const size = board.length;
    const win = [], four = [];
    const winMask = new Uint8Array(size * size);
    let winCount = 0;
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        if (board[r][c] === 0 && makesFive(board, r, c, player)) {
          winMask[r * size + c] = 1;
          winCount++;
          win.push([r, c]);
        }
      }
    }
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        if (board[r][c] !== 0 || winMask[r * size + c]) continue;
        // 原有成五点在落子后仍然有效
        let count = winCount;
        if (count < 2) {
          // 新成五点只可能出现在经过 (r,c) 的 4 条线上, 距离不超过 4
          for (let d = 0; d < 4 && count < 2; d++) {
            const dr = DIRS[d][0], dc = DIRS[d][1];
            for (let k = -4; k <= 4 && count < 2; k++) {
              if (k === 0) continue;
              const fr = r + dr * k, fc = c + dc * k;
              if (!inside(size, fr, fc) || board[fr][fc] !== 0 || winMask[fr * size + fc]) continue;
              const n = 1 + runFrom(board, fr, fc, dr, dc, player, r, c) +
                runFrom(board, fr, fc, -dr, -dc, player, r, c);
              if (n >= 5) count++;
            }
          }
        }
        if (count >= 2) four.push([r, c]);
      }
    }
    return { win, four };
  }

  // 返回经过 (row,col) 的完整连线(>=5), 按方向顺序取第一条, 从一端排到另一端
  function getWinLine(board, row, col, player) {
    const size = board.length;
    if (!inside(size, row, col) || board[row][col] !== player) return null;
    for (let d = 0; d < 4; d++) {
      const dr = DIRS[d][0], dc = DIRS[d][1];
      const back = runFrom(board, row, col, -dr, -dc, player, -1, -1);
      const fwd = runFrom(board, row, col, dr, dc, player, -1, -1);
      if (back + fwd + 1 >= 5) {
        const line = [];
        for (let i = -back; i <= fwd; i++) line.push([row + dr * i, col + dc * i]);
        return line;
      }
    }
    return null;
  }


  /* ============== 棋型识别表 ==============
   * 以空位为中心、沿一个方向取 9 格(左右各 4 格), 假设中心落子后判断这个方向的棋型
   * 每格: 0 空, 1 己方, 2 对方或棋盘外; 按三进制编码成 0..19682
   * 棋型递归定义: 两个成五点=活四, 一个=冲四, 一步能成活四=活三, 一步能成冲四=眠三 ...
   */
  const NONE = 0, ONE = 1, TWO = 2, OPEN2 = 3, THREE = 4, OPEN3 = 5, FOUR = 6, OPEN4 = 7, FIVE = 8;
  const POW = [6561, 2187, 729, 243, 81, 27, 9, 3, 1];
  const SHAPE = (() => {
    const table = new Int8Array(19683).fill(-1);
    const digit = (code, i) => Math.floor(code / POW[i]) % 3;
    const five = (code) => {
      let n = 1;
      for (let i = 3; i >= 0 && digit(code, i) === 1; i--) n++;
      for (let i = 5; i <= 8 && digit(code, i) === 1; i++) n++;
      return n >= 5;
    };
    const DOWN = [NONE, ONE, ONE, ONE, TWO, OPEN2, THREE, OPEN3, NONE];
    function classify(code) {
      if (table[code] >= 0) return table[code];
      let res;
      if (five(code)) {
        res = FIVE;
      } else {
        let wins = 0;
        for (let i = 0; i < 9; i++) {
          if (i !== 4 && digit(code, i) === 0 && five(code + POW[i])) wins++;
        }
        if (wins >= 2) res = OPEN4;
        else if (wins === 1) res = FOUR;
        else {
          res = NONE;
          for (let i = 0; i < 9; i++) {
            if (i === 4 || digit(code, i) !== 0) continue;
            const down = DOWN[classify(code + POW[i])];
            if (down > res) res = down;
          }
        }
      }
      table[code] = res;
      return res;
    }
    for (let code = 0; code < 19683; code++) {
      if (digit(code, 4) === 1) classify(code);
    }
    return table;
  })();

  // 单点得分: 四个方向棋型的组合
  const SC_FIVE = 1000000, SC_OPEN4 = 100000, SC_43 = 50000, SC_33 = 20000;

  /* ============== 搜索用的棋盘状态 ============== */
  let N = 0;
  let B = null;          // 一维棋盘
  let STONES = [];       // 落子栈 (下标)
  let MARK = null;
  let STAMP = 0;
  let lastMaxCls = 0;    // pointScore 顺带算出的最大单向棋型
  let ctx = null;        // 本次计算的节点预算

  function setup(board) {
    N = board.length;
    B = new Int8Array(N * N);
    MARK = new Int32Array(N * N);
    STAMP = 0;
    STONES = [];
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        if (board[r][c]) {
          B[r * N + c] = board[r][c];
          STONES.push(r * N + c);
        }
      }
    }
  }

  function place(idx, p) {
    B[idx] = p;
    STONES.push(idx);
  }

  function undo() {
    B[STONES.pop()] = 0;
  }

  // 已有棋子周围 2 格内的空位
  function candidates() {
    STAMP++;
    const out = [];
    for (let s = 0; s < STONES.length; s++) {
      const idx = STONES[s];
      const r0 = (idx / N) | 0, c0 = idx - r0 * N;
      for (let dr = -2; dr <= 2; dr++) {
        const r = r0 + dr;
        if (r < 0 || r >= N) continue;
        for (let dc = -2; dc <= 2; dc++) {
          const c = c0 + dc;
          if (c < 0 || c >= N) continue;
          const j = r * N + c;
          if (B[j] === 0 && MARK[j] !== STAMP) {
            MARK[j] = STAMP;
            out.push(j);
          }
        }
      }
    }
    return out;
  }

  function pointScore(idx, p) {
    const r0 = (idx / N) | 0, c0 = idx - r0 * N;
    let n7 = 0, n6 = 0, n5 = 0, n4 = 0, n3 = 0, n2 = 0, n1 = 0, max = 0;
    for (let d = 0; d < 4; d++) {
      const dr = DIRS[d][0], dc = DIRS[d][1];
      let code = 0;
      for (let k = -4; k <= 4; k++) {
        let dg;
        if (k === 0) dg = 1;
        else {
          const r = r0 + dr * k, c = c0 + dc * k;
          if (r < 0 || r >= N || c < 0 || c >= N) dg = 2;
          else {
            const v = B[r * N + c];
            dg = v === 0 ? 0 : (v === p ? 1 : 2);
          }
        }
        code = code * 3 + dg;
      }
      const cls = SHAPE[code];
      if (cls > max) max = cls;
      switch (cls) {
        case FIVE: lastMaxCls = FIVE; return SC_FIVE;
        case OPEN4: n7++; break;
        case FOUR: n6++; break;
        case OPEN3: n5++; break;
        case THREE: n4++; break;
        case OPEN2: n3++; break;
        case TWO: n2++; break;
        case ONE: n1++; break;
      }
    }
    lastMaxCls = max;
    if (n7 || n6 >= 2) return SC_OPEN4;
    if (n6 && n5) return SC_43;
    if (n5 >= 2) return SC_33;
    return n6 * 2500 + n5 * 2000 + n4 * 300 + n3 * 250 + n2 * 30 + n1 * 3;
  }

  // 在 idx 落 p 是否成五
  function fiveAt(idx, p) {
    const r0 = (idx / N) | 0, c0 = idx - r0 * N;
    for (let d = 0; d < 4; d++) {
      const dr = DIRS[d][0], dc = DIRS[d][1];
      let n = 1;
      for (let k = 1; k < 5; k++) {
        const r = r0 + dr * k, c = c0 + dc * k;
        if (r < 0 || r >= N || c < 0 || c >= N || B[r * N + c] !== p) break;
        n++;
      }
      for (let k = 1; k < 5; k++) {
        const r = r0 - dr * k, c = c0 - dc * k;
        if (r < 0 || r >= N || c < 0 || c >= N || B[r * N + c] !== p) break;
        n++;
      }
      if (n >= 5) return true;
    }
    return false;
  }

  // 刚在 idx 落子后, 经过它的线上新出现的成五点
  function winCellsThrough(idx, p) {
    const r0 = (idx / N) | 0, c0 = idx - r0 * N;
    const out = [];
    for (let d = 0; d < 4; d++) {
      const dr = DIRS[d][0], dc = DIRS[d][1];
      for (let k = -4; k <= 4; k++) {
        if (k === 0) continue;
        const r = r0 + dr * k, c = c0 + dc * k;
        if (r < 0 || r >= N || c < 0 || c >= N) continue;
        const j = r * N + c;
        if (B[j] === 0 && out.indexOf(j) < 0 && fiveAt(j, p)) out.push(j);
      }
    }
    return out;
  }

  // 分析当前局面: 每个候选点对 side 的进攻分 a 和防守分 d (对手在此落子的得分)
  function analyze(side) {
    const opp = 3 - side;
    const cand = candidates();
    const moves = new Array(cand.length);
    for (let i = 0; i < cand.length; i++) {
      const idx = cand[i];
      const a = pointScore(idx, side);
      const aF = lastMaxCls >= FOUR;
      const d = pointScore(idx, opp);
      const dF = lastMaxCls >= FOUR;
      moves[i] = { idx, a, d, aF, dF, pr: 0 };
    }
    return moves;
  }

  // 静态评估 (站在轮到走的一方)
  function evaluate(moves) {
    let myMax = 0, mySum = 0, opMax = 0, opSum = 0;
    for (let i = 0; i < moves.length; i++) {
      const m = moves[i];
      mySum += m.a;
      opSum += m.d;
      if (m.a > myMax) myMax = m.a;
      if (m.d > opMax) opMax = m.d;
    }
    return (mySum - opSum) * 0.3 + myMax - opMax * 0.5;
  }

  // 候选排序: 对方有活三/双三等威胁时只看防守点和自己的冲四
  function orderMoves(moves, width, defW) {
    let oppThreat = false;
    for (let i = 0; i < moves.length; i++) if (moves[i].d >= SC_33) { oppThreat = true; break; }
    const pool = [];
    for (let i = 0; i < moves.length; i++) {
      const m = moves[i];
      if (oppThreat && !(m.d >= 2000 || m.aF || m.a >= SC_33)) continue;
      m.pr = m.a + m.d * defW;
      pool.push(m);
    }
    pool.sort((x, y) => y.pr - x.pr);
    if (pool.length > width) pool.length = width;
    return pool;
  }

  /* ============== 算杀: 连续冲四 (VCF) ==============
   * side 连续冲四直到成五或活四; 找到返回第一步的下标, 否则 -1
   */
  function vcf(side, depth) {
    if (++ctx.vnodes > ctx.vbudget) return -1;
    const opp = 3 - side;
    const cand = candidates();
    const fours = [];
    for (let i = 0; i < cand.length; i++) {
      const idx = cand[i];
      const a = pointScore(idx, side);
      if (a >= SC_FIVE) return idx;
      if (lastMaxCls >= FOUR) fours.push({ idx, a });
    }
    // 对方能直接成五时, 冲四没有意义
    for (let i = 0; i < cand.length; i++) if (fiveAt(cand[i], opp)) return -1;
    if (depth <= 0 || fours.length === 0) return -1;
    fours.sort((x, y) => y.a - x.a);
    for (let i = 0; i < fours.length; i++) {
      const idx = fours[i].idx;
      place(idx, side);
      const wins = winCellsThrough(idx, side);
      let ok = false;
      if (wins.length >= 2) ok = true;
      else if (wins.length === 1) {
        const block = wins[0];
        const oppFive = fiveAt(block, opp);
        place(block, opp);
        ok = !oppFive && vcf(side, depth - 1) >= 0;
        undo();
      }
      undo();
      if (ok) return idx;
      if (ctx.vnodes > ctx.vbudget) return -1;
    }
    return -1;
  }

  /* ============== 极大极小 + Alpha-Beta ============== */
  const WIN = 1e9;

  function negamax(side, depth, alpha, beta, ply, cfg) {
    ctx.nodes++;
    const moves = analyze(side);
    if (moves.length === 0) return 0;
    let myFive = false, oppFives = 0, oppFiveIdx = -1, myOpen4 = false, oppFour = false;
    for (let i = 0; i < moves.length; i++) {
      const m = moves[i];
      if (m.a >= SC_FIVE) { myFive = true; break; }
      if (m.d >= SC_FIVE) { oppFives++; oppFiveIdx = m.idx; }
      if (m.a >= SC_OPEN4) myOpen4 = true;
      if (m.dF) oppFour = true;
    }
    if (myFive) return WIN - ply;
    if (oppFives >= 2) return -(WIN - ply - 1);
    let list;
    let nextDepth = depth - 1;
    if (oppFives === 1) {
      list = [oppFiveIdx];
      if (ply < cfg.depth + 6) nextDepth = depth;   // 被迫防守时延伸
    } else {
      if (myOpen4 && !oppFour) return WIN - ply - 2;
      if (depth <= 0 || ctx.nodes >= ctx.budget) return evaluate(moves);
      list = orderMoves(moves, cfg.width, 0.9).map(m => m.idx);
    }
    let best = -Infinity;
    for (let i = 0; i < list.length; i++) {
      place(list[i], side);
      const v = -negamax(3 - side, nextDepth, -beta, -alpha, ply + 1, cfg);
      undo();
      if (v > best) best = v;
      if (best > alpha) alpha = best;
      if (alpha >= beta) break;
    }
    return best;
  }

  // 根节点迭代加深; margin 内的着法视为一样好, 用 rng 随机挑一个
  function searchRoot(side, rootList, cfg, rng) {
    let order = rootList.slice();
    let done = null;
    for (let depth = 1; depth <= cfg.depth; depth++) {
      const scores = [];
      let best = -Infinity;
      let aborted = false;
      for (let i = 0; i < order.length; i++) {
        if (depth > 1 && ctx.nodes >= ctx.budget) { aborted = true; break; }
        const lo = best === -Infinity ? -Infinity : best - cfg.margin - 1e-6;
        place(order[i], side);
        const v = -negamax(3 - side, depth - 1, -Infinity, -lo, 1, cfg);
        undo();
        scores.push({ idx: order[i], v });
        if (v > best) best = v;
      }
      if (aborted && done) break;
      scores.sort((x, y) => y.v - x.v);
      done = scores;
      order = scores.map(s => s.idx).concat(order.filter(idx => !scores.some(s => s.idx === idx)));
      if (best >= WIN - 1000 || best <= -WIN + 1000 || aborted) break;
    }
    const best = done[0].v;
    if (rng && cfg.margin > 0 && best < WIN - 1000) {
      const near = done.filter(s => s.v >= best - cfg.margin);
      return near[Math.floor(rng() * near.length)].idx;
    }
    return done[0].idx;
  }

  /* ============== 难度参数 ==============
   * depth/width : 搜索深度(步)与每层候选数;  nodes: 节点预算
   * margin      : 分差在 margin 内的着法随机挑 (越小越稳)
   * vcfDepth    : 自己算杀的深度; defendVcf: 是否防对方算杀
   * 1 级不搜索: 按棋型打分在前几名里挑, 偶尔漏看活三
   */
  const LEVELS = {
    1: { depth: 0, pOpen4: 0.7, pBlock3: 0.6, defW: 0.8, topK: 3, ratio: 0.6 },
    2: { depth: 2, width: 6, rootWidth: 8, nodes: 1500, margin: 400, vcfDepth: 0 },
    3: { depth: 3, width: 8, rootWidth: 10, nodes: 5000, margin: 150, vcfDepth: 4, vcfNodes: 800 },
    4: { depth: 4, width: 9, rootWidth: 12, nodes: 15000, margin: 40, vcfDepth: 8, vcfNodes: 2000, defendVcf: true },
    5: { depth: 6, width: 10, rootWidth: 14, nodes: 40000, margin: 0, vcfDepth: 12, vcfNodes: 5000, defendVcf: true },
  };

  function toRC(idx) {
    const r = (idx / N) | 0;
    return [r, idx - r * N];
  }

  function heuristicMove(moves, cfg, rng) {
    let pool = moves;
    if (moves.some(m => m.d >= SC_33) && rng() < cfg.pBlock3) {
      pool = moves.filter(m => m.d >= 2000);
    }
    pool = pool.filter(m => m.a < SC_OPEN4 || m.keep);
    if (pool.length === 0) pool = moves;
    pool.forEach(m => { m.pr = m.a + m.d * cfg.defW; });
    pool.sort((x, y) => y.pr - x.pr);
    const top = pool.slice(0, cfg.topK).filter(m => m.pr >= pool[0].pr * cfg.ratio);
    let total = 0;
    const w = top.map((m, i) => { const x = Math.pow(0.6, i); total += x; return x; });
    let x = rng() * total;
    for (let i = 0; i < top.length; i++) {
      x -= w[i];
      if (x < 0) return top[i].idx;
    }
    return top[top.length - 1].idx;
  }

  function think(board, side, lv, rng) {
    setup(board);
    const cfg = LEVELS[lv];
    const opp = 3 - side;
    if (STONES.length === 0) {
      const mid = Math.floor(N / 2);
      if (!rng || lv >= 5) return [mid, mid];
      return [mid + Math.floor(rng() * 3) - 1, mid + Math.floor(rng() * 3) - 1];
    }
    if (STONES.length >= N * N) return null;
    ctx = { nodes: 0, budget: cfg.nodes || 0, vnodes: 0, vbudget: cfg.vcfNodes || 0 };
    const moves = analyze(side);
    if (moves.length === 0) return firstEmpty(board);

    // 1. 自己能成五
    let bestA = null;
    for (const m of moves) if (m.a >= SC_FIVE) return toRC(m.idx);
    // 2. 对方能成五: 必须堵 (多个时挑对自己最有利的)
    const blocks = moves.filter(m => m.d >= SC_FIVE);
    if (blocks.length) {
      blocks.sort((x, y) => y.a - x.a);
      return toRC(blocks[0].idx);
    }
    // 3. 自己能下出活四/双冲四
    for (const m of moves) if (m.a >= SC_OPEN4 && (!bestA || m.a > bestA.a)) bestA = m;
    if (bestA) {
      if (lv >= 2 || !rng || rng() < cfg.pOpen4) return toRC(bestA.idx);
      if (lv === 1) moves.forEach(m => { m.keep = false; });
    }
    if (!cfg.depth) return toRC(heuristicMove(moves, cfg, rng || (() => 0)));

    // 4. 自己算杀
    if (cfg.vcfDepth) {
      ctx.vnodes = 0;
      const k = vcf(side, cfg.vcfDepth);
      if (k >= 0) return toRC(k);
    }
    // 5. 候选 + 防对方算杀
    let list = orderMoves(moves, cfg.rootWidth, 0.9).map(m => m.idx);
    if (cfg.defendVcf) {
      ctx.vnodes = 0;
      if (vcf(opp, cfg.vcfDepth) >= 0) {
        const pool = orderMoves(moves, cfg.rootWidth + 6, 1.1).map(m => m.idx);
        moves.forEach(m => { if (m.aF && pool.indexOf(m.idx) < 0) pool.push(m.idx); });
        const safe = [];
        for (const idx of pool) {
          place(idx, side);
          ctx.vnodes = 0;
          const threat = vcf(opp, cfg.vcfDepth);
          undo();
          if (threat < 0) safe.push(idx);
        }
        if (safe.length) list = safe;
      }
    }
    if (list.length === 0) list = moves.map(m => m.idx);
    return toRC(searchRoot(side, list, cfg, rng));
  }

  /* ============== 对外接口 ============== */
  function validBoard(board) {
    return Array.isArray(board) && board.length > 0 && board.every(row => row && row.length === board.length);
  }

  function findMove(board, aiPlayer, level, rng = Math.random) {
    if (!validBoard(board)) return null;
    if (typeof rng !== 'function') rng = Math.random;
    if (!firstEmpty(board)) return null;
    const me = aiPlayer === 1 ? 1 : 2;
    const lv = Math.max(1, Math.min(5, Math.round(Number(level)) || 3));
    const mv = think(board, me, lv, rng);
    if (mv && board[mv[0]] && board[mv[0]][mv[1]] === 0) return mv;
    return firstEmpty(board);
  }

  function findHint(board, player) {
    if (!validBoard(board)) return null;
    if (!firstEmpty(board)) return null;
    const me = player === 1 ? 1 : 2;
    const mv = think(board, me, 5, null);
    if (mv && board[mv[0]][mv[1]] === 0) return mv;
    return firstEmpty(board);
  }

  return { findMove, findHint, findThreats, getWinLine };
})();
if (typeof module !== 'undefined' && module.exports) module.exports = KidsAI;
/* === KIDS_AI_END === */
</script>

(() => {

      avatar: '🐼',
