    let txt;
    const opp = LEVELS[S.level];
    if (S.gameOver) {
      if (!S.winner) txt = '🤝 平局！';
      else if (S.mode === 'ai') txt = S.winner === 1 ? '🎉 你赢啦！' : `${opp.emoji} ${opp.name}赢了这局`;
      else txt = `🎉 ${avatarOf(S.winner)} 赢啦！`;
    } else if (S.anim) {
      txt = S.anim.captured ? '💥 吃掉！' : '♟ 走棋…';

      txt = S.flash;

  let bannerKey = '';
  function renderBanner() {
    const el = $('banner');
    let cls = 'none';
    let main = ['👑 把对方的国王', '将死就赢啦！'];
    let small = '看到红色提醒，要先想一想';
    if (S.screen === 'game' && !S.gameOver && !S.thinking && !S.anim && isHumanTurn() && dangerOn()) {
      const d = S.danger;
      const p = S.state.turn;
      const pend = S.pending;
      if (pend) {
        cls = 'bubble';
        if (pend.allowsMate) main = ['🤔 这样走，对方', '一步就能将死你！'];
        else if (pend.stalemate) main = ['🤔 这样对方没法走了', '会变成平局哦！'];
        else main = ['🤔 走到这里', `会被${NAMES[typeOf(pend.eater)] || ''}吃掉哦！`];
        small = '再点一次就走过去';
      } else if (d.check) {
        cls = 'red';
        main = ['⚠️ 将军！', `快救${mineName(p) === '你' ? '你' : mineName(p) + ' '}的国王！`];
        small = '逃走、挡住，或者吃掉它';
      } else if (d.mateThreat) {
        cls = 'red';
        main = ['⚠️ 小心！', `${oppName(p)}下一步能将死你`];
        small = d.alt && !d.alt.mateSavable ? '这次挡不住了，下次早点保护国王' : '想想怎么保护国王';
      } else if (d.hanging.length) {
        cls = 'red';
        const t = typeOf(board()[d.hanging[0]]);
        main = d.hanging.length > 1 ? [`⚠️ ${mineName(p)}有 ${d.hanging.length} 个棋子`, '有危险！'] : [`⚠️ ${mineName(p)}的${NAMES[t]}`, '有危险！'];
        small = '快让它逃走，或者保护它';
      } else if (d.canMate) {
        cls = 'gold';
        main = ['✨ 你可以', '一步将死对方！'];
        small = '找找看';
      } else if (d.bestCapture) {
        cls = 'gold';
        main = ['✨ 可以吃掉', `对方的${NAMES[typeOf(d.bestCapture.capture)]}！`];
        small = '找找看，找不到就点 💡';
      }
    }
    if (S.screen === 'game' && S.gameOver) {
      cls = 'pink';
      small = '';
      if (S.winner) {
        const who = S.mode === 'ai' ? (S.winner === 1 ? '你' : LEVELS[S.level].name) : avatarOf(S.winner);
        main = ['👑 将死！', `${who}赢啦！`];
      } else {
        main = ['🤝 平局', drawText(S.reason)];
      }
    }
    const key = cls + '|' + main.join('') + '|' + small + '|' + (S.pending ? S.pending.to : '');
    if (key === bannerKey) return;
    bannerKey = key;
    el.className = 'banner';
    void el.offsetWidth;
    el.className = 'banner ' + cls;
    el.textContent = '';
    const m = mk('span', 'b-main');
    main.forEach((part) => m.appendChild(mk('span', '', part)));
    el.appendChild(m);
    if (small) el.appendChild(mk('span', 'b-small', small));
    el.dataset.kind = cls;
  }

  /* ============== 教程插图 ============== */
  // n×n 小棋盘：pieces = {'r,c': 值}，dots = ['r,c']，rings、reds 同理
  function miniBoard(n, cellPx, spec) {
    const box = mk('div', 'demo');
    box.style.gridTemplateColumns = `repeat(${n}, ${cellPx}px)`;
    box.style.gridTemplateRows = `repeat(${spec.rows || n}, ${cellPx}px)`;
    for (let r = 0; r < (spec.rows || n); r++) {
      for (let c = 0; c < n; c++) {
        const key = `${r},${c}`;
        const sq = mk('div', 'sq' + ((r + c) % 2 ? ' dk' : '') + ((spec.reds || []).includes(key) ? ' red' : ''));
        if ((spec.dots || []).includes(key)) sq.appendChild(mk('div', 'dot'));
        if (spec.pieces && spec.pieces[key]) sq.appendChild(pieceImg(spec.pieces[key], Math.round(cellPx * 0.9)));
        if ((spec.rings || []).includes(key)) sq.appendChild(mk('div', 'ring'));
        box.appendChild(sq);
      }
    }
    return box;
  }

  function lineDots(n, r0, c0, dirs) {
    const out = [];
    for (const [dr, dc] of dirs) {
      let r = r0 + dr, c = c0 + dc;
      while (r >= 0 && r < n && c >= 0 && c < n) { out.push(`${r},${c}`); r += dr; c += dc; }
    }
    return out;
  }

  /* ============== 输入：鼠标 + 手指 ============== */
  function eventCell(e) {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !V.cs) return -1;
    const px = ((e.clientX - rect.left) * V.w) / rect.width;
    const py = ((e.clientY - rect.top) * V.h) / rect.height;
    const c = Math.floor((px - V.ox) / V.cs);
    const r = Math.floor((py - V.oy) / V.cs);
    if (c < 0 || c > 7 || r < 0 || r > 7) return -1;
    return r * 8 + c;
  }

  const isDest = (i) => S.sel >= 0 && S.dests.some((d) => d.to === i);

  function updateHover(e) {
    const i = eventCell(e);
    S.hover = i;
    const clickable = canAct() && i >= 0 && (sideOf(board()[i]) === S.state.turn || isDest(i));
    canvas.classList.toggle('can', clickable);
  }

  let press = null;

  function bindBoardInput() {
    canvas.addEventListener('pointerdown', (e) => {
      if (!e.isPrimary || e.button > 0) return;
      e.preventDefault();
      const i = eventCell(e);
      press = null;
      if (canAct() && isDest(i)) {
        press = { id: e.pointerId, from: -1, wasSel: false };
        S.hover = i;
      } else if (canAct() && i >= 0 && sideOf(board()[i]) === S.state.turn) {
        press = { id: e.pointerId, from: i, wasSel: S.sel === i };
        if (S.sel !== i) humanClick(i);
      } else {
        humanClick(i);
      }
      if (press) {
        try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
      }
      if (e.pointerType === 'mouse') updateHover(e);
    });
    canvas.addEventListener('pointermove', (e) => {
      if (press && e.pointerId === press.id) {
        S.hover = eventCell(e);
        return;
      }
      if (e.pointerType === 'mouse') updateHover(e);
    });
    canvas.addEventListener('pointerup', (e) => {
      if (!press || e.pointerId !== press.id) return;
      const pr = press;
      press = null;
      const i = eventCell(e);
      if (canAct() && isDest(i)) humanClick(i);
      else if (pr.wasSel && i === pr.from) humanClick(i);
      if (e.pointerType === 'mouse') updateHover(e);
      else S.hover = -1;
    });
    canvas.addEventListener('pointercancel', () => {
      press = null;
      S.hover = -1;
    });
    canvas.addEventListener('pointerleave', (e) => {
      if (press || e.pointerType !== 'mouse') return;
      S.hover = -1;
      canvas.classList.remove('can');
    });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && S.screen === 'game' && S.sel >= 0 && canAct()) {
        S.sel = -1;
        S.dests = [];
        S.pending = null;
        S.hint = null;
        renderGame();
      }
    });
  }

  /* ============== 按钮绑定 ============== */
  function bindButtons() {
    const on = (id, fn) => $(id).addEventListener('click', fn);
    on('btnHelp', openTutorial);
    on('btnSettings', openSettings);
    on('btnGameSettings', openSettings);
    on('btnSound', () => setOption('sound', !Store.data.sound));
    on('btnHint', showHint);
    on('btnUndo', undo);
    on('btnRestart', restart);
    on('btnHome', goHome);
    on('tutNext', () => {
      if (S.tutStep < 3) {
        S.tutStep++;
        renderTutorial();
      } else {
        hideOverlay('tutOv');
        Store.data.tutorialSeen = true;
        Store.save();
      }
    });
    on('rAgain', () => { hideOverlay('resultOv'); restart(); });
    on('rHome', goHome);
    on('rUndo', undo);
    on('rSuggest', () => {
      const lv = Number($('rSuggest').dataset.level);
      hideOverlay('resultOv');
      if (lv >= 1 && lv <= 5) startGame('ai', lv);
    });
    document.querySelectorAll('#setOv .seg button').forEach((b) => {
      b.addEventListener('click', () => setOption(b.parentElement.dataset.opt, b.dataset.v === '1'));
    });
    on('btnClearStars', () => {
      $('clearStep1').hidden = true;
      $('clearStep2').hidden = false;
    });
    on('btnClearNo', () => {
      $('clearStep1').hidden = false;
      $('clearStep2').hidden = true;
    });
    on('btnClearYes', () => {
      Store.data.stars = 0;
      for (let l = 1; l <= 5; l++) {
        Store.data.wins[l] = 0;
        Store.data.streak[l] = { w: 0, l: 0 };
      }
      Store.save();
      $('clearStep1').hidden = false;
      $('clearStep2').hidden = true;
      renderMenu();
    });
    on('setClose', () => hideOverlay('setOv'));
  }

  /* ============== 初始化 ============== */
  function init() {
    canvas = $('board');
    ctx = canvas.getContext('2d');
    if (INSTANT) document.documentElement.classList.add('test-mode');
    buildMenu();
    renderMenu();
    renderSettings();
    bindBoardInput();
    bindButtons();

    ['pointerdown', 'touchend', 'click', 'keydown'].forEach((ev) => {
      document.addEventListener(ev, Sound.unlock, { capture: true, passive: true });
    });
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('dblclick', (e) => e.preventDefault());
    document.addEventListener('touchmove', (e) => {
      if (S.screen === 'game' && !(e.target.closest && e.target.closest('.sheet'))) e.preventDefault();
    }, { passive: false });

    let pend = 0;
    const relayout = () => {
      cancelAnimationFrame(pend);
      pend = requestAnimationFrame(() => { layout(); renderGame(); });
    };
    window.addEventListener('resize', relayout);
    window.addEventListener('orientationchange', () => { relayout(); setTimeout(relayout, 300); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', relayout);
    if (window.ResizeObserver) new ResizeObserver(relayout).observe($('app'));
    document.addEventListener('visibilitychange', () => { if (!document.hidden) relayout(); });

    showScreen('menu');
    if (!TEST && !Store.data.tutorialSeen) openTutorial();

    if (!TEST && 'serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) {
      navigator.serviceWorker.register('sw.js').catch(() => { /* 忽略 */ });
    }

    if (TEST) {
      window.__chess = {
        C,
        getState,
        startGame: (mode, level) => { startGame(mode, level); return getState(); },
        click: (i) => humanClick(i),
        hint: () => { showHint(); return getState(); },
        undo: () => { undo(); return getState(); },
        loadFEN: (fen) => { loadPosition(C.fromFEN(fen)); return getState(); },
        setOption: (name, value) => { setOption(name, value); return getState(); },
        cellClient: (i) => {
          const rect = canvas.getBoundingClientRect();
          const [x, y] = cellXY(i);
          return { x: rect.left + (x * rect.width) / V.w, y: rect.top + (y * rect.height) / V.h };
        },
      };
    }
  }

  init();
})();
</script>
</body>
</html>
